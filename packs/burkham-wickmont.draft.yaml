# BUSINESS PACK — Burkham Wickmont · schema_version: 3 · **DRAFT, NOT LIVE**
#
# WHAT THIS IS, AND WHAT IT IS NOT
#
#   This is not the Burkham Wickmont Business Pack. No such Pack exists. What exists is
#   a platform decision record — `blueprint-v2.md` (1,150 lines) and
#   `specifications-v2.md` (657 lines) in the Console repository — and that is a
#   different document in a different schema answering different questions.
#
#   This file was written to answer one question: **what does the validator say about
#   Burkham?** That question needs an input, and there was none. Every value below is
#   drawn from the two Console documents where they say something, and is a placeholder
#   where they do not. The placeholders are the finding, not the values.
#
#   The `.draft.` in the filename is load-bearing. Do not promote this file. A real Pack
#   is authored by the people who can answer the questions this one guesses at, and
#   several of its answers are things only Ivan can decide.
#
# WHAT IS GUESSED, AND SO WHAT THE VALIDATOR OUTPUT MEANS
#
#   human_capacity, budget, capacity_demand, availability, KPI measurement sources and
#   data_retention are INVENTED. They are set to the most plausible small values so that
#   the rules which depend on them run at all — a Pack that fails to LOAD produces no
#   rule results, and a list of thirty schema errors is less useful than a list of the
#   rules that actually fail.
#
#   THE SCENARIO SET IS NOT INVENTED. IT IS ABSENT. — corrected 2026-09-07
#
#   This header listed it among the invented values, and it is not: `scenarios` is an
#   empty list. Zero, against 22 declared frameworks and 5 roles.
#
#   Absent is worse than invented, and the distinction matters to a reader deciding what
#   to trust. An invented value makes a rule pass on something untrue — bad, and the
#   paragraph below is the warning for it. An absent one makes the rule FAIL, which is
#   the honest outcome, and it means the work is not "replace a placeholder" but "author
#   the thing from nothing."
#
#   It is the only blocking gap. Confirmed by running the validator against this file:
#   V23 fails naming all five roles, V22 fails on runtime flags no scenario exercises,
#   and both are the same absence seen from two sides. Everything else invented above
#   PASSES.
#
#   So: a rule that FAILS here fails for a real structural reason. A rule that PASSES
#   here may be passing on an invented value. The failures are the signal.
#
# THE ONE THING THAT COULD NOT BE GUESSED
#
#   `source_department` must name a department the Village actually has. Burkham's ten
#   departments (Compliance & Evidence, CapitalForge Ops, Funding Strategy, Concierge
#   Desk, Risk & Defense, Channel Partnerships, Capital Operations, Founder/Executive)
#   intersect the Village's twelve at ZERO. Every position below therefore names a
#   Village department chosen as the nearest fit, and each choice is marked. That
#   mapping is a decision nobody has made.

schema_version: 3

identity:
  venture_name: Burkham Wickmont
  legal_entity: Burkham Wickmont LLC
  parent: Green Companies LLC
  operating_status: launching
  category: Business credit structuring and capital placement
  positioning_one_liner: >-
    Structured business credit and capital placement for operating companies, with
    every recommendation carrying the source of the rule behind it.

environment: sandbox

market:
  target_personas:
    - Operating business owner seeking working capital without a personal guarantee
    - Founder with strong personal credit and no business credit file
    - Partner accountant referring a client who was declined elsewhere
  target_geographies:
    - Nevada
    - California
    - New York
    - Texas
    - Florida
    - Arizona
    - Utah
  compliance_surface:
    # TEN frameworks, per specifications-v2 §6.3. Six of these had no value in the
    # schema until the enum was extended; `library_entry_ref` is omitted throughout
    # and `library_gap: true` set instead, because the Compliance Library ships EMPTY
    # — no entry is committed anywhere in this repository. Claiming a ref that
    # resolves to nothing is what V28 exists to catch.
    - framework: CROA
      jurisdiction: FEDERAL
      applies_when: Any discussion of a client's credit profile, score, tradelines or negative items
      runtime_flag: croa_perimeter_required
      library_entry_ref: compliance/not-a-credit-repair-organization-v1
    - framework: FTC_ACT
      jurisdiction: FEDERAL
      applies_when: Anything Burkham says about its own service, results or pricing
      runtime_flag: own_claims_discipline_required
      library_entry_ref: compliance/own-claims-and-pricing-v1
    - framework: UDAAP
      jurisdiction: FEDERAL
      applies_when: Any client-facing claim about approval, cost or outcome
      runtime_flag: client_interest_standard_required
      library_entry_ref: compliance/client-interest-standard-v1
    # TWO UDAAP rows, for the reason FCRA and FALSE_STATEMENT_TO_LENDER have two: a
    # standard and one absolute application of it are different obligations. The row
    # above is the standard - whether Burkham is optimising for the client's outcome,
    # judged case by case. This one is the single product where the answer was decided
    # in advance and does not vary: advances are not placed, at any fee.
    #
    # This is also the FIRST row in this Pack to carry a `library_entry_ref` rather than
    # `library_gap: true`. Twenty-two rows admit no entry exists; fourteen entries have
    # since been written and the Pack has not been updated to point at any of them. That
    # is a separate and larger correction, not made here.
    - framework: UDAAP
      jurisdiction: FEDERAL
      applies_when: Any point at which a merchant cash advance could be recommended, applied for or submitted
      runtime_flag: advance_placement_prohibited
      library_entry_ref: compliance/no-advance-placement-v1
    # REG_Z_ADVERTISING RETIRED 1 September 2026. specifications-v2 §6: "CFPB Regulation Z -
    # business-purpose credit exemption from most TILA, but card issuance and unauthorized-use
    # rules apply". Trigger terms are an advertising rule under the exempt part; the parts that
    # do apply are the ISSUER's obligations. Burkham's advertising is governed by
    # compliance/own-claims-and-pricing-v1 and the Marketing Claim Library, which already
    # carry "0% interest", "introductory rate" and "as low as" with required disclosures.
    # CFPB_1071 RETIRED 1 September 2026. specifications-v2 §6 puts the collection duty "at
    # the issuer level" and Burkham does not originate credit, so it is not a covered
    # financial institution. The real agent behaviour - what Burkham does with demographic
    # data an issuer collects through an application Burkham submits - is folded into
    # compliance/fair-treatment-in-routing-v1, which already governs protected-class data.
    - framework: STATE_COMMERCIAL_FINANCING_DISCLOSURE
      jurisdiction: [NY, UT, VA, GA, CT, FL]
      applies_when: Commercial financing offer presented in a disclosure state
      runtime_flag: estimate_not_offer_required
      library_entry_ref: compliance/estimate-not-offer-v1
    - framework: MCA_DISCLOSURE_CA_SB1235
      jurisdiction: [CA]
      applies_when: Commercial financing offer presented to a California business
      runtime_flag: estimate_not_offer_required
      library_entry_ref: compliance/estimate-not-offer-v1
    # TWO rows, as with FCRA. Authorization and truthfulness are different offences:
    # a truthful application nobody authorised and an authorised application that
    # misstates revenue are each a violation on their own.
    - framework: FALSE_STATEMENT_TO_LENDER
      jurisdiction: FEDERAL
      applies_when: Authorizing an application submitted to an issuer on a client's behalf
      runtime_flag: per_application_authorization_required
      library_entry_ref: compliance/application-authorization-v1
    - framework: FALSE_STATEMENT_TO_LENDER
      jurisdiction: FEDERAL
      applies_when: Preparing, populating or staging any field of a lender application
      runtime_flag: application_truthfulness_required
      library_entry_ref: compliance/application-truthfulness-v1
    - framework: CARD_NETWORK_RULES
      jurisdiction: FEDERAL
      applies_when: Any representation about card use, cash advance or fees
      runtime_flag: card_product_discipline_required
      library_entry_ref: compliance/card-product-characterisation-v1
    # TWO rows, one flag each. FCRA splits into authorization (before the pull) and
    # handling (after the report comes back), and a compliance_surface row can only
    # declare one runtime_flag. See compliance/bureau-report-handling-v1, which states
    # the split explicitly and excludes authorization from its own scope.
    - framework: STATE_LENDER_LICENSURE
      jurisdiction: ALL
      applies_when: Every engagement, in every state, from intake through placement
      runtime_flag: facilitator_status_required
      library_entry_ref: compliance/facilitator-not-broker-v1
    - framework: FTC_TSR
      jurisdiction: FEDERAL
      applies_when: Any Burkham-initiated contact with an individual, any channel
      runtime_flag: outbound_contact_boundary_required
      library_entry_ref: compliance/outbound-contact-boundary-v1
    - framework: ECOA
      jurisdiction: FEDERAL
      applies_when: Any decision on which lenders a client is shown, or whether to serve them
      runtime_flag: fair_treatment_required
      library_entry_ref: compliance/fair-treatment-in-routing-v1
    - framework: TWO_PARTY_CONSENT_RECORDING
      jurisdiction: [CA, FL, IL, MD, MA, MT, NH, OR, PA, WA, CT]
      applies_when: Any recorded call, whoever dialled
      runtime_flag: recording_consent_required
      library_entry_ref: compliance/call-recording-consent-v1
    - framework: TAX_ADVICE_SCOPE
      jurisdiction: FEDERAL
      applies_when: Any client interaction touching tax treatment
      runtime_flag: tax_advice_boundary_required
      library_entry_ref: compliance/tax-advice-boundary-v1
    - framework: FCRA
      jurisdiction: FEDERAL
      applies_when: Authorizing a consumer or business bureau pull
      runtime_flag: per_pull_authorization_required
      library_entry_ref: compliance/fcra-pull-authorization-v1
    - framework: FCRA
      jurisdiction: FEDERAL
      applies_when: Handling a bureau report once the Integration Layer has returned it
      runtime_flag: bureau_report_handling_required
      library_entry_ref: compliance/bureau-report-handling-v1
    - framework: GLBA
      jurisdiction: FEDERAL
      applies_when: Any Plaid connection or handling of client financial account data
      runtime_flag: per_connection_authorization_required
      library_entry_ref: compliance/glba-plaid-connection-v1
    - framework: CCPA
      jurisdiction: [CA]
      applies_when: Any California client exercising a privacy right
      runtime_flag: privacy_request_handling
      library_entry_ref: compliance/consumer-privacy-rights-v1
    - framework: STATE_PRIVACY_COMPREHENSIVE
      jurisdiction: [VA, CO, CT, UT]
      applies_when: Any client in a comprehensive-privacy state exercising a right
      runtime_flag: privacy_request_handling
      library_entry_ref: compliance/consumer-privacy-rights-v1
    - framework: REFERRAL_FEE_REGULATION
      jurisdiction: ALL
      applies_when: Any payout to a partner or referrer
      runtime_flag: referral_fee_permitted_in_state
      library_gap: true
      # Declared human-held 2026-09-08, ruling T-080. The reasoning is stated at
      # length below, above the scenario set - this is the same finding in the one
      # place a rule can read it. V22 now counts this flag as accounted for; whether
      # the obligation was actually discharged is V34's question and V34 fails until
      # a named human files a discharge. Gate 2 does not clear because of this line.
      human_held:
        why: >
          No position in this Pack has a duty that touches a payout. Intake captures
          agreements; Diagnostic pulls and computes; Placement matches, assembles and
          submits; Compliance scans, records and assembles; Stack monitors, recommends
          and tracks. None of them pays anybody. Writing a scenario would mean
          inventing a duty no role has and teaching an agent to perform an act no
          position authorizes. The obligation is real - partner payouts happen and
          something governs them - and it is a venture-operator act, held by a human.
        # Declared pending_activation 2026-09-08. The trigger is checkable, which is the
        # whole condition on this state: no referral fee has ever been paid, no partner
        # relationship exists, and Partner Agreement & Payout Center is deferred to V1.5.
        # A person can check whether that is still true. "When it becomes relevant" is
        # not a condition and would not be accepted here.
        #
        # V34 passes on this and says why. It does NOT say the obligation is discharged -
        # it says no verification is due yet. The moment the trigger fires this becomes
        # live_unverified and V34 fails until a named human files a discharge.
        pending_activation:
          activates_when: >
            Module 8.2 (Partner Agreement & Payout Center) activates and a referral
            relationship is being structured - whichever comes first. Until then no
            payout to a partner or referrer is possible, so no state's referral-fee
            rule has anything to attach to.
          deferred_to: >
            V1.5. Statutory analysis is scoped to state-activation counsel at the point
            the first referral relationship is structured, not before: the question is
            which states' rules apply to a payout that does not yet exist, and it cannot
            be answered until the relationship's shape is known.
    # Both of these were already in scope on a position and declared by no framework.
    # The Compliance Reviewer and the Stack Manager carry
    # trigger_term_disclosure_required, the Diagnostic Analyst carries
    # sb_lending_data_collection, and the flag is the join between a position and an
    # entry - so an agent held a flag with nothing behind it, and nothing reported that
    # because no rule reads compliance_flags_in_scope.
    - framework: REG_Z_ADVERTISING
      jurisdiction: FEDERAL
      applies_when: Any content reaching a person who has not engaged Burkham that
        states a rate, a payment, a term or a fee
      runtime_flag: trigger_term_disclosure_required
      library_entry_ref: compliance/reg-z-advertising-boundary-v1
    - framework: CFPB_1071
      jurisdiction: FEDERAL
      applies_when: Any point at which demographic or protected-class data about a
        small-business applicant could be collected, transmitted, retained or used
      runtime_flag: sb_lending_data_collection
      library_entry_ref: compliance/cfpb-1071-boundary-v1

engagement_model:
  service_lines:
    - service_line_name: Capital readiness and placement
      # The Console's Workflow Engine seeds phase-0 / phase-1 / phase-2 plus
      # post-funding follow-up. blueprint-v2 §2.2 describes Phase 0 through Phase 5.
      lifecycle_stages:
        - Intake
        - Diagnostic
        - Readiness
        - Placement
        - Funded
        - Stack management
      pricing_structure: hybrid
      revenue_model: hybrid
  conversion_events:
    - Client signs the engagement agreement
    - First funding round closes with an approved limit
  disqualification_criteria:
    - Client is on the Do Not Fund list
    - Client requests credit repair or removal of accurate derogatory information
    - Client will not provide per-application written authorization
  out_of_scope_at_launch:
    - Credit repair of any kind
    - Taking a lending position on the firm's own balance sheet
    - Consumer (non-business-purpose) credit

positions_required:
  # EVERY `source_department` below is a GUESS. Burkham's own department names exist
  # nowhere in the Village roster, and V29 checks against the live roster.
  - position_title: Intake Concierge
    reports_to: venture_operator
    duties:
      - Open the client file and capture the engagement agreement
      - Collect per-application, per-pull and per-connection authorizations
      - Answer client questions from approved scripts only
    forge_modules_operated: [client_read, client_read_pii, record_consent]
    source_department: operations       # Burkham calls this "Concierge Desk"
    compliance_flags_in_scope:
      [per_application_authorization_required, per_pull_authorization_required,
       per_connection_authorization_required]
    headcount: 2
    # Level 2 "Communicate with approval" is the Console's nearest equivalent.
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Intake]

  - position_title: Diagnostic Analyst
    reports_to: venture_operator
    duties:
      - Pull bank and bureau data under a recorded authorization
      - Compute the funding readiness assessment
      - Produce the diagnostic deliverable for compliance review
    # DECISION NEEDED. Two of this position's three modules are gone (see the
    # forge binding below), so its duties now exceed what it can operate: it can
    # pull bank data, not bureau data, and it cannot compute the readiness
    # assessment through a Forge at all. The duties above are left as written
    # rather than quietly narrowed - what this role is for is Ivan's call, not a
    # side effect of a module going away.
    forge_modules_operated: [statement_pull]
    source_department: banking          # Burkham calls this "CapitalForge Ops"
    compliance_flags_in_scope:
      [per_pull_authorization_required, bureau_report_handling_required,
       per_connection_authorization_required, sb_lending_data_collection]
    headcount: 2
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Diagnostic, Readiness]

  - position_title: Placement Strategist
    reports_to: venture_operator
    duties:
      - Match a ready client to approved providers using sourced issuer rules
      - Assemble the lender packet
      - Submit applications under written client authorization
    # lender_match and build_packet removed 2026-09-04. Neither exists in
    # CapitalForge under any spelling - see docs/decisions.md entry 4. This role's
    # first two duties above describe work no module performs, and they are left
    # standing on purpose: the duties are what Burkham wants done, and removing
    # them to match the code would hide the gap rather than record it.
    forge_modules_operated: [submit_application]
    source_department: banking          # Burkham calls this "Funding Strategy"
    # fair_treatment_required and advance_placement_prohibited added 2026-09-08
    # (ruling T-081). The four flags this role already carried are all about HOW AN
    # APPLICATION IS PREPARED - authorization, truthfulness, estimate-not-offer, card
    # product discipline. Neither of the two governing WHO IT GOES TO was here, and
    # those are this role's own acts: which lenders a client is shown (ECOA), and
    # whether an advance is placed at all (UDAAP). ps-003 already exercised both, so
    # the Pack was exercising obligations the position did not carry - the comment
    # above that scenario calls it the sharpest instance of B15's second direction.
    # The other six orphaned flags stay recorded and unassigned: each needs somebody
    # who knows which role's duties touch it, and guessing is how the department
    # mapping in entry 12 went wrong. See docs/decisions.md entry 24, docs/blocking.md
    # B15.
    compliance_flags_in_scope:
      [per_application_authorization_required, application_truthfulness_required,
       estimate_not_offer_required,
       card_product_discipline_required,
       fair_treatment_required,
       advance_placement_prohibited]
    headcount: 2
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Placement, Funded]

  - position_title: Compliance Reviewer
    reports_to: compliance_officer
    duties:
      - Scan outbound client communications before send
      - Record compliance state transitions
      - Assemble evidence bundles for review
    forge_modules_operated:
      [scan_communication, compliance_manifest_assemble, regulator_dossier_export]
    source_department: administration   # Burkham calls this "Compliance & Evidence"
    compliance_flags_in_scope:
      [client_interest_standard_required, own_claims_discipline_required,
       croa_perimeter_required,
       trigger_term_disclosure_required,
       card_product_discipline_required]
    headcount: 1
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Readiness, Placement]

  - position_title: Stack Manager
    reports_to: venture_operator
    duties:
      - Monitor promotional period expiry and utilisation
      - Recommend re-stacking windows
      - Track funding outcomes against the recommendation
    forge_modules_operated: [portfolio_health, restack_recommend]
    source_department: operations       # Burkham calls this "Capital Operations"
    compliance_flags_in_scope: [trigger_term_disclosure_required]
    headcount: 1
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Stack management]

  # ADDED 2026-09-09 by P-13, the FunnelForge binding.
  #
  # `trust_tier_ceiling: auto_execute` is the honest declaration and it is expected to
  # FAIL V31 on seven of this position's nine modules. Read that before changing it.
  #
  # §4.5 calls these sends Village-autonomous: nobody in the path. `auto_execute` is the
  # only tier that reaches a Forge at all - step 7 of the client library turns anything
  # below it into a proposal and makes no HTTP call - so declaring `propose` here would
  # not be a cautious version of autonomous send, it would be a different thing wearing
  # its name, and V31 would pass vacuously over a surface that never calls anything.
  #
  # Six sends plus the booking are mutating and `at_most_once` (an email leaves the
  # system and reaches a person; `EmailQueue` has no idempotency key that would
  # recognise a repeat), and V31 refuses `auto_execute` over exactly that shape. That
  # refusal is correct and must not be dodged by softening a declaration at either end.
  # What would change it is an idempotency key on FunnelForge's send path.
  # `capture_contact` (natural) and `read_funnel_analytics` (non-mutating) are the two
  # V31 permits. See docs/plans/funnelforge-binding-RECORD.md.
  - position_title: Marketing Operations Coordinator
    reports_to: venture_operator
    duties:
      - Send approved marketing templates in a Pass compliance state
      - Book Blueprint calls against the published appointment types
      - Record newsletter and gated-download contacts, and read funnel analytics
    forge_modules_operated:
      [send_intake_acknowledgment, send_scheduling_confirmation,
       send_deliverable_cover, send_followup_no_engagement,
       send_brief_cover, distribute_referrer_briefing,
       schedule_blueprint_call, capture_contact, read_funnel_analytics]
    source_department: marketing        # Burkham calls this "Marketing Ops"
    compliance_flags_in_scope: []
    headcount: 1
    trust_tier_ceiling: auto_execute
    lifecycle_stages_owned: [Intake, Diagnostic, Placement]


capacity_demand:
  agent_days_per_week: 40
  peak_concurrent_positions: 8
  shift_pattern: One venture per agent per quarter; 5 shifts/week
  ramp_schedule:
    - {week: 1, agent_days: 10}
    - {week: 4, agent_days: 40}

forge_dependencies:
  operating_forge: capitalforge
  training_forge: SimForge
  forge_bindings:
    - forge: capitalforge
      api_version: 2.0.0
      criticality: hard
      # bureau_pull and readiness_score removed 2026-09-01. Neither can be granted:
      #   bureau_pull      CapitalForge does not pull a bureau score and has no path to
      #                    one. Its own specification section 2 says so; SBSS is an input
      #                    an advisor types, not a value the system obtains.
      #   readiness_score  excluded in forge_module_exclusion. GET /api/readiness/:id
      #                    never reads the business - it scores from query parameters the
      #                    caller supplies and stamps the businessId on the answer.
      # They were declared at criticality:hard, so the Pack asserted the workflow could
      # not run without two modules that will never exist.
      # RECONCILED AGAINST THE ADAPTER 2026-09-03. The adapter's dispatch keys are
      # the spelling of record; where a Pack name and an adapter name disagree, the
      # Pack changes. Two names became five:
      #
      #   client_lookup     -> client_read, client_read_pii, client_read_credit
      #                        Split on 2 September by the boundary "regulated data
      #                        about a natural person". Three grants, three
      #                        permission sets; one id cannot address them.
      #   assemble_evidence -> compliance_manifest_assemble, regulator_dossier_export
      #                        Same permission and same reader, opposite blast radius:
      #                        one mints nothing and retries freely, the other mints an
      #                        exportId per call and is at_most_once.
      #
      # record_consent, submit_application, scan_communication and restack_recommend
      # keep their names - the adapter dispatches those spellings unchanged. Renaming
      # a workable name edits three artifacts to fix nothing.
      # lender_match and build_packet removed 2026-09-04, and this is a different
      # removal from the two above. bureau_pull and readiness_score were excluded -
      # they exist and may not be granted. These two DO NOT EXIST: no route, no
      # service, no handler, nothing under any spelling searched for. A name on this
      # list with nothing behind it reads as unauthored work rather than as absent
      # capability, and V11 and V32 were reporting them as gaps somebody forgot to
      # close. See docs/decisions.md entry 4 for what returns them.
      modules_expected:
        [client_read, client_read_pii, client_read_credit,
         record_consent, statement_pull,
         submit_application, scan_communication,
         compliance_manifest_assemble, regulator_dossier_export,
         portfolio_health, restack_recommend]
      compliance_flags_propagated:
        [per_application_authorization_required, per_pull_authorization_required,
         per_connection_authorization_required, client_interest_standard_required]
      fallback_behavior: halt
      rate_limit_policy: {max_rps: 4, burst: 10, backoff: exponential, on_429: queue}
      credential_mode: brokered
      cost_center: burkham-operations

    - forge: simforge
      api_version: 3.2.0
      criticality: hard
      # run_scenario_pack removed 2026-09-08 (ruling Q-1), reversing entry 5, which had
      # left it declared and unbound so V32 would point at it every run. Entry 5 assumed
      # the capability was wanted and merely unbuilt. Nobody had asked what it would buy,
      # and when asked the answer was nothing: SimForge certifies per module, so there is
      # no pack-level unit for a pack-level verdict to attach to. See docs/decisions.md
      # entry 25, which supersedes entry 5.
      modules_expected: [gate_result]
      compliance_flags_propagated: []
      fallback_behavior: halt
      rate_limit_policy: {max_rps: 1, burst: 3, backoff: linear, on_429: queue}
      credential_mode: brokered
      cost_center: burkham-training

    # ADDED 2026-09-09 by P-13. Nine modules, one per approved autonomous template plus
    # scheduling, contact capture and analytics.
    #
    # criticality: soft, and deliberately not hard. A hard binding asserts the workflow
    # cannot run without it; Burkham's capital work runs whether or not a marketing
    # email goes out, and `fallback_behavior: queue` says what happens instead. The
    # CapitalForge binding above was `hard` on two modules that do not exist, which is
    # the failure this avoids from the other direction.
    #
    # The seventh §4.5 template - the engagement letter cover email - is NOT here and
    # has no module. It is `human approve send` through Deliverable Approval Workflow
    # (Console module 3.4), which is not connected to the bridge. Its absence from this
    # list is the gate working, not an omission.
    #
    # SPELLING: every name below is a key in the adapter's dispatch map
    # (`adapters/funnelforge/modules.py`). The adapter is the naming authority and V32
    # resolves this list against it; a second spelling does not quietly work.
    - forge: funnelforge
      api_version: 1.0.0
      criticality: soft
      modules_expected:
        [send_intake_acknowledgment, send_scheduling_confirmation,
         send_deliverable_cover, send_followup_no_engagement,
         send_brief_cover, distribute_referrer_briefing,
         schedule_blueprint_call, capture_contact, read_funnel_analytics]
      # EMPTY BY DECISION, not by oversight. §6.2 and §6.3 cap FunnelForge at anonymous
