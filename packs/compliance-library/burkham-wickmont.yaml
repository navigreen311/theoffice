# COMPLIANCE LIBRARY — Burkham Wickmont
#
# ONE ENTRY IS WRITTEN. NINE ARE TEMPLATES FOR YOU TO FILL IN.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
#
#   Burkham's Pack declares ten compliance frameworks, each with a runtime_flag.
#   The Compliance Library has no entry for any of them, so all ten flags reach an
#   agent as a bare string — `per_pull_authorization_required` — with no condition,
#   no instruction, no escalation point and no citation behind it.
#
#   That is the "Documented." stub, one layer over. An entry that exists and says
#   nothing resolves the Pack's library_entry_ref, satisfies validator rule V28, and
#   clears Gate 6 — while the agent reading it learns nothing it can act on. The
#   claim of coverage becomes machine-verified and false.
#
#   `broker/compliance_quality.py` now refuses that shape. Run it before loading:
#
#       python -m scripts.check_compliance_library packs/compliance-library/*.yaml
#
# ---------------------------------------------------------------------------
# THE SIX FIELDS, AND THE THREE THAT ARE EASY TO GET WRONG
#
#   entry_ref     The stable id a Pack resolves against. Never reuse or renumber:
#                 a Pack pinned to `compliance/glba-plaid-v1` must keep meaning what
#                 it meant. A changed rule is a NEW entry at -v2.
#
#   framework     One value from the Pack schema's ComplianceFramework enum.
#
#   jurisdiction  A list. `["FEDERAL"]`, `["ALL"]`, or two-letter state codes.
#                 This decides whether the entry binds a given client at all.
#
#   The three below answer three DIFFERENT questions, and the common failure is
#   answering the first one three times.
#
#   applicability_rule
#       WHEN does this bind? A condition an agent can evaluate against the case in
#       front of it. Not "this applies to bank data" — that is a topic. Write the
#       circumstance: "when the client connects a bank account through Plaid".
#
#   agent_behavior_implication
#       WHAT DOES THE AGENT DO DIFFERENTLY? This is the whole point of the entry and
#       the field most often filled with a restatement of the law. If you could delete
#       this field and the agent would behave identically, it is not written yet.
#       It must contain an instruction: must / must not / obtain / record / refuse.
#
#   escalation_trigger
#       WHEN DOES THE AGENT STOP and hand to a human? Also a condition. "Escalate as
#       needed" is not one.
#
#   citation      A statute, section, rule or URL. A framework name is not a citation:
#                 an agent asked "on what authority" cannot answer from "GLBA".
#
#   runtime_flag  Must match the Pack's `compliance_surface[].runtime_flag` EXACTLY.
#                 The flag is the join between the Pack and this entry; a typo means
#                 the Pack declares a framework that resolves to nothing.
#
#   depends_on    OPTIONAL, authoring-file only, never POSTed. What must exist
#                 elsewhere before this entry can actually fire. An entry that defers
#                 to a per-jurisdiction variant, an approved phrase, or a capability
#                 declares it here:
#
#                   depends_on:
#                     - kind: state_activation
#                       description: >-
#                         One sentence on what "satisfied" means for this dependency.
#                       required_for: [CA, NY, UT]
#                       satisfied_for: []
#                       blocking: true
#
#                 `check_compliance_library.py` refuses `status: approved` while any
#                 blocking dependency is unmet, and reports BLOCKED. This is the
#                 `status: draft` guard one layer out: a draft entry is honest about
#                 not being ready, and an approved entry that cannot fire is not.
#
#                 `satisfied_for` is maintained by hand, because this checker runs
#                 without a database on purpose. Update it as states go live.
#
#   claim_provenance
#                 OPTIONAL, authoring-file only, never POSTed. Per CLAIM, not per
#                 entry — an entry is a mixture, and an entry-level tag would round
#                 the mixture to whichever tag the author felt best about.
#
#                   claim_provenance:
#                     - claim: "Short label for the specific assertion."
#                       tag: sourced          # source:    what it is traceable to
#                     - claim: "Another."
#                       tag: reconstructed    # basis:     what it was shaped from
#                     - claim: "A third."
#                       tag: proposed         # review_by: who decides
#
#                 sourced        traceable to a locked decision, an approved phrase,
#                                a statute, or a line in a specification. `source`
#                                names the thing, specifically enough to check.
#                 reconstructed  shaped from context with no source behind it. It may
#                                be right. Nobody has agreed to it. `basis` says what
#                                it was shaped from, so it can be argued with.
#                 proposed       a recommendation awaiting a decision. `review_by`
#                                names who decides, not "someone".
#
#                 The supporting field is MANDATORY for its tag, and the checker
#                 refuses a claim without it. This mirrors the Recommendation
#                 Engine's `issuer_rule` versus `unresearched_default`, and mirrors
#                 the part that matters: there, `profile.ts` THROWS on an
#                 unresearched default with no `rationale`. A tag whose support is
#                 optional is a tag applied to everything.
#
#                 A statutory obligation restated is `sourced` to the statute. The
#                 BEHAVIOUR an agent takes because of it is almost never in the
#                 statute, and is `reconstructed` unless a Decision or a
#                 specification line states it. That distinction is where most of
#                 this library actually sits.
#
# ---------------------------------------------------------------------------
# AMENDMENT HISTORY — THERE IS NONE. Read this before promising one.
#
#   An entry loosened later cannot currently be reconstructed as it was.
#
#   `compliance_library_entry` has `entry_ref` as its PRIMARY KEY, no version column,
#   and `author_compliance_entry` writes ON CONFLICT DO UPDATE. An amendment
#   OVERWRITES the prior text in place. The audit entry that accompanies it carries
#   only `entry_ref` and `runtime_flag` — that the entry changed, never what it
#   changed from or to.
#
#   Two consequences worth having in front of you while writing:
#
#   1. The Compliance Library lives in THE OFFICE, not the Console. An amendment
#      never reaches the Console's Event Ledger. It lands in the Office audit_log,
#      which is correct — the library is portfolio-wide — but a note promising an
#      Event Ledger record is naming the wrong store.
#
#   2. Certifications bind to an instruction set's `content_hash`, so rewriting
#      instructions makes every certification against them stale. NOTHING equivalent
#      exists for a library entry. Loosen one and it silently changes what "compliant"
#      meant for every deliverable already assessed against it, retroactively, with no
#      staleness signal anywhere.
#
#   Until that is fixed, THIS FILE is the amendment history: it is version-controlled,
#   the diff is the record, and an entry's `notes` are where the reasoning lives. Keep
#   the file as the source of truth and load FROM it — never edit an entry directly
#   through the API, or the only history there is disappears.
#
#   The Console's own Marketing Claim Library does have `version` and a `deprecate`
#   lifecycle. The gap is on the Office side only.
#
# ---------------------------------------------------------------------------
# CONTROLS THAT ARE REFERENCED BUT HAVE NO CONTENT
#
#   Three have been found while writing these entries. Each was cited AS COVERAGE —
#   in this library and in the specifications — and none exists. They are listed
#   here because the failure is a pattern rather than three accidents, and because an
#   entry that leans on one is claiming a protection nobody has written.
#
#   THE FUNDING ETHICS FIREWALL'S FIVE ETHICAL RULES.
#
#     blueprint-v2 §6.2: "Automated enforcement of five ethical rules on placement
#     eligibility." That sentence is the ONLY mention of them across both reference
#     documents, 1,807 lines. They are never enumerated.
#
#     Nor implemented. `packages/firewall/src/index.ts` exposes status, trigger,
#     clear and evaluate: a per-client triggered/clear flag whose `trigger` takes an
#     arbitrary `reason` string, plus the Decision E coupling to compliance state.
#     A flag a human or an agent sets — not five conditions evaluated. The package
#     has exactly one commit, the original walking-skeleton spine, and has not been
#     revisited. Git history shows the phrase entering with the specification and
#     never being elaborated. There is no ethics or firewall service in CapitalForge
#     either.
#
#     The reliance is wide. The Firewall is named 21 times across the two reference
#     documents, is a declared dependency of the Recommendation Engine (5.3), Risk &
#     Defense (6.1) and Do Not Fund Governance (6.4), is given precedence over ALL
#     placement modules by design principle 7, and sits at step 4 of the middleware
#     chain that every client-facing action passes through.
#
#     The count is what made it citable. "Five rules" reads as a known set, so an
#     author reaches for "rule 4" — which is what happened in
#     compliance/client-interest-standard-v1 before review. An unenumerated control
#     with a number attached is worse than one with no number: the number implies
#     somebody wrote them down.
#
#   THE FUNDING READINESS SCORE'S COMPONENTS.
#
#     Three mentions across both documents, none of them a specification: an Event
#     Ledger event type, one line in a flow diagram, and a KPI. No module section,
#     no component list. The phrase "eight components" appears in no document, and
#     no scorer with eight components exists in any repository — CapitalForge has a
#     five-component scorer and a separate four-dimension one.
#
#   THE "2.3 HYBRID WORKFLOW" FOR BOTH-FOUNDER APPROVAL.
#
#     Four entries defer approval of a phrase or a disclosure to it —
#     estimate-not-offer-v1, not-a-credit-repair-organization-v1,
#     own-claims-and-pricing-v1 and card-product-characterisation-v1 — variously as
#     "the 2.3 hybrid workflow", "the 2.3 approved-list workflow" and "the 2.3
#     workflow".
#
#     specifications-v2 §2.3 is "What the Console owns vs. what it calls": eight
#     owned capabilities and thirteen called ones. An ownership boundary. It contains
#     no workflow, no approval step and no mention of founders. The words "hybrid"
#     and "both-founder" appear nowhere in the document.
#
#     The real mechanism is line 386: "Marketing claims — versioned in Marketing
#     Claim Library, Compliance Review Board approval required." One board, not two
#     founders, and no section number. Every entry deferring to "2.3" should defer to
#     Compliance Review Board approval instead — the entries are NOT edited here,
#     because the deferral is the author's decision to restate, not the reviewer's.
#
#     This one differs from the other two in a way worth naming. The Firewall's rules
#     and the Readiness Score's components are things that were described and never
#     written. This is a real section cited for something it does not contain — the
#     citation is wrong rather than the target empty. It found its way in the same
#     way "rule 4" did: a section number reads as a checkable reference, so nobody
#     checks it.
#
#   WHAT TO DO WITH THEM. None is a library entry's job to fix. Both are recorded
#   The first two are recorded as `depends_on` on the entries that need them, so an
#   entry cannot reach `approved` while leaning on something unwritten. Enumerating
#   the five rules and specifying the score's components are specification work, and
#   until that lands an entry must say "held by this entry and human judgement"
#   rather than "covered by the Firewall". The third needs no dependency — the
#   approval mechanism exists, and only the citation pointing at it is wrong.
#
# ---------------------------------------------------------------------------
# A TEST FOR WHETHER AN ENTRY IS FINISHED
#
#   Read only `agent_behavior_implication` and ask: could a competent agent that had
#   never heard of this framework do the right thing from this sentence alone?
#
#   If it needs the citation to know what to do, the implication is not written yet.

entries:

  # =========================================================================
  # WORKED EXAMPLE — complete. Use this as the shape.
  #
  # GLBA is the one the schema could not express at all until this week, and it is
  # engaged on Burkham's FIRST client: Decision A makes Plaid the V1 statement source,
  # so every diagnostic touches it.
  # =========================================================================
  - entry_ref: compliance/glba-plaid-connection-v1
    framework: GLBA
    jurisdiction: [FEDERAL]
    runtime_flag: per_connection_authorization_required

    applicability_rule: >-
      When the client is asked to connect a financial account through Plaid, and on
      every subsequent call that reads data from that connection. It binds per
      connection and per institution, not per client: a client who connects a second
      bank has not authorized the second one by having authorized the first.

    agent_behavior_implication: >-
      The agent must obtain a written authorization that names the specific
      institution being connected, and must record it before calling
      statement_pull for that connection. The authorization is per connection — the
      agent must not reuse an authorization captured for a different institution, and
      must not treat the engagement agreement as covering it. If a stored
      authorization is revoked or expired, the agent must stop reading from that
      connection immediately rather than finishing the current diagnostic. The agent
      must never present the connection step as optional-to-authorize; connecting and
      authorizing are one act and are refused separately.

    escalation_trigger: >-
      When the client declines authorization for an institution the diagnostic needs,
      when a stored authorization is revoked mid-engagement, or when Plaid returns
      account data for an institution the recorded authorization does not name. In all
      three the agent stops and hands to the venture operator — the third is a data
      handling incident, not a retry.

    claim_provenance:
      - claim: "GLBA obligations attach to Plaid connections"
        tag: sourced
        source: "specifications-v2 §6.3: 'GLBA (indirect) — Plaid connections carry Gramm-Leach-Bliley obligations; per-connection authorization required per Decision A'"
      - claim: "Authorization is per connection and per institution, not per client"
        tag: sourced
        source: "Decision A, specifications-v2 §6.3 'per-connection authorization'"
      - claim: "The authorization must be WRITTEN and name the specific institution"
        tag: reconstructed
        basis: "Decision A says per-connection; 'written' and 'names the institution' are shaped from the per-application written-authorization pattern in §6.3, not stated for Plaid"
      - claim: "Recorded BEFORE calling statement_pull, and not reusable across institutions"
        tag: reconstructed
        basis: "ordering and the reuse prohibition follow from per-connection scope; no source states either"
      - claim: "A revoked authorization stops reading mid-diagnostic rather than finishing"
        tag: reconstructed
        basis: "shaped from @bwc/consent's revocation-propagates behaviour, which freezes dependent workflows; the mid-diagnostic specificity is not in code or spec"
      - claim: "Connecting and authorizing are one act, refused separately"
        tag: reconstructed
        basis: "shaped from the consent store's refusal of an unscoped consent; no source frames connection this way"
      - claim: "The heavier disclosure is DISCLOSURE_UNRESEARCHED_DEFAULT verbatim"
        tag: sourced
        source: "packages/core/src/provenance.ts — describeProvenance is built from the constant; step 7 matches it exactly"

    citation: >-
      Gramm-Leach-Bliley Act, 15 U.S.C. §§ 6801–6809; Privacy Rule, 16 C.F.R. Part 313;
      Safeguards Rule, 16 C.F.R. Part 314.

  # =========================================================================
  # NINE TO WRITE.
  #
  # Each carries the runtime_flag from the draft Pack, so the join is already correct.
  # Delete the TODO markers as you fill each one in — the quality check refuses any
  # entry that still carries one.
  # =========================================================================

  # =========================================================================
  # WRITTEN BY IVAN. FCRA is split in two: authorization is upstream and belongs to
  # the Consent & Authorization Center; this entry governs what happens to a report
  # once it has come back. The Pack now carries two FCRA rows to match — one flag
  # each — because a single row can only declare one runtime_flag.
  #
  # `jurisdiction` corrected to a list. As a scalar it reads as absent, and the
  # jurisdiction list is what decides whether an entry binds a given client at all.
  # =========================================================================
  - entry_ref: compliance/bureau-report-handling-v1
    framework: FCRA
    jurisdiction: [FEDERAL]
    runtime_flag: bureau_report_handling_required

    applicability_rule: >-
      Any handling of a returned bureau report — business or personal. Covers both
      business_bureau_pull and personal_credit_pull; the agent's obligations are
      identical and only the consent kind differs.

      Fires when a report has been returned by the Integration Layer, not when a pull
      is requested. Authorization is upstream and belongs to the Consent &
      Authorization Center: if the client declines or an authorization has expired,
      the pull does not happen and this rule is never reached.

    agent_behavior_implication: >-
      THE AGENT MAY: use the report as input to the Funding Readiness Score with
      provenance preserved; reason over specific findings internally; include derived
      characterizations in client deliverables; enter specific figures from the report
      onto a lender application form where that form requires them; store the report in
      the Secure Document Vault under Regulatory Engine retention.

      THE AGENT MUST NOT:

      1. Share the raw report outside the client's authorized viewers. Not with
      lenders, not with partners, not with other Green Companies ventures, and not in a
      cross-portfolio handoff artifact, unless the client authorized that specific
      document flow.

      2. Attach the raw report to a lender packet. The distinction is exact: the report
      says PAYDEX 72, so the agent enters 72 on the application — that is correct.
      Attaching the D&B report to the SBA package is not. Lenders pull their own.

      3. Hold the report past the Regulatory Engine's state-specific retention.

      4. Render the raw report as a Burkham deliverable. The agent may characterize it
      in Burkham's own analytical language; it may not reproduce the vendor's output as
      Burkham's assertion of the client's creditworthiness. "Here is what Nav returned"
      is redistribution; a Funding Readiness Score incorporating bureau data as one
      component among several is a deliverable.

      Where the boundary between a figure and a reproduction is unclear — a reformatted
      tradeline table, a PAYDEX with its reason codes — the agent characterises in
      Burkham's own analytical language rather than reproducing vendor formatting. This
      tie-break governs DELIVERABLES. It does not narrow the permission above to enter
      specific figures onto a lender application form: a form has fields and cannot be
      characterised into, so where the form requires a figure the agent enters it.

      5. Use the report for any purpose beyond the one the client authorized. The
      per-pull authorization scopes the use. Repurposing the same pulled data — an
      anonymised marketing case study, for instance — requires fresh authorization.

      VISIBILITY: agents assigned to this client's engagement, Human Compliance &
      Evidence on approval workflows, and founders on escalation. Not agents outside the
      engagement, not cross-venture agents, not partners under any co-brand or
      white-label arrangement.

    escalation_trigger: >-
      A returned report carrying a fraud alert, a credit freeze indicator, an identity
      mismatch, or an open dispute flag MUST NOT be fed into Funding Readiness Score
      computation. The agent routes to Human Approval Console for reviewer disposition,
      and the Compliance Evidence Vault records the flag, the routing and the
      resolution.

      These are not scoring inputs. Each is a signal about whether the file is the
      client's and whether it can be relied on.

      FRAUD ALERT — the bureau is signalling the file may be compromised. Scoring
      against it either produces a wrong result or acts on data fraudulently attributed
      to the client.

      CREDIT FREEZE — the report reflects what the bureau could return without lifting
      the freeze. Portions may be absent. Do not compute against partial data as though
      it were complete.

      IDENTITY MISMATCH — name, address, date of birth or EIN not matching onboarding
      data. Stop unconditionally. Either the client's identity is compromised or
      somebody is misrepresenting themselves, and both carry 18 USC §1014 exposure.

      DISPUTE FLAG — the disputed item must not be scored as settled. Scope varies and
      the reviewer decides: score without the item, exclude and re-score, or wait for
      resolution.

    citation: "15 U.S.C. § 1681 et seq. (FCRA); 18 U.S.C. § 1014"

    claim_provenance:
      - claim: "FCRA-adjacent obligations attach to bureau pulls"
        tag: sourced
        source: "specifications-v2 §6.3: 'FCRA (indirect) — bureau data pulls carry FCRA-adjacent obligations; per-pull authorization required per Decision B'"
      - claim: "Business bureau and personal credit are separate authorizations"
        tag: sourced
        source: "Decision B; @bwc/consent kinds business_bureau_pull and personal_credit_pull"
      - claim: "Obligations after a returned report are identical for business and personal"
        tag: reconstructed
        basis: "no source distinguishes handling by report type; asserted from the two consent kinds differing only in subject"
      - claim: "The agent may enter figures from a report onto a lender form but not attach the report"
        tag: reconstructed
        basis: "the PAYDEX-72 distinction is shaped from the redistribution concern; no vendor TOS or spec line states it"
      - claim: "Raw report never leaves the authorized viewer set"
        tag: reconstructed
        basis: "shaped from design principle 5, strict multi-tenant isolation, extended to vendor data"
      - claim: "Retention is state-specific and engine-resolved"
        tag: sourced
        source: "packages/retention/src/schedules.ts — stateCode on retention schedules, validated two-letter"
      - claim: "A report carrying fraud alert, freeze, mismatch or dispute is not a scoring input"
        tag: proposed
        review_by: "Compliance & Evidence — three of the four map to existing ObservationKinds; identity_mismatch has none and the routing rule is new"
      - claim: "The raw-report prohibition holds regardless of vendor TOS"
        tag: proposed
        review_by: "both founders — recorded as DECIDED in the entry, pending the per-vendor TOS review delegated to Compliance & Evidence"

    status: draft_pending_claim_library_approval

    notes: >-
      DECIDED — the raw-report prohibition is a deliberate restrictive default, not an
      unverified assumption. It holds regardless of vendor TOS. Rationale: a permissive
      default tied to vendor terms means a TOS tightening puts Burkham out of compliance
      by inaction, and TOS silence is not TOS permission.

      DELEGATED — Village Compliance & Evidence to document, per bureau vendor, what the
      TOS says about redistribution to third parties, retention obligations, purpose
      limitation, consent requirements beyond the initial pull authorization, and vendor
      audit rights. Filed in Compliance Evidence Vault. If it returns clean permission to
      forward, loosening is proposed through the 2.3 approved-list workflow with both
      founders — an explicit amendment, recorded, not operational drift.

      RESOLVED — the line between characterising a report and rendering it. The
      ambiguous case now has a stated tie-break rather than waiting on Claim Library
      approval: where the boundary is unclear, characterise. It is the restrictive
      default, consistent with the DECIDED reasoning above, and it means an agent
      meeting a reformatted tradeline table has a rule instead of a judgement call.

      NOT AUTOMATED, and this one cannot be. Nothing detects "vendor formatting" — the
      scanner matches phrases and lender-product numbers, and a reproduced tradeline
      table is neither. This rule is enforced by the agent reading it and by the
      Deliverable Approval Workflow at 3.4, not by a check. Stated so nobody later reads
      the entry's presence as coverage.

      NOTED — dispute-flag handling is deliberately stated as a concept rather than a
      rule. A dispute on a twenty-year-old resolved tradeline is not the same as one on
      the client's primary banking relationship, and the specifics should evolve through
      Compliance & Evidence rather than be guessed now.

      SEPARATE FINDING — no soft/hard pull distinction exists anywhere in the code. If
      Burkham does soft pre-qualification pulls and hard pulls at application, the system
      cannot tell them apart. That is a data-model gap, not a library gap, and it should
      be raised independently of this entry.

      SEPARATE FINDING — three of the four escalation flags already exist as
      ObservationKind in @bwc/risk: fraud_alert, freeze and dispute. Identity mismatch
      has no kind. What is missing is not the vocabulary but the path: the bureau adapter
      returns not_built with no return shape, so nothing carries a flag from a report
      into an observation. Belongs with the soft/hard pull gap.

      RAISED BY REVIEW — an amendment to this entry is not currently recoverable. The
      Compliance Library lives in The Office, not the Console, so an amendment never
      reaches the Console Event Ledger. In The Office it is an upsert on entry_ref with
      no version column, so the prior text is overwritten, and the audit entry carries
      only entry_ref and runtime_flag rather than what changed. See AMENDMENT HISTORY at
      the head of this file.

