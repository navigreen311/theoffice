  # WRITTEN BY IVAN. Pack row retargeted from `network_rule_language_required` to
  # `card_product_discipline_required`. `jurisdiction` corrected to a list — sixth
  # time.
  #
  # The Level 4 claim is qualified in place, and a `depends_on` records the two
