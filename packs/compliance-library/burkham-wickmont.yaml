  # WRITTEN BY IVAN. The Pack gained a STATE_LENDER_LICENSURE row; it declared none.
  #
  # `jurisdiction` is [ALL] rather than the seven-plus-"+". The rule binds in every
  # state — that is what "every engagement, in every state" means — and the seven
  # are where a finding is being sought, which belongs in depends_on rather than in
  # the jurisdiction list. A "+" in a jurisdiction list binds nothing.
  # =========================================================================
  - entry_ref: compliance/facilitator-not-broker-v1
    framework: STATE_LENDER_LICENSURE
    jurisdiction: [ALL]
    runtime_flag: facilitator_status_required

    applicability_rule: >-
      Every engagement, in every state, from intake through placement. Governs how
      Burkham characterises itself, how it is compensated, what its agents do with a
      lender, and whether it may operate in a given state at all.

      NOT A BOUNDARY ENTRY. The credit repair, tax and outbound entries describe services
      Burkham does not provide. This describes the service Burkham does provide, and
      whether that activity requires a licence is a per-state question with no single
      answer.

      "WE ARE NOT A LENDER" IS THE WRONG CLAIM. Nobody alleges Burkham lends. The
      exposure is broker licensure: several states license anyone taking compensation for
      arranging credit, regardless of whose money funds it. Burkham charges a success fee
      contingent on placement — which is the definition, not a distance from it. The
      contingent structure makes the question sharper, not softer.

    agent_behavior_implication: >-
      FOUR STRUCTURAL DISCIPLINES. Each supports the position that Burkham facilitates
      rather than brokers. Each must hold continuously; any one breaking requires
      re-analysis of the whole perimeter.

      1. NEVER TOUCH THE MONEY. Burkham does not receive, hold, escrow, disburse or
      otherwise handle client capital at any point. Clients pay Burkham for its service;
      lender approvals disburse directly from lender to client. This is load-bearing for
      more than broker status — handling funds reaches money transmission, custody and
      potentially banking regulation.

      2. NEVER TAKE LENDER-SIDE COMPENSATION. Fees come from the client only. No lender
      referral fee, no origination participation, no volume arrangement, no economic
      relationship with the lender in either direction.

      3. NEVER NEGOTIATE TERMS. Burkham's role is preparation, packaging, coordination
      and submission. Agent contact with a lender's underwriters is scoped to
      documentation clarification, timing, and advocacy for approval on the client's
      circumstances. Pushing for a lower rate, different covenants or an altered
      structure is term negotiation, and in several states that is exactly the licensed
      activity.

      4. FEES ARE FOR FACILITATION, NOT FOR AN OUTCOME. The engagement documents, the fee
      exhibit and every description of the success fee must be clear that compensation is
      for the facilitation service performed, not consideration for arranging a specific
      credit outcome. This is a documentation discipline, not merely a phrasing
      preference.

      TWO OF THESE HOLD BY ABSENCE TODAY, WHICH IS NOT THE SAME AS BEING ENFORCED.
      Nothing in the system models client capital — no escrow, no disbursement, no
      custody — so discipline 1 cannot currently be broken. Nothing models compensation
      flowing FROM a lender either; the fee model on an offering describes what the
      lender charges the client, and partner payouts run outward. A discipline that holds
      because the capability is missing is one a future feature breaks silently, which is
      what trigger 2 exists for.

      NEVER CALLED A BROKER. Not by Burkham, not in a deliverable, not in partner
      material. The approved characterisation is that Burkham helps identify suitable
      funding options and prepares and submits applications on the client's
      authorisation.

      That said — declining the label does not decide the question. A state characterises
      activity by what is done, not by what it is called.

      NO SERVICE IN A STATE WHOSE BROKER TREATMENT IS UNREVIEWED. Counsel review must
      return one of four findings per state:

      - permitted without registration

      - permitted with structural tightening — and the tightening named

      - registration required

      - not activatable

      Until a state has one of those four on record, Burkham does not serve clients there.

      THIS IS A SECOND GATE, NOT THE EXISTING ONE. The Regulatory Engine's activation
      gate answers "has counsel reviewed this state's disclosure module". That is a
      different question from "may Burkham operate here at all", and a state can pass the
      first while the second is untouched. An agent must not read `active` as answering
      this entry. See notes.

    escalation_trigger: >-
      1. When output characterises Burkham as a broker, loan broker or credit broker.
      Refuse; rewrite to the approved characterisation.

      2. When any feature, workflow or arrangement is proposed that would put Burkham in
      position to receive, hold, escrow or disburse client capital. Compliance Review
      Board immediately. This is a structural change requiring re-analysis of the entire
      perimeter, not a product decision — and it is the trigger that matters most,
      because discipline 1 currently holds only because nothing implements the capability.

      3. When an agent's contact with a lender moves from clarification and advocacy into
      term negotiation. Route for a determination on whether it crosses the line in that
      client's state.

      4. When a client is in a state whose broker treatment has not been counsel-reviewed.
      No service.

      5. When the client requests something that would be brokerage in their state — term
      negotiation, lender-side representation. Compliance Review Board decides whether it
      can be accommodated within the structural disciplines or must be refused.

      6. When any compensation change is proposed that introduces lender-side economics.
      Compliance Review Board immediately; it changes the analysis fundamentally.

      7. When any regulatory inquiry touches broker status — a state regulator question, a
      complaint alleging unlicensed brokerage. Compliance Review Board and outside
      counsel. Do not respond without counsel.

      8. When an external source characterises Burkham as a broker — trade press, an
      industry directory, a partner's own marketing. Third-party characterisation creates
      exposure regardless of Burkham's own language. Review whether correction is
      required.

    depends_on:
      - per-state broker treatment analysis by outside counsel, one of four findings per state
      - a broker-treatment field on the Regulatory Engine state module, distinct from activation status
      - a second gate refusing service in a state whose broker treatment is unrecorded
      - engagement and fee documentation stating compensation is for facilitation
      - scanner detection of term-negotiation language in lender-facing agent contact

    citation: "Cal. Fin. Code Div. 9 (CFL); N.Y. Banking Law art. 12-D; Fla. Stat. ch. 494; state commercial loan broker statutes generally"

    claim_provenance:
      - claim: "State broker licensure reaches compensation for arranging credit"
        tag: sourced
        source: "Cal. Fin. Code Div. 9; N.Y. Banking Law art. 12-D; Fla. Stat. ch. 494"
      - claim: "California and Florida modules already flag broker conduct for counsel"
        tag: sourced
        source: "packages/regulatory/src/seed.ts — CA summary 'Broker conduct and compensation disclosure require counsel attention', ca_broker_compensation and fl_broker_conduct disclosures"
      - claim: "Burkham charges a success fee contingent on placement"
        tag: sourced
        source: "packages/billing/src/engagements.ts successFeeBasisPoints"
      - claim: "'We are not a lender' answers the wrong question"
        tag: reconstructed
        basis: "shaped from the licensure definitions above; the specs' locked language is the lender claim and no source makes this distinction"
      - claim: "Four structural disciplines support the facilitator position"
        tag: proposed
        review_by: "outside counsel — the entry states the specs do not address broker licensure at all"
      - claim: "Nothing models client capital or lender-side compensation"
        tag: sourced
        source: "no escrow, disbursement or custody anywhere in the Console; feeModel on an offering is the lender's charge to the client; partner payouts run outward"
