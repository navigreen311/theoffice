# COMPLIANCE LIBRARY — Burkham Wickmont
#
# SIXTEEN ENTRIES. NONE IS A TEMPLATE.
#
# The four that were templates were resolved on 1 September 2026, and not all in the
# same direction:
#
#   fcra-pull-authorization-v1        WRITTEN. bureau-report-handling-v1 scopes itself
#                                     out of authorization explicitly and relies on
#                                     this existing.
#   application-authorization-v1      WRITTEN. The Pack states the split: a truthful
#                                     application nobody authorised and an authorised
#                                     application that misstates revenue are separate
#                                     violations.
#   reg-z-trigger-terms-v1            RETIRED. specifications-v2 §6 records a
#                                     business-purpose exemption from most of TILA;
#                                     trigger terms sit in the exempt part.
#   cfpb-1071-data-collection-v1      FOLDED into fair-treatment-in-routing-v1. The
#                                     collection duty is the issuer's; what Burkham
#                                     does with the data passing through it is not.
#
# Two of the four were entries for frameworks that do not bind this firm. Writing them
# would have been the coverage-claim defect pointing the other way: a control asserting
# an obligation nobody has.
#
# ---------------------------------------------------------------------------
# THE THREE DOCUMENTS THIS FILE CITES, AND WHERE THEY LIVE
#
#   They are in two repositories, and that is deliberate rather than a mistake
#   waiting to be tidied: each document lives with its readers.
#
#   specifications-v2.md          Operations Console repo, docs/reference/
#   blueprint-v2.md               Operations Console repo, docs/reference/
#
#     The Console's canonical scope. Its CLAUDE.md names both as the definition
#     of what the system is, its README links them, and `/impl-feature`
#     instructs reading the module's section before designing anything. Eleven
#     in-repo references depend on those paths. Moving them here to sit beside
#     the third would break the way that repository is built, to fix a
#     convenience for this one.
#
#   burkham-wickmont-marketing-plan-intake.md    THIS repo, docs/reference/
#
#     Zero readers in the Console. It is not a specification of anything the
#     Console does — it is a marketing and compliance intake document, and the
#     only artifact that reads it is this library. It is tracked here as of
#     31 August 2026; before that it existed in one person's Downloads folder,
#     untracked, while three entries cited it as a source.
#
#   HOW TO CITE ANY OF THEM. Document name, then section, then the phrase, in
#   quotes:
#
#     Marketing Plan Intake §4.2 Claims we make, item 8: "Flat success fees on
#     approved and funded capital, not percentage-of-limit."
#
#   NOT a line number, and NOT a repository-relative path. Both were in this
#   file and both were wrong in their own way:
#
#     · Two citations read a repository-relative path into blueprint-v2.  That path
#       did not
#       exist in this repository. It resolved only for a reader who happened to
#       be standing in the Console, and had been wrong here since it was written.
#
#     · Fifteen cited line numbers. All of them still resolved, by luck: the
#       edit made to the Marketing Plan on 31 August replaced two lines in place
#       and added none. One line inserted anywhere above the first citation
#       would have silently invalidated six of them, and nothing would have
#       reported it.
#
#   A quoted phrase survives an edit that does not change the sentence. If the
#   sentence DOES change, that is a fact this library should notice rather than
#   a citation that should keep resolving.
#
#   `scripts/check_compliance_library.py` refuses both discarded forms.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
#
#   Burkham's Pack declares ten compliance frameworks, each with a runtime_flag.
#   The Compliance Library has no entry for any of them, so all ten flags reach an
#   agent as a bare string — `per_pull_authorization_required` — with no condition,
#   no instruction, no escalation point and no citation behind it.
#
#   That is the "Documented." stub, one layer over. An entry that exists and says
#   nothing resolves the Pack's library_entry_ref, satisfies validator rule V28, and
#   clears Gate 6 — while the agent reading it learns nothing it can act on. The
#   claim of coverage becomes machine-verified and false.
#
#   `broker/compliance_quality.py` now refuses that shape. Run it before loading:
#
#       python -m scripts.check_compliance_library packs/compliance-library/*.yaml
#
# ---------------------------------------------------------------------------
# THE SIX FIELDS, AND THE THREE THAT ARE EASY TO GET WRONG
#
#   entry_ref     The stable id a Pack resolves against. Never reuse or renumber:
#                 a Pack pinned to `compliance/glba-plaid-v1` must keep meaning what
#                 it meant. A changed rule is a NEW entry at -v2.
#
#   framework     One value from the Pack schema's ComplianceFramework enum.
#
#   jurisdiction  A list. `["FEDERAL"]`, `["ALL"]`, or two-letter state codes.
#                 This decides whether the entry binds a given client at all.
#
#   The three below answer three DIFFERENT questions, and the common failure is
#   answering the first one three times.
#
#   applicability_rule
#       WHEN does this bind? A condition an agent can evaluate against the case in
#       front of it. Not "this applies to bank data" — that is a topic. Write the
#       circumstance: "when the client connects a bank account through Plaid".
#
#   agent_behavior_implication
#       WHAT DOES THE AGENT DO DIFFERENTLY? This is the whole point of the entry and
#       the field most often filled with a restatement of the law. If you could delete
#       this field and the agent would behave identically, it is not written yet.
#       It must contain an instruction: must / must not / obtain / record / refuse.
#
#   escalation_trigger
#       WHEN DOES THE AGENT STOP and hand to a human? Also a condition. "Escalate as
#       needed" is not one.
#
#   citation      A statute, section, rule or URL. A framework name is not a citation:
#                 an agent asked "on what authority" cannot answer from "GLBA".
#
#   runtime_flag  Must match the Pack's `compliance_surface[].runtime_flag` EXACTLY.
#                 The flag is the join between the Pack and this entry; a typo means
#                 the Pack declares a framework that resolves to nothing.
#
#   depends_on    OPTIONAL, authoring-file only, never POSTed. What must exist
#                 elsewhere before this entry can actually fire. An entry that defers
#                 to a per-jurisdiction variant, an approved phrase, or a capability
#                 declares it here:
#
#                   depends_on:
#                     - kind: state_activation
#                       description: >-
#                         One sentence on what "satisfied" means for this dependency.
#                       required_for: [CA, NY, UT]
#                       satisfied_for: []
#                       blocking: true
#
#                 `check_compliance_library.py` refuses `status: approved` while any
#                 blocking dependency is unmet, and reports BLOCKED. This is the
#                 `status: draft` guard one layer out: a draft entry is honest about
#                 not being ready, and an approved entry that cannot fire is not.
#
#                 `satisfied_for` is maintained by hand, because this checker runs
#                 without a database on purpose. Update it as states go live.
#
#   claim_provenance
#                 OPTIONAL, authoring-file only, never POSTed. Per CLAIM, not per
#                 entry — an entry is a mixture, and an entry-level tag would round
#                 the mixture to whichever tag the author felt best about.
#
#                   claim_provenance:
#                     - claim: "Short label for the specific assertion."
#                       tag: sourced          # source:    what it is traceable to
#                     - claim: "Another."
#                       tag: reconstructed    # basis:     what it was shaped from
#                     - claim: "A third."
#                       tag: proposed         # review_by: who decides
#
#                 sourced        traceable to a locked decision, an approved phrase,
#                                a statute, or a line in a specification. `source`
#                                names the thing, specifically enough to check.
#                 reconstructed  shaped from context with no source behind it. It may
#                                be right. Nobody has agreed to it. `basis` says what
#                                it was shaped from, so it can be argued with.
#                 proposed       a recommendation awaiting a decision. `review_by`
#                                names who decides, not "someone".
#
#                 The supporting field is MANDATORY for its tag, and the checker
#                 refuses a claim without it. This mirrors the Recommendation
#                 Engine's `issuer_rule` versus `unresearched_default`, and mirrors
#                 the part that matters: there, `profile.ts` THROWS on an
#                 unresearched default with no `rationale`. A tag whose support is
#                 optional is a tag applied to everything.
#
#                 A statutory obligation restated is `sourced` to the statute. The
#                 BEHAVIOUR an agent takes because of it is almost never in the
#                 statute, and is `reconstructed` unless a Decision or a
#                 specification line states it. That distinction is where most of
#                 this library actually sits.
#
# ---------------------------------------------------------------------------
# AMENDMENT HISTORY — THERE IS NONE. Read this before promising one.
#
#   An entry loosened later cannot currently be reconstructed as it was.
#
#   `compliance_library_entry` has `entry_ref` as its PRIMARY KEY, no version column,
#   and `author_compliance_entry` writes ON CONFLICT DO UPDATE. An amendment
#   OVERWRITES the prior text in place. The audit entry that accompanies it carries
#   only `entry_ref` and `runtime_flag` — that the entry changed, never what it
#   changed from or to.
#
#   Two consequences worth having in front of you while writing:
#
#   1. The Compliance Library lives in THE OFFICE, not the Console. An amendment
#      never reaches the Console's Event Ledger. It lands in the Office audit_log,
#      which is correct — the library is portfolio-wide — but a note promising an
#      Event Ledger record is naming the wrong store.
#
#   2. Certifications bind to an instruction set's `content_hash`, so rewriting
#      instructions makes every certification against them stale. NOTHING equivalent
#      exists for a library entry. Loosen one and it silently changes what "compliant"
#      meant for every deliverable already assessed against it, retroactively, with no
#      staleness signal anywhere.
#
#   Until that is fixed, THIS FILE is the amendment history: it is version-controlled,
#   the diff is the record, and an entry's `notes` are where the reasoning lives. Keep
#   the file as the source of truth and load FROM it — never edit an entry directly
#   through the API, or the only history there is disappears.
#
#   The Console's own Marketing Claim Library does have `version` and a `deprecate`
#   lifecycle. The gap is on the Office side only.
#
# ---------------------------------------------------------------------------
# CONTROLS THAT ARE REFERENCED BUT HAVE NO CONTENT
#
#   Three have been found while writing these entries. Each was cited AS COVERAGE —
#   in this library and in the specifications — and none existed. They are listed
#   here because the failure is a pattern rather than three accidents, and because an
#   entry that leans on one is claiming a protection nobody has written.
#
#   TWO OF THE FIRST THREE ARE NOW CLOSED. The Firewall's five rules were written on
#   31 August 2026 and the "2.3 workflow" deferrals were repointed at the mechanism
#   that actually exists. The Readiness Score's components remain unspecified. The
#   entries stay here rather than being deleted: the pattern is the finding, and a
#   list that only holds open items loses the evidence that the pattern is real.
#
#   A FOURTH WAS FOUND ON 31 AUGUST 2026 and it is a different shape from the other
#   three. Those were controls cited internally as coverage they did not have. This
#   one was a fact about the firm's own pricing, written into a document addressed to
#   OUTSIDE COUNSEL, with no record behind the specific figures — and with the
#   codebase implementing the opposite of the principle they were meant to express.
#   It is listed below as THE CAPPED PER-PRODUCT SUCCESS FEE SCHEDULE.
#
#   THE FUNDING ETHICS FIREWALL'S FIVE ETHICAL RULES. — CLOSED 31 August 2026.
#
#     WRITTEN. Founder decision of 31 August 2026 chose the five and their effects,
#     and they are implemented in `packages/firewall/src/rules.ts` as
#     `FIREWALL_RULES`, enumerated and each carrying its own effect, whether it binds
#     submission, and what it cannot yet see:
#
#       1 FIT       a product that works against the stated need     candidate removed
#       2 COST      a cheaper equal option the firm withheld          candidate removed
#       3 CAPACITY  obligations beyond capacity to service them       client freeze
#       4 STACKING  the same security twice, or too soon after        client freeze
#       5 EVIDENCE  terms nobody verified against the issuer          candidate removed
#
#     THREE OF THE FIVE CARRY DECLARED GAPS. Rule 2 cannot price a factor-rate
#     product; rule 3 cannot see debt Burkham did not broker; rule 5 treats
#     verification as asserted rather than proven. Each says so on itself in
#     `unenforceableBecause`, and rule 3's refusal states the blind spot in the
#     sentence a human reads before clearing the freeze. ADR-0086 sizes what would
#     make rules 2, 3 and 5 bind at submission as well as at recommendation.
#
#     WHAT IT WAS BEFORE, kept because the diagnosis is the reusable part.
#
#     blueprint-v2 §6.2: "Automated enforcement of five ethical rules on placement
#     eligibility." That sentence was the ONLY mention of them across both reference
#     documents, 1,807 lines. They were never enumerated.
#
#     Nor implemented. `packages/firewall/src/index.ts` exposed status, trigger,
#     clear and evaluate: a per-client triggered/clear flag whose `trigger` takes an
#     arbitrary `reason` string, plus the Decision E coupling to compliance state.
#     A flag a human or an agent sets — not five conditions evaluated. The package
#     had exactly one commit, the original walking-skeleton spine, and had not been
#     revisited. Git history showed the phrase entering with the specification and
#     never being elaborated. There is no ethics or firewall service in CapitalForge
#     either. That flag still exists and is still the client-level freeze; rules 3
#     and 4 are what now set it, rather than a human with a free-text reason.
#
#     The reliance is wide. The Firewall is named 21 times across the two reference
#     documents, is a declared dependency of the Recommendation Engine (5.3), Risk &
#     Defense (6.1) and Do Not Fund Governance (6.4), is given precedence over ALL
#     placement modules by design principle 7, and sits at step 4 of the middleware
#     chain that every client-facing action passes through.
#
#     The count is what made it citable. "Five rules" reads as a known set, so an
#     author reaches for "rule 4" — which is what happened in
#     compliance/client-interest-standard-v1 before review, and independently in
#     `lenders/suitability.ts`, which called a refinance into an advance "the
#     stacking pattern the Funding Ethics Firewall exists to stop". Two authors, two
#     artifacts, neither citation with a referent. An unenumerated control with a
#     number attached is worse than one with no number: the number implies somebody
#     wrote them down.
#
#     Both citations are now correct rather than removed — there IS a rule 4, and it
#     is stacking. That is a coincidence and not a vindication: the phantom rule 4
#     was about fee-driven product selection, which is rule 2's territory and only
#     partly covered even there.
#
#   THE FUNDING READINESS SCORE'S COMPONENTS.
#
#     Three mentions across both documents, none of them a specification: an Event
#     Ledger event type, one line in a flow diagram, and a KPI. No module section,
#     no component list. The phrase "eight components" appears in no document, and
#     no scorer with eight components exists in any repository — CapitalForge has a
#     five-component scorer and a separate four-dimension one.
#
#   THE "2.3 HYBRID WORKFLOW" FOR BOTH-FOUNDER APPROVAL.
#
#     Four deferrals across three entries pointed at it — bureau-report-handling-v1,
#     not-a-credit-repair-organization-v1 and estimate-not-offer-v1 (twice) —
#     variously as "the 2.3 hybrid workflow", "the 2.3 approved-list workflow" and
#     "the 2.3 workflow".
#
#     specifications-v2 §2.3 is "What the Console owns vs. what it calls": eight
#     owned capabilities and thirteen called ones. An ownership boundary. It contains
#     no workflow, no approval step and no mention of founders. The words "hybrid"
#     and "both-founder" appear nowhere in the document.
#
#     The real mechanism is specifications-v2 §7.4 Change management: "Marketing
#     claims — versioned in Marketing
#     Claim Library, Compliance Review Board approval required." One board, and no
#     section number. §6 adds that the Board reviews new marketing claims, state-law
#     concerns and edge-case funding recommendations on a WEEKLY cadence, which is
#     operationally useful: a deferral to the Board has a known turnaround, and a
#     deferral to "the 2.3 workflow" had none.
#
#     All four deferrals now point at Compliance Review Board approval. RESOLVED.
#
#     WHAT REMAINS OPEN: who sits on the Board. The specification never says. It is
#     listed under §7.1 as a place human involvement concentrates, alongside
#     founder-led calls, but its membership is nowhere defined — so "both founders"
#     is not contradicted by the correction, merely unstated. Where entries name both
#     founders OUTSIDE a 2.3 citation, that wording is left as written; one entry
#     already writes "Compliance Review Board, both founders" and may be right.
#
#     This one differs from the other two in a way worth naming. The Firewall's rules
#     and the Readiness Score's components are things that were described and never
#     written. This is a real section cited for something it does not contain — the
#     citation is wrong rather than the target empty. It found its way in the same
#     way "rule 4" did: a section number reads as a checkable reference, so nobody
#     checks it.
#
#   THE CAPPED PER-PRODUCT SUCCESS FEE SCHEDULE. — OPEN, found 31 August 2026.
#
#     A draft counsel brief stated that Burkham's success fees carry
#     "product-specific caps (for example, 1.5% capped at $7,500 for lines of credit;
#     2% capped at $20,000 for SBA products; flat per-card fees for credit card
#     placements rather than percentages of approved limits)."
#
#     THE PRINCIPLE HAS A SOURCE. The Marketing Plan Intake states it three times,
#     and states it as architecture rather than aspiration:
#
#       · §4.2 Claims we make, item 8: "Flat success fees on
#         approved and funded capital, not percentage-of-limit."
#       · §2 Group C, the advisor-referrer objection table: "Success fees flat, not
#         percentage-of-limit (the Seek Capital lesson)."
#       · §9.5 Has anything already gone wrong: "Firms in the space have faced class-action exposure for
#         percentage-of-credit-limit success fees... Burkham's flat success-fee
#         schedule + fee-exhibit-at-signing + 60-day refund trigger are architected
#         specifically to prevent this pattern."
#
#     THE NUMBERS HAVE NONE. $7,500, $20,000, 1.5%, 2%, and a flat per-card fee appear
#     in no specification, no decision, no seed, no test and no note. They appear in
#     the counsel brief and nowhere else. Searched: both reference documents, the
#     Marketing Plan Intake, the Console repository including git history, and this
#     library.
#
#     The schedule was SCHEDULED, not written. Marketing Plan Intake §4.3 Proof for
#     each claim, row 8 — Day 8
#     of the 90-day plan: "Fee schedule exhibit attached to engagement letter.
#     Documented per-product schedule (Placement Program)." That deliverable does not
#     exist. The figures were reconstructed to fill it.
#
#     AND THE CODE DOES THE OPPOSITE. `billing/seed.ts` prices success fees as
#     `successFeeBasisPoints` — 300 for Foundation, 350 for Growth — computed against
#     `approvedCreditLimit`, with the seed's own comment reading "3% of the approved
#     credit limit". `successFeeBasis()` returns the limit unchanged; nothing caps it.
#     `minimumCents` is a FLOOR with no ceiling counterpart. The fee exhibit renders
#     `successFeeBasisPoints / 100` as a percentage.
#
#     That is percentage-of-credit-limit success-fee pricing, uncapped: the exact
#     pattern the Marketing Plan names as the Seek Capital class-action exposure the
#     firm is "architected specifically to prevent". Every seeded offer is labelled
#     DRAFT PRICING, so the likeliest reading is that the code is stale rather than
#     that the policy changed — but the code is what bills.
#
#     WHY IT BELONGS IN THIS LIST. The other three instances cost a reader a wrong
#     impression. This one was about to be sent to a law firm as a statement of fact
#     about the firm's compensation — the single fact the entire broker-licensure
#     question turns on. A counsel opinion on a capped 1.5% would not be an opinion
#     about a firm charging an uncapped 3.5%.
#
#     RESOLVED 31 August 2026, and resolved in the direction the pattern predicts.
#     The recollected figures were not confirmed by a document - they were replaced.
#     A search for the earlier factoring pricing, recalled at $1,500-$3,500 setup by
#     facility size, across both reference documents, the Marketing Plan Intake, this
#     library and the Console repository including git history, returned NOTHING. It
#     was a recollection: the same shape as the five Firewall rules.
#
#     Seven positions are now recorded in `packages/billing/src/successFeeSeed.ts`,
#     flat per placement, each carrying the effort that justifies it, all PROPOSED
#     pending Compliance Review Board. And `proposed` is a state the system enforces
#     rather than a word in a rationale: `successFeeFor` refuses an unapproved fee, so
#     nothing can be quoted in an exhibit or billed on a placement until the Board
#     approves it. That distinction is the whole lesson of this entry - the previous
#     figures lived in prose, which is how they reached a law firm unsourced.
#
#     THE BRIEF HAS NOT BEEN SENT, and its §1.3 still carries the reconstructed caps.
#     It is now wrong in a NEW way: it describes percentage caps against a schedule
#     that is flat. It must be rewritten before it goes anywhere.
#
#   WHAT TO DO WITH THEM. None was a library entry's job to fix. Both are recorded
#   The Readiness Score is still recorded as `depends_on` on the entries that need
#   it, so an entry cannot reach `approved` while leaning on something unwritten;
#   specifying its components is specification work nobody has done.
#
#   The Firewall's five are done, and the dependency they blocked has been narrowed
#   rather than deleted: client-interest-standard-v1 now depends on a check for
#   fee-driven product selection among EQUALLY AVAILABLE options, which rule 2 does
#   not reach. An entry must still say "held by this entry and human judgement" for
#   that part, and may now say "covered by the Firewall" for the rest — which is the
#   first time that sentence has been true.
#
#   The 2.3 deferrals needed no dependency: the approval mechanism existed, only the
#   citation pointing at it was wrong, and all four have been repointed.
#
# ---------------------------------------------------------------------------
# A TEST FOR WHETHER AN ENTRY IS FINISHED
#
#   Read only `agent_behavior_implication` and ask: could a competent agent that had
#   never heard of this framework do the right thing from this sentence alone?
#
#   If it needs the citation to know what to do, the implication is not written yet.

entries:

  # =========================================================================
  # WORKED EXAMPLE — complete. Use this as the shape.
  #
  # GLBA is the one the schema could not express at all until this week, and it is
  # engaged on Burkham's FIRST client: Decision A makes Plaid the V1 statement source,
  # so every diagnostic touches it.
  # =========================================================================
  - entry_ref: compliance/glba-plaid-connection-v1
    framework: GLBA
    jurisdiction: [FEDERAL]
    runtime_flag: per_connection_authorization_required

    applicability_rule: >-
      When the client is asked to connect a financial account through Plaid, and on
      every subsequent call that reads data from that connection. It binds per
      connection and per institution, not per client: a client who connects a second
      bank has not authorized the second one by having authorized the first.

    agent_behavior_implication: >-
      The agent must obtain a written authorization that names the specific
      institution being connected, and must record it before calling
      statement_pull for that connection. The authorization is per connection — the
      agent must not reuse an authorization captured for a different institution, and
      must not treat the engagement agreement as covering it. If a stored
      authorization is revoked or expired, the agent must stop reading from that
      connection immediately rather than finishing the current diagnostic. The agent
      must never present the connection step as optional-to-authorize; connecting and
      authorizing are one act and are refused separately.

    escalation_trigger: >-
      When the client declines authorization for an institution the diagnostic needs,
      when a stored authorization is revoked mid-engagement, or when Plaid returns
      account data for an institution the recorded authorization does not name. In all
      three the agent stops and hands to the venture operator — the third is a data
      handling incident, not a retry.

    claim_provenance:
      - claim: "GLBA obligations attach to Plaid connections"
        tag: sourced
        source: "specifications-v2 §6.3: 'GLBA (indirect) — Plaid connections carry Gramm-Leach-Bliley obligations; per-connection authorization required per Decision A'"
      - claim: "Authorization is per connection and per institution, not per client"
        tag: sourced
        source: "Decision A, specifications-v2 §6.3 'per-connection authorization'"
      - claim: "The authorization must be WRITTEN and name the specific institution"
        tag: reconstructed
        basis: "Decision A says per-connection; 'written' and 'names the institution' are shaped from the per-application written-authorization pattern in §6.3, not stated for Plaid"
      - claim: "Recorded BEFORE calling statement_pull, and not reusable across institutions"
        tag: reconstructed
        basis: "ordering and the reuse prohibition follow from per-connection scope; no source states either"
      - claim: "A revoked authorization stops reading mid-diagnostic rather than finishing"
        tag: reconstructed
        basis: "shaped from @bwc/consent's revocation-propagates behaviour, which freezes dependent workflows; the mid-diagnostic specificity is not in code or spec"
      - claim: "Connecting and authorizing are one act, refused separately"
        tag: reconstructed
        basis: "shaped from the consent store's refusal of an unscoped consent; no source frames connection this way"
      - claim: "The heavier disclosure is DISCLOSURE_UNRESEARCHED_DEFAULT verbatim"
        tag: sourced
        source: "packages/core/src/provenance.ts — describeProvenance is built from the constant; step 7 matches it exactly"

    citation: >-
      Gramm-Leach-Bliley Act, 15 U.S.C. §§ 6801–6809; Privacy Rule, 16 C.F.R. Part 313;
      Safeguards Rule, 16 C.F.R. Part 314.

  # =========================================================================
  # NINE TO WRITE.
  #
  # Each carries the runtime_flag from the draft Pack, so the join is already correct.
  # Delete the TODO markers as you fill each one in — the quality check refuses any
  # entry that still carries one.
  # =========================================================================

  # =========================================================================
  # WRITTEN BY IVAN. FCRA is split in two: authorization is upstream and belongs to
  # the Consent & Authorization Center; this entry governs what happens to a report
  # once it has come back. The Pack now carries two FCRA rows to match — one flag
  # each — because a single row can only declare one runtime_flag.
  #
  # `jurisdiction` corrected to a list. As a scalar it reads as absent, and the
  # jurisdiction list is what decides whether an entry binds a given client at all.
  # =========================================================================
  - entry_ref: compliance/bureau-report-handling-v1
    framework: FCRA
    jurisdiction: [FEDERAL]
    runtime_flag: bureau_report_handling_required

    applicability_rule: >-
      Any handling of a returned bureau report — business or personal. Covers both
      business_bureau_pull and personal_credit_pull; the agent's obligations are
      identical and only the consent kind differs.

      Fires when a report has been returned by the Integration Layer, not when a pull
      is requested. Authorization is upstream and belongs to the Consent &
      Authorization Center: if the client declines or an authorization has expired,
      the pull does not happen and this rule is never reached.

    agent_behavior_implication: >-
      THE AGENT MAY: use the report as input to the Funding Readiness Score with
      provenance preserved; reason over specific findings internally; include derived
      characterizations in client deliverables; enter specific figures from the report
      onto a lender application form where that form requires them; store the report in
      the Secure Document Vault under Regulatory Engine retention.

      THE AGENT MUST NOT:

      1. Share the raw report outside the client's authorized viewers. Not with
      lenders, not with partners, not with other Green Companies ventures, and not in a
      cross-portfolio handoff artifact, unless the client authorized that specific
      document flow.

      2. Attach the raw report to a lender packet. The distinction is exact: the report
      says PAYDEX 72, so the agent enters 72 on the application — that is correct.
      Attaching the D&B report to the SBA package is not. Lenders pull their own.

      3. Hold the report past the Regulatory Engine's state-specific retention.

      4. Render the raw report as a Burkham deliverable. The agent may characterize it
      in Burkham's own analytical language; it may not reproduce the vendor's output as
      Burkham's assertion of the client's creditworthiness. "Here is what Nav returned"
      is redistribution; a Funding Readiness Score incorporating bureau data as one
      component among several is a deliverable.

      Where the boundary between a figure and a reproduction is unclear — a reformatted
      tradeline table, a PAYDEX with its reason codes — the agent characterises in
      Burkham's own analytical language rather than reproducing vendor formatting. This
      tie-break governs DELIVERABLES. It does not narrow the permission above to enter
      specific figures onto a lender application form: a form has fields and cannot be
      characterised into, so where the form requires a figure the agent enters it.

      5. Use the report for any purpose beyond the one the client authorized. The
      per-pull authorization scopes the use. Repurposing the same pulled data — an
      anonymised marketing case study, for instance — requires fresh authorization.

      VISIBILITY: agents assigned to this client's engagement, Human Compliance &
      Evidence on approval workflows, and founders on escalation. Not agents outside the
      engagement, not cross-venture agents, not partners under any co-brand or
      white-label arrangement.

    escalation_trigger: >-
      A returned report carrying a fraud alert, a credit freeze indicator, an identity
      mismatch, or an open dispute flag MUST NOT be fed into Funding Readiness Score
      computation. The agent routes to Human Approval Console for reviewer disposition,
      and the Compliance Evidence Vault records the flag, the routing and the
      resolution.

      These are not scoring inputs. Each is a signal about whether the file is the
      client's and whether it can be relied on.

      FRAUD ALERT — the bureau is signalling the file may be compromised. Scoring
      against it either produces a wrong result or acts on data fraudulently attributed
      to the client.

      CREDIT FREEZE — the report reflects what the bureau could return without lifting
      the freeze. Portions may be absent. Do not compute against partial data as though
      it were complete.

      IDENTITY MISMATCH — name, address, date of birth or EIN not matching onboarding
      data. Stop unconditionally. Either the client's identity is compromised or
      somebody is misrepresenting themselves, and both carry 18 USC §1014 exposure.

      DISPUTE FLAG — the disputed item must not be scored as settled. Scope varies and
      the reviewer decides: score without the item, exclude and re-score, or wait for
      resolution.

    citation: "15 U.S.C. § 1681 et seq. (FCRA); 18 U.S.C. § 1014"

    claim_provenance:
      - claim: "FCRA-adjacent obligations attach to bureau pulls"
        tag: sourced
        source: "specifications-v2 §6.3: 'FCRA (indirect) — bureau data pulls carry FCRA-adjacent obligations; per-pull authorization required per Decision B'"
      - claim: "Business bureau and personal credit are separate authorizations"
        tag: sourced
        source: "Decision B; @bwc/consent kinds business_bureau_pull and personal_credit_pull"
      - claim: "Obligations after a returned report are identical for business and personal"
        tag: reconstructed
        basis: "no source distinguishes handling by report type; asserted from the two consent kinds differing only in subject"
      - claim: "The agent may enter figures from a report onto a lender form but not attach the report"
        tag: reconstructed
        basis: "the PAYDEX-72 distinction is shaped from the redistribution concern; no vendor TOS or spec line states it"
      - claim: "Raw report never leaves the authorized viewer set"
        tag: reconstructed
        basis: "shaped from design principle 5, strict multi-tenant isolation, extended to vendor data"
      - claim: "Retention is state-specific and engine-resolved"
        tag: sourced
        source: "packages/retention/src/schedules.ts — stateCode on retention schedules, validated two-letter"
      - claim: "A report carrying fraud alert, freeze, mismatch or dispute is not a scoring input"
        tag: proposed
        review_by: "Compliance & Evidence — three of the four map to existing ObservationKinds; identity_mismatch has none and the routing rule is new"
      - claim: "The raw-report prohibition holds regardless of vendor TOS"
        tag: sourced
        source: "Founder decision, 31 August 2026, ratifying the DECIDED note in this entry. Taken deliberately UPSTREAM of the per-vendor TOS review, so that review can only ever loosen the rule by recorded amendment."

    status: draft_pending_claim_library_approval

    notes: >-
      DECIDED AND RATIFIED, founder decision 31 August 2026 — the raw-report prohibition
      is a deliberate restrictive default, not an
      unverified assumption. It holds regardless of vendor TOS. Rationale: a permissive
      default tied to vendor terms means a TOS tightening puts Burkham out of compliance
      by inaction, and TOS silence is not TOS permission.

      RATIFICATION NOTE — the decision was taken BEFORE the vendor review, and that
      ordering is the substance of it. A prohibition ratified as "pending TOS" would be a
      rule any vendor document could quietly overturn. Ratified upstream, the review can
      only ever loosen it, and loosening is an explicit recorded amendment rather than
      operational drift.

      DELEGATED — Village Compliance & Evidence to document, per bureau vendor, what the
      TOS says about redistribution to third parties, retention obligations, purpose
      limitation, consent requirements beyond the initial pull authorization, and vendor
      audit rights. Filed in Compliance Evidence Vault. If it returns clean permission to
      forward, loosening goes to the Compliance Review Board, which approves marketing
      claims and reviews state-law concerns on a weekly cadence — an explicit
      amendment, recorded, not operational drift.

      RESOLVED — the line between characterising a report and rendering it. The
      ambiguous case now has a stated tie-break rather than waiting on Claim Library
      approval: where the boundary is unclear, characterise. It is the restrictive
      default, consistent with the DECIDED reasoning above, and it means an agent
      meeting a reformatted tradeline table has a rule instead of a judgement call.

      NOT AUTOMATED, and this one cannot be. Nothing detects "vendor formatting" — the
      scanner matches phrases and lender-product numbers, and a reproduced tradeline
      table is neither. This rule is enforced by the agent reading it and by the
      Deliverable Approval Workflow at 3.4, not by a check. Stated so nobody later reads
      the entry's presence as coverage.

      NOTED — dispute-flag handling is deliberately stated as a concept rather than a
      rule. A dispute on a twenty-year-old resolved tradeline is not the same as one on
      the client's primary banking relationship, and the specifics should evolve through
      Compliance & Evidence rather than be guessed now.

      SEPARATE FINDING — no soft/hard pull distinction exists anywhere in the code. If
      Burkham does soft pre-qualification pulls and hard pulls at application, the system
      cannot tell them apart. That is a data-model gap, not a library gap, and it should
      be raised independently of this entry.

      SEPARATE FINDING — three of the four escalation flags already exist as
      ObservationKind in @bwc/risk: fraud_alert, freeze and dispute. Identity mismatch
      has no kind. What is missing is not the vocabulary but the path: the bureau adapter
      returns not_built with no return shape, so nothing carries a flag from a report
      into an observation. Belongs with the soft/hard pull gap.

      RAISED BY REVIEW — an amendment to this entry is not currently recoverable. The
      Compliance Library lives in The Office, not the Console, so an amendment never
      reaches the Console Event Ledger. In The Office it is an upsert on entry_ref with
      no version column, so the prior text is overwritten, and the audit entry carries
      only entry_ref and runtime_flag rather than what changed. See AMENDMENT HISTORY at
      the head of this file.
  # =========================================================================
  # WRITTEN 1 September 2026, replacing the template. This is the entry
  # compliance/bureau-report-handling-v1 explicitly defers to: "Authorization is
  # upstream and belongs to the Consent & Authorization Centre." That entry
  # scoped itself out of authorization deliberately, so deleting this one leaves
  # rules that presume an authorization and no rule for obtaining one.
  # =========================================================================
  - entry_ref: compliance/fcra-pull-authorization-v1
    framework: FCRA
    jurisdiction: [FEDERAL]
    runtime_flag: per_pull_authorization_required

    applicability_rule: >-
      Before any credit bureau pull, consumer or business, every time. Fires at the moment a
      pull is requested, not when the report comes back — that is
      compliance/bureau-report-handling-v1, which governs the report and states plainly that
      authorization is this entry's job.

      TWO KINDS, NOT ONE. `business_bureau_pull` and `personal_credit_pull` are separate
      consent kinds because they are separate intrusions. A business owner who authorised a
      Dun & Bradstreet pull on their company has not authorised a hard inquiry against their
      personal file, and the second is the one that costs them points.

      FCRA reaches Burkham indirectly. Burkham is not a consumer reporting agency and does not
      furnish data. What it does is obtain reports, and a report obtained without a
      permissible purpose is the violation whoever obtained it committed.

    agent_behavior_implication: >-
      THE PERMISSIBLE PURPOSE IS THE CLIENT'S WRITTEN INSTRUCTION, and nothing else. Burkham
      has no independent purpose for pulling — no underwriting interest, no account review, no
      collection. The whole of its authority is that the client asked it to.

      PER PULL, NOT PER ENGAGEMENT. One authorization covers one pull, of one bureau kind, for
      one stated purpose. A client who authorised a business bureau pull for a line of credit
      application has not authorised a second pull three months later for a different
      application. The engagement agreement is not the authorization and never substitutes
      for it.

      RECORDED BEFORE THE CALL, NOT AFTER. The authorization exists in the Consent &
      Authorization Centre before the Integration Layer is asked for anything. An
      authorization captured afterwards documents a pull that had no permissible purpose at
      the moment it happened, which is the violation, not a cure for it.

      THE CLIENT IS TOLD WHICH KIND OF INQUIRY. Soft or hard, and against which file. A client
      who believes they authorised a soft business pull and receives a hard personal inquiry
      was not told what they were agreeing to, and the signature does not fix that — see
      compliance/client-interest-standard-v1 on a signed agreement not being understanding.

      SCOPE BINDS THE USE, NOT ONLY THE PULL. The purpose stated in the authorization is the
      purpose the report may serve. Pulling for a specific application and then reusing the
      same report for a portfolio analysis, a marketing segmentation or another lender's
      submission is use beyond the authorization even though no second pull occurred.

      REVOCATION STOPS THE NEXT PULL IMMEDIATELY. A client may revoke at any time, and the
      revocation binds from the moment it is recorded. A pull already in flight is completed
      and the report handled under bureau-report-handling-v1; no further pull is made.

      A GUARANTOR IS A SEPARATE PERSON. Where a personal credit pull concerns someone other
      than the client contact — a co-owner, a spouse guarantor — the authorization must come
      from that person. The client cannot authorise an inquiry against a third party's file,
      whatever their relationship to the business.

      NO AGENT MAY BROADEN AN AUTHORIZATION. An agent that finds an authorization too narrow
      for what it wants to do asks the client for a new one. It does not proceed on the view
      that the client would obviously have agreed.

    escalation_trigger: >-
      1. When a pull is requested and no live authorization covers that bureau kind and that
      purpose. Refuse. Route to obtain one; do not proceed and document afterwards.

      2. When the purpose of a pull has drifted from the purpose authorised — a different
      application, a different product, a different lender. New authorization, or no pull.

      3. When a personal credit pull would touch anyone other than the client contact. Obtain
      that person's own authorization directly. Escalate if it is unclear whose file would be
      inquired against.

      4. When a client asks how many inquiries have been made on their behalf. Answer with the
      record. A client who cannot get that number from Burkham has no way to hold the
      inquiry-count discipline in compliance/card-product-characterisation-v1 to account.

      5. When a client revokes. Confirm, stop, and record. Any pull after a revocation is a
      pull with no permissible purpose.

      6. When an agent proposes reusing a previously pulled report for a new purpose. Compliance
      & Evidence decides whether the original scope reaches it; the default is that it does not.

      7. When a bureau or a client alleges a pull was unauthorised. Compliance Review Board and
      outside counsel. Do not respond to the client's dispute without the authorization record
      in hand.

    depends_on:
      - a consent check before the bureau pull path, which does not exist - `business_bureau_pull` and `personal_credit_pull` are declared consent kinds that no code path consults
      - a client-facing statement of inquiry kind, soft or hard, at the point of authorisation
      - authorization capture for a guarantor who is not the client contact
      - an inquiry count per client, readable by the client

    citation: "15 U.S.C. § 1681b(a)(2) and (f) (permissible purpose; written instructions of the consumer); 15 U.S.C. § 1681q (obtaining information under false pretences)"

    claim_provenance:
      - claim: "The permissible purpose is the client's written instruction and nothing else"
        tag: sourced
        source: "15 U.S.C. §1681b(a)(2) - a consumer report may be furnished to a person the consumer has instructed in writing. Burkham has no other statutory basis: it does not underwrite, service or collect."
      - claim: "Per-pull authorization, not per-engagement"
        tag: sourced
        source: "specifications-v2 §6 lists FCRA as indirect with 'per-pull authorization required per Decision B'. The Console models it as such: CONSENT_KINDS carries business_bureau_pull and personal_credit_pull, and check() enforces scope, expiry and revocation."
      - claim: "Two consent kinds because a business pull and a personal hard inquiry are different intrusions"
        tag: sourced
        source: "packages/consent/src/index.ts CONSENT_KINDS - business_bureau_pull and personal_credit_pull are separate values."
      - claim: "The authorization is recorded before the Integration Layer is called"
        tag: reconstructed
        basis: "Shaped from compliance/glba-plaid-connection-v1, which states the same ordering for Plaid connections. No source states it for bureau pulls, and nothing enforces it."
      - claim: "The client is told whether the inquiry is soft or hard, and against which file"
        tag: reconstructed
        basis: "Shaped from the seeded Marketing Claim Library, where `soft pull` requires DISCLOSURE_SOFT_INQUIRY on the reasoning that the soft inquiry is followed by a hard one at application. Extending that from marketing copy to the authorisation itself is this entry's own step."
      - claim: "Scope binds the use of the report, not only the act of pulling"
        tag: reconstructed
        basis: "Restates compliance/bureau-report-handling-v1's trigger 5, 'use the report for any purpose beyond the one the client authorized', from the authorisation side. The two entries meet here by design."
      - claim: "A guarantor must authorise their own inquiry"
        tag: proposed
        review_by: "Compliance Review Board. Nothing captures a non-client authorisation today, and the Entity Graph models guarantors without modelling their consent."
      - claim: "An agent may not broaden an authorization on the view that the client would have agreed"
        tag: reconstructed
        basis: "Shaped from compliance/client-interest-standard-v1's rule that a signature is not understanding; the inverse case, where no signature exists at all, follows a fortiori. Not separately sourced."

    status: draft_pending_claim_library_approval

    notes: >-
      THE GAP THAT MATTERS. `business_bureau_pull` and `personal_credit_pull` are declared
      consent kinds and NOTHING CHECKS THEM. Searched the integration, placement and API
      packages: `check()` is called once in the whole codebase, for `application` consent in
      `requestRecommendation`. The vendors exist in `VENDOR_IDS` as `business_bureau` and
      `personal_credit`; the consent kinds exist; no path joins them.

      So this entry is presently held by human process. That is stated rather than implied,
      and it is the first dependency because it is the one that makes the rest enforceable.

      WHY THIS IS NOT PART OF bureau-report-handling-v1. That entry says so itself:
      "Authorization is upstream and belongs to the Consent & Authorization Centre." It
      governs a report that has come back — who may see it, what may be copied from it, what
      may never be attached. This governs whether the report should have been obtained. A
      report handled impeccably that nobody authorised is still a violation, and the two
      entries fail in different directions.

      OPEN — the guarantor case. The Entity Graph models co-owners and guarantees, including
      capped and uncapped ones, and models nobody's consent. A personal credit pull against a
      guarantor is the most likely place this entry is breached first, because the client
      contact will supply the guarantor's details in good faith and nothing will ask whether
      the guarantor agreed.

      NOTED — inquiry counts. compliance/card-product-characterisation-v1 depends on an
      executed inquiry count that does not exist. The same record would answer trigger 4 here.
      One field, two entries.


  # =========================================================================
  # WRITTEN BY IVAN. Same split shape as FCRA: authorization is one flag, conduct is
  # another, and a compliance_surface row carries one flag each — so the Pack has two
  # rows for this framework too.
  #
  # `framework` adopted as written: the enum value was renamed
  # FALSE_STATEMENTS_CREDIT_APPLICATION -> FALSE_STATEMENT_TO_LENDER. Nothing is
  # provisioned yet, so a rename is free now and a schema change later. The name is
  # also the better one: the exposure is a false statement TO A LENDER, whether it
  # rides on an application form or a lender packet.
  #
  # `jurisdiction` corrected to a list — third time. As a scalar it reads as absent.
  # =========================================================================
  - entry_ref: compliance/application-truthfulness-v1
    framework: FALSE_STATEMENT_TO_LENDER
    jurisdiction: [FEDERAL]
    runtime_flag: application_truthfulness_required

    applicability_rule: >-
      Any preparation, population or staging of a lender application. Fires from the
      first field populated, not at submission — the exposure is in what goes onto the
      form, and by the time a submission is staged the false statement already exists.

      Applies to every field regardless of source: client-stated, Plaid-derived,
      bureau-derived, or extracted from a client-uploaded document.

    agent_behavior_implication: >-
      NO AGENT SUBMITS. Preparation is Authority Level 1; submission is Level 3 and a
      human presses the button.

      Half of that is enforced today and half is not, and the entry says which. The
      middleware DOES refuse a Level 1 agent attempting to submit: `submit_application`
      is Level 3 in the action catalogue and step 3 of the chain compares the actor's
      level against it. The human at the button is NOT enforced — Level 3 is a level an
      agent can hold, and the chain has no human-actor step, so a Level 3 agent passes
      it. The rule stands as written; see the note below for the one-line gap.

      NEVER ENTERED, whatever the source:

      - a figure the client has not authorised for this specific application

      - a characterisation the client has not confirmed. If the client said "working
      capital", the agent enters working capital — not "inventory purchase", however
      clearly the Plaid data suggests it

      - any signature or attestation on the client's behalf. This one IS hard-blocked:
      `sign_for_client` is a Level 4 prohibited action and the middleware refuses it
      for every actor at every level

      - any answer misrepresenting the business's nature, industry or structure

      WHEN SOURCES DISAGREE — the agent surfaces the conflict; it does not pick a
      winner. Client says $500K trailing revenue, Plaid shows $340K, the bureau shows a
      third figure:

      - leave the field unpopulated

      - display all values with their provenance

      - route to the client with the specific question and ask for the figure and the
      context for the differences

      - the client's answer is what goes on the form

      - log the conflict, the resolution and the client's context to the Compliance
      Evidence Vault

      Silently taking the client's number while holding data that contradicts it is the
      exposure. The client's authorisation does not insulate Burkham from having
      knowingly used data it had reason to question.

      NO ESTIMATES ON APPLICATIONS. Where no verified source supplies a value, the agent
      requests it from the client, leaves the field blank where the form permits, or
      routes to human review. Never a reasonable estimate, never based on similar
      businesses, never a conservative figure to be safe. An estimated field is a false
      statement waiting to be produced.

      This is the one place the estimate rule inverts. Cost of Capital Calculator output
      is estimated by design and governed by compliance/estimate-not-offer-v1 —
      client-facing education. It never appears on a lender application.

    escalation_trigger: >-
      Seven. The first six are mechanical; the seventh is judgement and is caught by the
      Level 3 human, not by the agent.

      1. When the draft would contain never-entered data. Refuse to stage; route to
      Compliance & Evidence, not merely to submission approval.

      2. When a source conflict is unresolved — the client has not responded, has given
      a materially incompatible answer, or has given one no source can verify.

      3. When synthetic-document detection is positive. Nothing built on a flagged
      document proceeds. Using a tampered client document to prepare an application
      creates the exact reason-to-know exposure §1014 punishes. NOT BUILT — see notes.

      4. When the compliance categorical state moves to Needs Review or Fail during
      preparation. Placement freezes.

      5. When authorisation is withdrawn after capture and before submission.

      6. When the provider's Capital Product Governance Board standing is anything other
      than `approved` — `under_review`, `suspended` or `blacklisted` — or when its
      approval has gone stale past its review cadence, which stops being usable rather
      than continuing to count. Applies even where the application content is clean.

      7. When the aggregate would mislead although every field is individually
      defensible. Technically complete answers that selectively omit what a lender would
      consider material. Stated as a discipline principle: the agent's duty is to
      surface everything transparently; the human's duty at Level 3 is to judge whether
      the whole is defensible.

    citation: "18 U.S.C. § 1014; 18 U.S.C. § 1344"

    claim_provenance:
      - claim: "18 U.S.C. §1014 and §1344 attach to statements on credit applications"
        tag: sourced
        source: "specifications-v2 §6.3: '18 USC §1014 and §1344 — false statements on credit applications'"
      - claim: "Per-application written client authorization is required before submission"
        tag: sourced
        source: "specifications-v2 §6.3, same line; Decision B"
      - claim: "Preparation is Level 1 and submission is Level 3"
        tag: sourced
        source: "packages/core/src/authority.ts — draft_application: 1, submit_application: 3"
      - claim: "The middleware refuses a Level 1 agent attempting to submit"
        tag: sourced
        source: "packages/middleware/src/index.ts step 3, decideAuthority compares actor level against ACTION_MINIMUM_LEVEL"
      - claim: "A human presses the button"
        tag: reconstructed
        basis: "shaped from the Level 3 label 'Submit with human approval'; NOT enforced — the chain has no actor-kind step and a Level 3 agent passes it"
      - claim: "Signing on the client's behalf is hard-blocked"
        tag: sourced
        source: "packages/core/src/authority.ts PROHIBITED_ACTIONS includes sign_for_client"
      - claim: "When sources disagree the field is left unpopulated and routed to the client"
        tag: reconstructed
        basis: "shaped from the §1014 reason-to-know exposure; no source states the procedure"
      - claim: "No estimates on applications, ever"
        tag: reconstructed
        basis: "shaped by inversion from estimate-not-offer-v1, which mandates estimates on client-facing output; the inversion is the entry's own reasoning"
      - claim: "Seven escalation triggers, and the seventh is judgement"
        tag: proposed
        review_by: "Compliance & Evidence — the aggregate-misleading trigger resists mechanical enforcement by design"

    status: draft_pending_claim_library_approval

    notes: >-
      OPEN — approval authority is unspecified. "Human approval required at Level 3" is
      locked; which human is not. Any Compliance & Evidence member for standard
      applications, founders for edge cases under Gardner's escalation thresholds, is a
      reasonable read but has not been decided. Needs an approval-authority matrix from
      Village Compliance & Evidence and a founder decision.

      OPEN — in-flight work when compliance state changes. Trigger 4 freezes placement;
      it does not say what becomes of preparation already done. Discard, preserve for
      resumption, or time-box before requiring rebuild. Not blocking for this entry, but
      it will matter operationally.

      NOTED — trigger 7 resists mechanical enforcement by design. It is named here so
      the discipline is on the record and so the Level 3 reviewer knows it is theirs to
      apply. An entry that only listed the six testable triggers would imply the seventh
      does not exist.

      RAISED BY REVIEW — "a human presses the button" is not enforced. Level 3 is a
      level an agent can hold, and the middleware chain has seven steps of which none
      checks actor kind. A Level 3 agent calling submit_application passes it. The
      seeded playbook does place a `compliance_officer_approval` human_checkpoint before
      the `submit_application` node, but that is workflow SEQUENCING rather than a gate:
      it binds only work flowing through that playbook, and the engine dispatches the
      node by raising a notification rather than executing anything.

      The fix is one line in an idiom this codebase already uses in six places —
      `if (actor.kind !== 'human') return refused(...)`, as `deliverables/approval.ts`,
      `firewall/index.ts`, `retention/deletion.ts`, `billing/refunds.ts`,
      `admin/settings.ts` and `contracts/templates.ts` all do. It is not applied to
      submission. Given §1014 this is the highest-value single guard outstanding, and it
      is a code change rather than a library decision.

      RAISED BY REVIEW — synthetic-document detection does not exist. Trigger 3 names a
      capability nothing implements: `@bwc/intelligence` does `classifyByFilename` and
      coverage assessment — whether the documents required for a phase are present — and
      never inspects content. Note that classifying a document by its filename is the
      same shape of defect as moderating a video by its filename, found in AnimaForge
      this week. The trigger is kept and marked NOT BUILT rather than removed, so the
      requirement is on the record ahead of the capability.
  # =========================================================================
  # WRITTEN 1 September 2026, replacing the template. The Pack's own comment says
  # why it is separate: "Authorization and truthfulness are different offences: a
  # truthful application nobody authorised and an authorised application that
  # misstates revenue are each a violation on their own."
  # =========================================================================
  - entry_ref: compliance/application-authorization-v1
    framework: FALSE_STATEMENT_TO_LENDER
    jurisdiction: [FEDERAL]
    runtime_flag: per_application_authorization_required

    applicability_rule: >-
      Before any application is submitted to any lender on a client's behalf. Fires at
      submission, once per application, and covers what is being applied for, to whom, and
      for how much.

      THE PAIR TO compliance/application-truthfulness-v1, and the Pack states the split
      deliberately: a truthful application nobody authorised and an authorised application
      that misstates revenue are each a violation on their own. Truthfulness governs what the
      application says. This governs whether Burkham was asked to send it.

      WHY IT SITS UNDER FALSE_STATEMENT_TO_LENDER. Submitting an application in someone's name
      without their authorisation is itself a false statement to the lender — the lender is
      told this person is applying, and they are not. The exposure is not only to the client.

    agent_behavior_implication: >-
      ONE AUTHORIZATION, ONE APPLICATION. Naming the lender, the product and the amount. A
      client who authorised a $150,000 line of credit application to Meridian has not
      authorised a $400,000 one, has not authorised the same application to a second lender,
      and has not authorised a card application instead.

      THE AUTHORIZATION IS OBTAINED BEFORE SUBMISSION AND IS ON FILE AT THE MOMENT OF
      SUBMISSION. Not reconstructed afterwards from an email thread. The Consent &
      Authorization Centre holds it, scoped to the application reference, and
      `requestRecommendation` already refuses when it is absent — this is the one
      authorization discipline in the library that has an enforcer today.

      A SHOTGUN SUBMISSION IS SEVERAL VIOLATIONS, NOT ONE. Sending the same package to six
      lenders on one authorisation is five unauthorised applications and five hard inquiries
      the client did not agree to. Each lender is a separate authorization, and the client is
      told what a multi-lender strategy costs their credit profile before being asked to
      authorise it.

      AMOUNT CHANGES REQUIRE A NEW AUTHORIZATION, in either direction. Submitting for less
      than authorised is not obviously harmless: it can produce an approval the client would
      have declined and a success fee they did not expect against a facility that does not
      meet their need.

      RE-SUBMISSION IS SUBMISSION. An application declined and re-submitted after a change —
      a corrected figure, an added guarantor, a different structure — is a new application and
      needs a new authorisation. The client is told it was declined, and why, before being
      asked.

      A HUMAN SUBMITS, AND THE AUTHORIZATION DOES NOT CHANGE THAT.
      compliance/application-truthfulness-v1 puts submission at Authority Level 3 with a human
      pressing the button. An authorisation on file is a precondition for that human to act,
      never a substitute for them.

      WITHDRAWAL BINDS WHILE THE APPLICATION IS LIVE. A client may withdraw an application they
      authorised. Burkham notifies the lender and records the withdrawal; it does not let the
      application run because the work is already done.

    escalation_trigger: >-
      1. When a submission is attempted with no live authorization scoped to that application.
      Refuse. This is enforced today at `requestRecommendation`.

      2. When the lender, product or amount differs from what was authorised. Refuse and route;
      an agent does not decide the difference is immaterial.

      3. When a client asks for the same package to go to multiple lenders. Explain the inquiry
      cost, obtain a separate authorization per lender, and record that the cost was explained.

      4. When an application is to be re-submitted after a decline. New authorization, and the
      client is told about the decline first.

      5. When a client withdraws. Notify the lender, record the withdrawal, and stop.

      6. When a lender contacts Burkham about an application the client says they did not
      authorise. Compliance Review Board and outside counsel immediately. Do not respond to the
      lender before the authorization record has been checked.

      7. When an authorization is found to have been obtained after the submission it covers.
      Compliance & Evidence. This is a finding about the process, not a paperwork correction,
      and the pattern matters more than the instance.

    depends_on:
      - a check that the authorized lender, product and amount match what is actually submitted, which today is scoped by application reference alone
      - a client-facing statement of the credit-profile cost of a multi-lender strategy, before the authorisation is sought
      - a withdrawal path that notifies the lender

    citation: "18 U.S.C. § 1014 (false statement to a financial institution); 15 U.S.C. § 1681b(f) (obtaining a report without permissible purpose, where a submission triggers a pull)"

    claim_provenance:
      - claim: "Authorization and truthfulness are separate obligations"
        tag: sourced
        source: "packs/burkham-wickmont.draft.yaml, the comment above the two FALSE_STATEMENT_TO_LENDER rows: 'a truthful application nobody authorised and an authorised application that misstates revenue are each a violation on their own'."
      - claim: "Per-application written client authorization"
        tag: sourced
        source: "Marketing Plan Intake §4.2 Claims we make, item 6: 'Per-application written client authorization for all capital applications (Placement).' Enforced at placement/src/index.ts, which calls checkConsent for the 'application' kind scoped to the application reference."
      - claim: "Submitting in someone's name without authorisation is itself a false statement to the lender"
        tag: reconstructed
        basis: "18 U.S.C. §1014 reaches false statements to influence a financial institution's action; that an unauthorised applicant identity is such a statement is this entry's reading, not a cited holding."
      - claim: "One authorization per lender, and a shotgun submission is several violations"
        tag: reconstructed
        basis: "Follows from per-application authorisation plus the inquiry cost named in compliance/card-product-characterisation-v1. No source addresses multi-lender submission directly."
      - claim: "Amount changes need a new authorization in either direction"
        tag: proposed
        review_by: "Compliance Review Board. The downward case is the arguable one - it is included because a smaller approval can still produce a success fee against a facility that does not meet the need."
      - claim: "Re-submission after a decline is a new application"
        tag: proposed
        review_by: "Compliance Review Board. Operationally significant: it makes a decline a point at which the client must be re-engaged rather than a step the firm works through."
      - claim: "Withdrawal binds while the application is live"
        tag: reconstructed
        basis: "Shaped from the revocation discipline in compliance/glba-plaid-connection-v1 and the consent store's revocation support. No withdrawal path to a lender exists."

    status: draft_pending_claim_library_approval

    notes: >-
      THE ONE AUTHORIZATION DISCIPLINE WITH AN ENFORCER. `requestRecommendation` calls
      `check(tenantId, clientId, 'application', applicationRef)` and refuses without a live,
      unrevoked, unexpired consent scoped to that reference. Every other authorisation rule in
      this library is held by process; this one is held by code, and it is worth knowing which
      is which.

      WHAT THAT ENFORCER DOES NOT CHECK. The consent is scoped to an application REFERENCE, a
      string. It does not carry the lender, the product or the amount, so the check confirms
      that an authorisation exists for this application and not that the application matches
      what was authorised. Triggers 2 and the first dependency are about that gap: an agent
      could submit a $400,000 application under an authorisation the client gave for $150,000
      and the consent check would pass.

      OPEN — the multi-lender explanation. Trigger 3 requires the client to be told what a
      six-lender strategy costs their credit profile before authorising it. Nothing computes
      that, and compliance/card-product-characterisation-v1 depends on the same missing
      inquiry-count data. Three entries now need it.

      NOTED — the decline case is the one most likely to be breached under commercial
      pressure. A declined application is work already done with no success fee, and
      re-submitting after a correction is the natural next move. Requiring a fresh
      authorisation makes the client a participant in that decision rather than someone who
      finds out later. That is the cost, and it is the point.


  # =========================================================================
  # WRITTEN BY IVAN. This entry resolves an open question from the FTC_ACT review:
  # whether UDAAP and FTC_ACT both apply, or one was a shortcut for the other. The
  # answer is that they apply to different disciplines — FTC_ACT to deceptive claims
  # about Burkham, UDAAP to the abusive standard — so the templated
  # `compliance/udaap-claims-v1` is retired rather than written. Claims are covered
  # by compliance/own-claims-and-pricing-v1, and a second entry for the same
  # discipline under a second statute is the duplication this library avoids.
  #
  # The UDAAP Pack row is retargeted to this entry's flag accordingly.
  # `jurisdiction` corrected to a list.
  # =========================================================================
  - entry_ref: compliance/client-interest-standard-v1
    framework: UDAAP
    jurisdiction: [FEDERAL]
    runtime_flag: client_interest_standard_required

    applicability_rule: >-
      Every engagement decision, every recommendation, every point where Burkham's
      interest and the client's could diverge. Applies from intake through
      disengagement.

      THIS ENTRY HAS NO ELEMENTS. Unfair, deceptive and abusive are standards a
      regulator applies to a pattern, not tests to satisfy. It catches conduct that
      satisfies every specific rule and harms the client anyway.

      IT IS NOT A RESTATEMENT. Deception is covered by
      compliance/own-claims-and-pricing-v1, compliance/estimate-not-offer-v1 and
      compliance/card-product-characterisation-v1. Unfairness overlaps
      compliance/fair-treatment-in-routing-v1. What no other entry reaches is ABUSIVE:
      taking unreasonable advantage of a client's lack of understanding, or of their
      reliance on Burkham to act in their interest.

      That risk is specific and structural here. Burkham's clients are distressed
      businesses, usually declined elsewhere, who do not understand capital markets and
      are relying on Burkham to know better. That is precisely the vulnerability the
      standard was written for.

    agent_behavior_implication: >-
      THE STANDARD: Burkham's obligation is the client's outcome, not the placement.
      Where those diverge, the outcome wins, and the fee is lost.

      SAYING NO IS PART OF THE SERVICE. An agent is authorised and expected to recommend
      against — declining to engage, recommending a smaller scope, recommending a
      different service, recommending the client not raise capital at all. A firm that
      always helps and never advises against is optimising for the transaction, which is
      the pattern the standard exists to catch.

      THE BLUEPRINT REACHES A CONCLUSION ABOUT WHETHER, NOT ONLY HOW READY. It must be
      able to conclude "we recommend not raising capital at this time" with reasoning. A
      client who is solvent, creditworthy and eligible may still be better served doing
      nothing, and readiness for capital is not the same question as appropriateness of
      capital.

      RECOMMENDED SCOPE IS DISTINCT FROM ELIGIBLE SCOPE. The Recommendation Engine
      produces both, and they are not the same number. Eligible for $400K across a full
      stack; recommended $150K in a structure leaving room for future need. The
      recommendation is what serves the business. The client may choose more, and does so
      having been advised otherwise.

      THE FEE STRUCTURE PULLS AGAINST THE CLIENT IN FOUR PLACES. This is stated plainly
      because a misalignment nobody names is a misalignment nobody manages:

      1. a client best served by not raising at all — no placement, no success fee

      2. a client best served by a smaller stack — fees are per placement

      3. a client best served by waiting to strengthen their profile — waiting defers
      revenue

      4. a client best served by a lower-fee product — success fees are not neutral
      across product categories

      THREE OF THE FOUR are held by this entry and by human judgement. The fourth — a
      client best served by a lower-fee product — is now reached by Funding Ethics Firewall
      rule 2, which refuses a placement when a materially cheaper option of equal or better
      suitability was withheld for a reason of Burkham's own making. That is not the whole
      of the fourth misalignment: rule 2 catches the firm's supply constraints being passed
      to the client, and does not catch an agent steering toward a higher-fee product among
      options all equally available. The remainder stays with this entry.

      An earlier draft said the fourth was covered by "Rule 4". There was no rule 4 to
      cite, and now there is a different one — rule 4 is stacking. The correction and the
      later enumeration are recorded in notes.

      A SIGNED AGREEMENT IS NOT UNDERSTANDING. Where Burkham has reason to believe a
      client does not grasp what they agreed to, the signature does not insulate it. The
      discipline is not "get them to sign so we are protected" — it is "help them
      understand before they sign, and stop if it becomes clear they did not."

      Watch for: a statement revealing a factually wrong understanding of what was agreed
      · a question showing material information in a signed document was not absorbed ·
      an expected outcome Burkham never committed to · a belief that Burkham is doing
      something it is not · a belief the client is protected against something they are
      not.

      On any of those: stop at the point of divergence, route to a human, document the
      specific misunderstanding, re-educate on that point, and confirm understanding
      demonstrated — not merely re-signed. If understanding cannot be established, whether
      the engagement should continue is itself the question.

    escalation_trigger: >-
      1. When Blueprint analysis indicates raising capital is not appropriate for this
      client. Human review on whether to continue, redirect to Advisory, or advise
      against placement.

      2. When recommended scope is materially smaller than eligible scope. Never silently
      expand to eligible. Present the recommendation with reasoning; document a client's
      request for more; review the pattern if client-driven expansion becomes frequent.

      3. When the client's stated use of capital does not make business sense — $200K to
      expand into a market the economics do not support. Document the mismatch and route
      before placement.

      4. When aggregate patterns show recommendations skewing toward higher-fee products
      or larger placements, by agent, client type, or systematically. Compliance Review
      Board.

      5. When a client statement reveals a fundamental misunderstanding of agreed terms.
      Stop, route, re-educate, confirm understanding.

      6. When a client demonstrates an absorbed expectation that does not match reality —
      "I understand I'll be funded in 30 days", "I know the success rate is high for my
      profile". Correct it and document the correction. It indicates something reached
      them from marketing or a partner that should not have.

      7. When the client proceeds against Burkham's recommendation. Their right to do so
      is respected and the decision is documented — not to protect Burkham, but so the
      decision stays visible and reversible if their circumstances change.

      8. When the Compliance Review Board concludes in hindsight that Burkham should have
      declined or advised against. Not retrospective blame — the finding adjusts the
      discipline and enters agent training.

    depends_on:
      - Blueprint scope extending to whether capital is appropriate, not only readiness
      - Recommendation Engine producing recommended scope distinct from eligible scope
      - fee-alignment pattern tracking across agents, client types and product categories
      - workflow that surfaces a recommendation against placement rather than filtering it
      - scanner patterns for client statements indicating misunderstanding
      - declined engagements in training material, showing what the right call looks like when it is no
      - a Recommendation Engine check for fee-driven product selection among equally available options, which Firewall rule 2 does not reach

    citation: "12 U.S.C. § 5531 (CFPA, abusive); 15 U.S.C. § 45 (FTC Act, unfair and deceptive)"

    claim_provenance:
      - claim: "The abusive prong reaches taking advantage of a client's reliance"
        tag: sourced
        source: "12 U.S.C. §5531(d) (CFPA); specifications-v2 §6.3 names UDAAP standards for small-business financing conduct"
      - claim: "Stewardship over transactions is an operating principle"
        tag: sourced
        source: "specifications-v2 §3.2 design principle 2: 'Structure rewards stewardship, not transactions'"
      - claim: "Burkham's clients are distressed businesses usually declined elsewhere"
        tag: reconstructed
        basis: "shaped from the target personas in the draft Pack and the decline-recovery emphasis in CapitalForge; no spec line characterises the client base this way"
      - claim: "Saying no is part of the service, and the fee is lost"
        tag: reconstructed
        basis: "shaped from design principle 2; no source authorises an agent to recommend against engagement"
      - claim: "The Blueprint must be able to conclude 'do not raise capital'"
        tag: proposed
        review_by: "both founders — this is a scope change to the Blueprint deliverable, not a restatement"
      - claim: "Recommended scope is distinct from eligible scope"
        tag: proposed
        review_by: "Compliance Review Board and product — confirmed absent: the Engine takes one amount, requestedCreditLimit, matched against offering min/max"
      - claim: "The fee structure pulls against the client in four places"
        tag: reconstructed
        basis: "derived from successFeeBasisPoints being per-placement; the enumeration is the entry's own analysis"
      - claim: "Three of the four misalignments are held by this entry and human judgement; the fourth is partly reached by Firewall rule 2"
        tag: sourced
        source: "packages/firewall/src/rules.ts RULE_COST, enforced in placement/recommend.ts. Fee-driven selection among equally available options is still checked nowhere."
      - claim: "The Funding Ethics Firewall enforces five named rules: fit, cost, capacity, stacking, evidence"
        tag: sourced
        source: "Founder decision, 31 August 2026. The five and their effects were chosen; blueprint-v2 §6.2 asserted a count and never enumerated them. Implemented in packages/firewall/src/rules.ts as FIREWALL_RULES."
      - claim: "Each rule declares its own effect: three remove a candidate, two freeze the client"
        tag: sourced
        source: "Founder decision, 31 August 2026 — a product finding and a client finding are different and a single effect would be wrong about one of them. FirewallRule.effect."
      - claim: "A rule binds submission, not only recommendation, so a client's own instruction does not carry it"
        tag: sourced
        source: "Founder decision, 31 August 2026. Enforced for rules 1 and 4 at submitAttempt; declared and not yet evaluable for rules 2, 3 and 5 — see ADR-0086."
      - claim: "A signed agreement is not understanding"
        tag: reconstructed
        basis: "shaped from the abusive prong's 'lack of understanding' language; the five watch-fors and the demonstrate-don't-re-sign rule are the entry's own"

    status: draft_pending_claim_library_approval

    notes: >-
      THE PHILOSOPHICAL ENTRY. Every other entry states a discipline that can be checked.
      This one asks whether Burkham is optimising for the client's outcome or for
      placement volume, and whether it will earn less by placing less when placing less is
      right.

      The operating principles say stewardship over transactions and the Funding Ethics
      Firewall exists to stop harmful placement. But the Firewall constrains HOW capital
      is placed, not WHETHER placement should happen.

      GAP — no discipline currently asks, before engaging, whether raising capital serves
      this client. A client can be solvent, creditworthy, eligible, pass every Firewall
      check, get funded, and be worse off. Nothing fires.

      GAP — the Readiness Score measures readiness for funding, not appropriateness of
      funding. Those are different questions and the specs do not distinguish them.

      RECOMMENDED — disclose the incentive. State in the fee exhibit that success fees are
      earned on placement, that this creates a structural incentive, and name the
      disciplines that manage it. Defensive transparency: a client who knows the
      misalignment exists can weigh advice accordingly.

      RECOMMENDED — this entry evolves, and that is its nature rather than a defect. The
      others are largely static. This one requires institutional judgement about when
      clean rules are not enough, and that judgement is built from real cases, not
      specified upfront. Compliance Review Board should own its evolution as a standing
      responsibility.

      OPEN — the recommended-versus-eligible scope split is a design change to the
      Recommendation Engine, not a discipline addition. Confirmed absent: the Engine takes
      one amount, `requestedCreditLimit` — what the client asked for — and matches it
      against each offering's minimum and maximum. There is no second number for it to
      recommend, so producing one is new work rather than surfacing something computed.

      OPEN — scanner patterns for misunderstanding signals need real client interactions
      to learn from. Compliance & Evidence to draft once V1 has traffic.

      RESOLVED — the five ethical rules now exist. They are written, enumerated and
      enforced, by founder decision of 31 August 2026.

      The history matters because it is the pattern this library keeps finding. An earlier
      draft of this entry said "Rule 4 covers fee-driven product selection". There was no
      rule 4 to cite: blueprint-v2 §6.2 said the Firewall performs "automated enforcement
      of five ethical rules on placement eligibility", that sentence was the only mention
      across both reference documents, and the five were never enumerated. Nor were they
      implemented — `packages/firewall/src/index.ts` held a per-client triggered/clear flag
      whose `trigger` took an arbitrary reason string, and nothing in the codebase called
      it. The COUNT was what made the phantom citable: "five rules" reads as a known set,
      so an author reaches for one of them. `lenders/suitability.ts` did the same thing
      independently, calling a refinance into an advance "the stacking pattern the Funding
      Ethics Firewall exists to stop".

      THE FIVE, as decided and implemented in `packages/firewall/src/rules.ts`:

      1. FIT — a product that works against the client's stated need is not placed.
      Candidate removed. Fully enforceable: the Suitability Matrix scores all 42 pairs and
      13 are negative, and those were previously presented with a caution.

      2. COST — not placed when a materially cheaper option of equal or better suitability
      was withheld for a reason of Burkham's own making rather than the client's. Candidate
      removed. This is the one that reaches part of the fourth misalignment.

      3. CAPACITY — not placed where total obligations after placement would exceed the
      client's capacity to service them. Client freeze.

      4. STACKING — not placed where it would layer on an outstanding obligation: the same
      security pledged twice, or a placement before the last has settled. Client freeze.
      `suitability.ts` now cites this rule by number, correctly.

      5. EVIDENCE — not placed on terms nobody has verified against the issuer. Candidate
      removed. Decision D had built the provenance machinery and stopped at labelling; this
      supplies the consequence.

      THREE OF THE FIVE CARRY DECLARED GAPS, recorded on each rule in
      `unenforceableBecause` rather than smoothed over:

      · rule 2 cannot price a factor-rate product, which is the category most likely to be
      materially dearer, and its 300-basis-point spread is proposed rather than decided

      · rule 3 cannot see debt the client holds outside what Burkham brokered, cannot
      compute debt service from a free-text repayment structure, and measures against
      revenue rather than cash flow. Its refusal says so in as many words and calls the
      figure a floor rather than a total

      · rule 5 treats verification as asserted rather than proven: `issuer_rule` means
      somebody recorded a source and a date, not that the figure was re-checked

      Rules 2, 3 and 5 also declare that they bind submission as policy and cannot be
      evaluated at that seam. ADR-0086 sizes what would change that — one field on a
      funding attempt recording which recommendation it came from — so the gap is a
      decision rather than a default.

      RAISED BY REVIEW — the Section 6.2 collision, resolved by naming the document. In
      blueprint-v2 §6.2 is the Funding Ethics Firewall. Any reference
      to Blueprint drafting or the Readiness Score under that number is pointing at a
      different document and must say which — "marketing plan §6.2", not "Section 6.2".
      Two documents in this venture carry a §6.2 and they are unrelated.

      The Readiness Score components are specified in neither reference document; see the
      same note on compliance/own-claims-and-pricing-v1 and the standing note at the head
      of this file.

  - entry_ref: compliance/own-claims-and-pricing-v1
    framework: FTC_ACT
    jurisdiction: [FEDERAL]
    runtime_flag: own_claims_discipline_required

    applicability_rule: >-
      Everything Burkham says about itself — its service, its results, its pricing.
      Every client-facing communication, deliverable, portal message, call script,
      marketing asset, case study and web page. Broader than the transactional entries:
      this is not a rule about an action, it is a rule about content.

      Distinct from compliance/estimate-not-offer-v1, which governs numbers about LENDER
      products. Burkham's own service pricing — Blueprint tiers, retainers, success fees
      — carries no lending disclosure obligation. It carries this one.

      NO SAFE HARBOUR. Unlike TILA or FCRA there is no disclosure that makes a deceptive
      claim acceptable. The standard is whether a reasonable consumer would be misled,
      so this entry is mostly about what is never said.

    agent_behavior_implication: >-
      THIS ENTRY DEFINES NO PHRASES. The Marketing Claim Library holds the approved and
      banned lists; this is the rule for deciding what belongs on which.

      THE CLASSIFICATION RULE: a firm-scale factual claim about aggregate activity is
      permitted. A claim that shifts a prospective client's expectation about their own
      outcome is not — including when it is true.

      "Burkham Wickmont has facilitated over $X in capital placements since founding" —
      firm-scale, factual, implies nothing about this client. Permitted.

      "Our clients have received $X in funding" — the same figure, pointed at the
      reader. Banned.

      ACCURACY IS NOT THE QUESTION. POINTING IS. A performance figure can be literally
      true and still create an inference that does not match the individual case, and that
      inference is what the FTC enforces against. The cure is not to suppress the figure.
      It is to keep it firm-scale.

      PERMITTED AS A FIRM-SCALE STATISTIC, with substantiation and not-typical framing in
      the same statement:

      - "78% of engagements since founding resulted in at least one placement" —
      aggregate, historical, attributable, and saying nothing about the reader

      - "median time from engagement to first placement, across all clients, is 34 days"

      BANNED WHEN POINTED AT A PROSPECTIVE CLIENT'S OWN LIKELIHOOD, whatever the figure
      behind it:

      - "most clients get funded", said to someone deciding whether to engage — the same
      78% aimed at one person who may sit at 20% or 95%

      - "typical placement in 30 days" offered as what THIS client should expect

      - approval likelihoods presented as probabilities. No firm-scale reading survives: a
      probability is a statement about an individual outcome by construction

      - historical achievement offered as future expectation — the pointing is in the
      word "expectation", not in the history

      - speculation about lender behaviour — "Chase usually approves within 2 weeks".
      Banned outright: it is not Burkham's performance to characterise, and Burkham holds
      no substantiation for another firm's book

      - comparative claims against named competitors. Banned outright, for that reason plus
      the substantiation burden a comparison carries

      THE TEST is the classification rule above, applied. This list is not a second rule.
      "Burkham Wickmont has facilitated over $X in capital placements" is permitted and
      "our clients have received $X" is not, and a performance figure divides on exactly
      that line. Does the statement shift what THIS reader expects about THEIR own result?
      If yes, no disclaimer rescues it. If it is genuinely aggregate, substantiation and
      not-typical framing discharge it.

      SUBSTANTIATION IS A PRECONDITION, NOT A DISCLAIMER. A firm-scale figure may only be
      published if it is computable from the firm's own records, and the statement carries
      the period it is drawn from. A number nobody can reproduce is banned in both
      directions.

      OUTCOME PROMISES. `guarantee_approval` is a Level 4 prohibited action, hard-blocked
      by the middleware for every actor. The PHRASES that express it — "guaranteed
      approval", "guaranteed funding", "get you approved", "get you funded" — are banned
      Marketing Claim Library entries caught at chain step 7. Two mechanisms, and it is
      worth knowing which is which: the action gate cannot see a sentence, and the
      scanner cannot see an intent.

      DELIVERABLE PROMISES ARE PERMITTED. The Blueprint may promise its own contents: a
      readiness assessment with named components, in a stated format, by a stated date.
      It may not promise a funding outcome, a score movement, or a time to funding. The
      client receives an artifact, not a prediction.

      PRICING — two tiers, and the distinction is the rule:

      BASELINE pricing is public and quotable in any context, with no exhibit required.
      "The Readiness Blueprint is $497 Standard or $997 Comprehensive."

      ENGAGEMENT-SPECIFIC pricing requires the all-in fee exhibit presented and signed
      first. Which tier applies, which success-fee schedule, which credits, which
      protective terms — none of it is quotable before the exhibit.

      "WHAT WILL THIS COST ME" is answered in three parts and never with a specific
      engagement total: state the baseline; explain that total cost depends on services
      engaged and placements succeeded, and that the exhibit shows every possible fee;
      offer the exhibit.

      SUCCESS FEES carry three attributes every time they are mentioned:

      1. CONTINGENT — charged only on successful placement; nothing for a decline

      2. CAPPED — the ceiling, stated, regardless of placement size. NO CEILING EXISTS
      TODAY. `billing/seed.ts` prices success fees as basis points of the approved credit
      limit (300 for Foundation, 350 for Growth); `successFeeBasis()` returns the limit
      unchanged and nothing caps it. `minimumCents` is a floor with no ceiling
      counterpart. Until a cap is set, an agent stating one is stating something untrue,
      and this attribute cannot be satisfied by phrasing — see notes.

      3. TIMED — the triggering event, and that it appears in the per-application
      authorisation signed before submission

      The contingent framing is the critical one. A success fee described without it
      implies a guaranteed fee against no guaranteed service, which is the pattern that
      drew enforcement against comparable firms.

      PRICING VARIATIONS — an agent applies published logic and never its own judgement.
      Permitted: Blueprint credits, the auto-graduation retainer waiver, annual and
      quarterly prepay pricing. All of it is published pricing logic, not an exception.

      Not permitted at agent discretion: ad hoc discounts, goodwill waivers, reduced
      pricing to close a sale, any variation not in published logic. Two clients in
      materially similar situations quoted different prices creates a dispute-of-record
      whatever the intent.

    escalation_trigger: >-
      1. When output would state or imply a specific client outcome — most clients,
      typical result, you'll likely, should get funded.

      2. When a success fee is described without its contingent framing.

      3. When engagement-specific pricing is about to be quoted with no exhibit
      presented. Route to Consent & Authorization Center to present it first.

      4. When the client requests a discount, waiver or variation outside published
      logic. Compliance Review Board, both founders. An agent neither approves nor
      negotiates pricing.

      5. When any testimonial, case study or past-results claim is about to be released —
      regardless of source. FTC substantiation requires affirmative approval and
      documentation for every published performance claim.

      6. When a comparative claim names a competitor. Substantiation burden and
      litigation exposure both apply, and accuracy does not remove either.

      7. When the client references a specific promise Burkham allegedly made. Human
      Approval Console AND Compliance Review Board. Either output escaped scanning, a
      partner made an unsanctioned claim, or the client misremembers — all three need
      running down.

      8. When output contains a statistical or aggregate claim about firm performance,
      accurate or not. The agent does not judge whether a statistic is defensible; the
      human does.

    citation: "15 U.S.C. § 45 (FTC Act § 5); FTC Endorsement Guides, 16 C.F.R. Part 255 (2023)"

    depends_on:
      - Funding Readiness Score components specified, so a Blueprint deliverable promise names something that exists

    claim_provenance:
      - claim: "FTC Act §5 governs claims about the firm's own service"
        tag: sourced
        source: "15 U.S.C. §45; specifications-v2 §6.3 'FTC Act — small-business financing facilitation'"
      - claim: "Marketing claims require Compliance Review Board approval"
        tag: sourced
        source: "specifications-v2 §11: 'Marketing claims — versioned in Marketing Claim Library, Compliance Review Board approval required'"
      - claim: "Firm-scale factual claims are permitted; claims shifting a client's expectation are not"
        tag: reconstructed
        basis: "shaped from FTC substantiation doctrine; the firm-scale/reader-pointed distinction is the entry's own formulation"
      - claim: "A performance figure is permitted firm-scale with substantiation and not-typical framing, and banned when pointed at a prospective client's own likelihood"
        tag: sourced
        source: "Founder decision, 31 August 2026. Resolves the conflict with the seeded Marketing Claim Library: `success rate` and `typical` stay requires_disclaimer and this entry changed instead. Recorded in notes."
      - claim: "Lender-behaviour speculation and named-competitor comparisons are banned outright, with no firm-scale reading"
