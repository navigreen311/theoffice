  - entry_ref: compliance/call-recording-consent-v1
    framework: TWO_PARTY_CONSENT_RECORDING
    jurisdiction: [CA, FL, IL, MD, MA, MT, NH, OR, PA, WA, CT]
    runtime_flag: recording_consent_required

    applicability_rule: >-
      Any recorded call, whoever dialled. Applies to founder-led Blueprint Review
      calls, Concierge Desk calls, AI-mediated VoiceForge calls, and inbound calls
      reaching a routing system.

      NOT CUT BY THE OUTBOUND DECISION. V1 cuts outbound telemarketing; this entry is
      untouched by that, because two-party consent attaches to RECORDING, not to who
      initiated. Module 4.3 records every founder-led and Concierge call, so an inbound
      call from a client in California is squarely in scope.

    agent_behavior_implication: >-
      EXPLICIT CONSENT, EVERY CALL, EVERY JURISDICTION. California's Invasion of Privacy
      Act has been read to require affirmative consent rather than disclosure plus
      continued participation. "This call is being recorded, by continuing you consent"
      does not work there. Rather than run per-state consent models, one rule: every
      party affirmatively says yes before recording proceeds. Over-restrictive in
      permissive states, and the operational simplicity beats the risk of implementing
      jurisdiction detection wrongly.

      SILENCE IS NOT CONSENT. A party who neither agrees nor refuses has not consented.
      Re-prompt; if still unresponsive, proceed unrecorded or end the call.

      THE DISCLOSURE IS SCRIPTED. Not ad hoc. Marketing Claim Library approved list,
      Compliance & Evidence drafted, both founders approved. Delivery varies by call
      type: a human reads it on founder-led and human-Concierge calls; VoiceForge
      announces it on AI-mediated calls; a routing system announces it before anyone
      joins.

      WHEN SOMEONE REFUSES AT THE START — recording does not begin. Whether the call
      proceeds depends on whether recording is operationally required. A routine service
      question does not need one. A Blueprint Review where disclosures are made and
      engagement is authorised does: without a recording there is no audit trail of what
      was disclosed and what was authorised, so the call is rescheduled or moved to a
      medium with a different consent structure.

      WHEN SOMEONE WITHDRAWS MID-CALL — recording stops immediately. The portion already
      captured is retained under Regulatory Engine retention with the withdrawal
      timestamped, because that portion was consensual and may be needed as a record of
      what was said before. It is marked so nobody later uses it as though consent had
      been continuous.

      WHEN SOMEONE JOINS MID-CALL — pause, restate, capture, resume. The new party was
      not present for the original consent and has not consented to anything.

      1. recording pauses on detection of the new participant

      2. the scripted disclosure is restated to them

      3. they consent — recording resumes as a NEW SEGMENT

      4. they refuse — recording does not resume; the call continues unrecorded if its
      purpose permits

      The earlier portion is retained. The original parties consented to it and a later
      arrival does not retroactively invalidate that. But the recording is SEGMENTED,
      with timestamps and per-segment consent records showing which parties consented to
      which portion.

      THIS IS WHERE THE DISCIPLINE FAILS IN PRACTICE. Two-party consent violations do
      not happen through anyone deciding to ignore consent. They happen because somebody
      joins at minute twenty, nobody wants to break the flow of the conversation, and the
      recording keeps running. The pause is an interruption and it is meant to be one.

      Every join, leave and rejoin is a separate consent event.

    escalation_trigger: >-
      1. When a recording reaches the Compliance Evidence Vault with consent capture
      missing or incomplete for any participant. Quarantined pending human review — not
      deleted, since it may be needed for audit, and not usable for any purpose until the
      gap is resolved.

      2. When participants span jurisdictions with materially different requirements and
      the handler is unsure which apply. Route before the call proceeds; default to the
      strictest.

      3. When a participant is unidentified — an unknown caller, an unverified mid-call
      joiner. Consent from an unverified party may not be sufficient. Human review;
      possibly end and re-establish with verified participants.

      4. When consent is withdrawn while a compliance disclosure is being made or an
      authorisation captured. The record of that disclosure is now incomplete. Stop,
      route, and restart the sequence under a workable consent arrangement.

      5. When recording infrastructure fails after consent was captured. Not a consent
      violation — the parties agreed to something that did not happen. But the audit
      trail is lost, so a human decides whether the call must be redone.

      6. When a participant asks about their recording rights — a copy, a deletion, a
      question about use. Compliance & Evidence handles it per the jurisdiction's
      requirements.

      7. When recorded content is proposed for any use beyond internal audit and
      compliance — a testimonial, marketing material, a training example. Recording
      consent is not use consent. Additional consent is required and the Compliance
      Review Board reviews the use.

      8. When a call is to be recorded in NEVADA, until the contradiction in the notes is
      resolved. Two live artifacts in this portfolio disagree about whether NV is a
      one-party or all-party state, and NV is Burkham's first-listed target geography.

    depends_on:
      - VoiceForge pause, resume, participant detection, and system-announced disclosure
      - Marketing Claim Library scripted disclosures per call type, founder-approved
      - Regulatory Engine jurisdiction-specific disclosure variants, per state activation
      - Compliance Evidence Vault storage with segmentation metadata and per-segment consent
      - Concierge Desk procedures for human-handled joins and refusals
      - the required-recording versus optional-recording decision matrix
      - resolution of the Nevada one-party / all-party contradiction

    citation: "Cal. Penal Code § 632 (IPA); Fla. Stat. § 934.03; 720 ILCS 5/14-2; Md. Cts & Jud. Proc. § 10-402; Mass. Gen. Laws ch. 272 § 99; Mont. Code § 45-8-213; N.H. RSA 570-A:2; Or. Rev. Stat. § 165.540; 18 Pa. C.S. § 5703; Wash. Rev. Code § 9.73.030; Conn. Gen. Stat. § 52-570d"

    claim_provenance:
      - claim: "All-party consent states require every participant's consent"
        tag: sourced
        source: "packages/calls/src/consent.ts ALL_PARTY_CONSENT_STATES — eleven states with per-state citations"
      - claim: "Recording without required consent is a crime in the client's state"
        tag: sourced
        source: "packages/calls/src/consent.ts module header, and @bwc/consent's call_recording comment"
      - claim: "One rule for every jurisdiction rather than per-state consent models"
        tag: reconstructed
        basis: "shaped from the operational-simplicity argument; the code computes per-state and this entry deliberately over-restricts"
      - claim: "Silence is not consent"
        tag: reconstructed
        basis: "shaped from California IPA affirmative-consent reading; not stated in code or spec"
      - claim: "Every join, leave and rejoin is a separate consent event, and recording is segmented"
        tag: proposed
        review_by: "Compliance & Evidence and engineering — nothing supports segmentation or per-segment consent records; this is the entry's principal contribution"
      - claim: "The disclosure is scripted and Claim Library approved"
        tag: proposed
        review_by: "Compliance & Evidence and both founders — not drafted"
      - claim: "Nevada's regime is contradicted between two live artifacts"
        tag: sourced
        source: "Office compliance_library_entry compliance/nv-two-party-consent-v1 says all-party; Console CONFIRMED_ONE_PARTY_STATES includes NV"

    status: draft_pending_claim_library_approval

    notes: >-
      RECOMMENDED SEQUENCING — founder-led calls launch first, with human-delivered
      disclosure and manual consent handling. Those have stable participant lists and
      need no VoiceForge capability. AI-mediated calls follow once the infrastructure
      supports pause, participant detection and consent capture. This lets the entry
      apply operationally at V1 rather than waiting on engineering.

      OPEN — complex multi-party calls. Participants joining and leaving repeatedly make
      every transition a consent event, and V1 may not handle that reliably. Recommend
      such conversations move to scheduled multi-party video or in-person with a
      different consent structure, rather than being handled badly on a call.

      OPEN — whether pre-withdrawal recording may be retained. Retention with notation is
      the default here; some jurisdictions may require destruction. Counsel review at
      state activation.

      OPEN — the required-recording decision matrix. The heuristic is that any call
      making a compliance disclosure or capturing an authorisation requires recording,
      and routine service questions do not. Compliance & Evidence to make that a rule.

      OPEN — how VoiceForge captures affirmative consent: voice recognition, keypress,
      verbal confirmation. The entry states the requirement; the mechanism is an
      engineering decision.

      OPEN — multi-jurisdiction detection. Trigger 2 assumes participant location is
      known and it may not be. Needs a default.

      CONTRADICTION — NEVADA. Two live artifacts in this portfolio disagree, and one of
      them is wrong.

      The Office's Compliance Library holds `compliance/nv-two-party-consent-v1`,
      framework TWO_PARTY_CONSENT_RECORDING, jurisdiction {NV} — an authored, live entry
      asserting Nevada is all-party. Greenstone's Pack declares it and resolves against
      it.

      Burkham's Console lists NV in `CONFIRMED_ONE_PARTY_STATES` in
      `packages/calls/src/consent.ts`, alongside NY, TX, AZ and UT, with the comment
      that these are "confirmed rather than assumed so the distinction between 'checked'
      and 'not on the other list' survives". CONFIRMED is the strongest word that module
      uses.

      So: one portfolio, one state, two live artifacts, opposite conclusions. Nevada is
      FIRST on Burkham's target_geographies, Greenstone already records calls there, and
      the Console's own module header states the stake plainly — recording a client
      without the consent their state requires is a crime in the state where the CLIENT
      is sitting. The Console defaults an unlisted state to one-party, so if the Office
      entry is right, Burkham records NV calls without the consent Nevada requires.

      This is a counsel question and not one this entry can settle. What it can do is
      refuse to proceed on it: trigger 8 holds NV recordings until it is resolved, and
      the resolution belongs in `openQuestion` on the NV rule rather than in a comment.

      RAISED BY REVIEW — the jurisdiction list. `ALL_PARTY_CONSENT_STATES` in
      `@bwc/calls` holds eleven with citations: CA, FL, IL, MD, MA, MT, NH, OR, PA, WA,
      CT. This entry listed nine and a "+". OR and CT were the two the "+" stood for and
      are now named, with citations added. A placeholder in a jurisdiction list is worth
      avoiding for its own sake: the list is what decides whether the entry binds, and
      "+" binds nothing.

      RAISED BY REVIEW — more of this is built than the entry assumes. `@bwc/calls` has
      `capture.ts` with a real `beginCall` consent decision, a `CallStatus` of
      consent_refused / recording / captured / analysed, and `consentBasis` STORED rather
      than derived later, on the reasoning that the rule may change. `@bwc/consent`
      already carries `call_recording` as one of its nine kinds, with a comment stating
      the same jurisdictional principle this entry does. The all-party list is data with
      citations and is marked as requiring counsel confirmation.

      What is NOT built is the part this entry adds: SEGMENTATION. Nothing supports
      pausing, restating, and resuming as a new segment with per-segment consent records.
      That is the entry's real contribution and it is the dependency to fund.

