  # =========================================================================
  # WRITTEN BY IVAN. This entry resolves an open question from the FTC_ACT review:
  # whether UDAAP and FTC_ACT both apply, or one was a shortcut for the other. The
  # answer is that they apply to different disciplines — FTC_ACT to deceptive claims
  # about Burkham, UDAAP to the abusive standard — so the templated
  # `compliance/udaap-claims-v1` is retired rather than written. Claims are covered
  # by compliance/own-claims-and-pricing-v1, and a second entry for the same
  # discipline under a second statute is the duplication this library avoids.
  #
  # The UDAAP Pack row is retargeted to this entry's flag accordingly.
  # `jurisdiction` corrected to a list.
  # =========================================================================
  - entry_ref: compliance/client-interest-standard-v1
    framework: UDAAP
    jurisdiction: [FEDERAL]
    runtime_flag: client_interest_standard_required

    applicability_rule: >-
      Every engagement decision, every recommendation, every point where Burkham's
      interest and the client's could diverge. Applies from intake through
      disengagement.

      THIS ENTRY HAS NO ELEMENTS. Unfair, deceptive and abusive are standards a
      regulator applies to a pattern, not tests to satisfy. It catches conduct that
      satisfies every specific rule and harms the client anyway.

      IT IS NOT A RESTATEMENT. Deception is covered by
      compliance/own-claims-and-pricing-v1, compliance/estimate-not-offer-v1 and
      compliance/card-product-characterisation-v1. Unfairness overlaps
      compliance/fair-treatment-in-routing-v1. What no other entry reaches is ABUSIVE:
      taking unreasonable advantage of a client's lack of understanding, or of their
      reliance on Burkham to act in their interest.

      That risk is specific and structural here. Burkham's clients are distressed
      businesses, usually declined elsewhere, who do not understand capital markets and
      are relying on Burkham to know better. That is precisely the vulnerability the
      standard was written for.

    agent_behavior_implication: >-
      THE STANDARD: Burkham's obligation is the client's outcome, not the placement.
      Where those diverge, the outcome wins, and the fee is lost.

      SAYING NO IS PART OF THE SERVICE. An agent is authorised and expected to recommend
      against — declining to engage, recommending a smaller scope, recommending a
      different service, recommending the client not raise capital at all. A firm that
      always helps and never advises against is optimising for the transaction, which is
      the pattern the standard exists to catch.

      THE BLUEPRINT REACHES A CONCLUSION ABOUT WHETHER, NOT ONLY HOW READY. It must be
      able to conclude "we recommend not raising capital at this time" with reasoning. A
      client who is solvent, creditworthy and eligible may still be better served doing
      nothing, and readiness for capital is not the same question as appropriateness of
      capital.

      RECOMMENDED SCOPE IS DISTINCT FROM ELIGIBLE SCOPE. The Recommendation Engine
      produces both, and they are not the same number. Eligible for $400K across a full
      stack; recommended $150K in a structure leaving room for future need. The
      recommendation is what serves the business. The client may choose more, and does so
      having been advised otherwise.

      THE FEE STRUCTURE PULLS AGAINST THE CLIENT IN FOUR PLACES. This is stated plainly
      because a misalignment nobody names is a misalignment nobody manages:

      1. a client best served by not raising at all — no placement, no success fee

      2. a client best served by a smaller stack — fees are per placement

      3. a client best served by waiting to strengthen their profile — waiting defers
      revenue

      4. a client best served by a lower-fee product — success fees are not neutral
      across product categories

      ALL FOUR are held by this entry and by human judgement, and by nothing else today.
      An earlier draft said the fourth was covered by a Funding Ethics Firewall rule. It
      is not — see notes.

      A SIGNED AGREEMENT IS NOT UNDERSTANDING. Where Burkham has reason to believe a
      client does not grasp what they agreed to, the signature does not insulate it. The
      discipline is not "get them to sign so we are protected" — it is "help them
      understand before they sign, and stop if it becomes clear they did not."

      Watch for: a statement revealing a factually wrong understanding of what was agreed
      · a question showing material information in a signed document was not absorbed ·
      an expected outcome Burkham never committed to · a belief that Burkham is doing
      something it is not · a belief the client is protected against something they are
      not.

      On any of those: stop at the point of divergence, route to a human, document the
      specific misunderstanding, re-educate on that point, and confirm understanding
      demonstrated — not merely re-signed. If understanding cannot be established, whether
      the engagement should continue is itself the question.

    escalation_trigger: >-
      1. When Blueprint analysis indicates raising capital is not appropriate for this
      client. Human review on whether to continue, redirect to Advisory, or advise
      against placement.

      2. When recommended scope is materially smaller than eligible scope. Never silently
      expand to eligible. Present the recommendation with reasoning; document a client's
      request for more; review the pattern if client-driven expansion becomes frequent.

      3. When the client's stated use of capital does not make business sense — $200K to
      expand into a market the economics do not support. Document the mismatch and route
      before placement.

      4. When aggregate patterns show recommendations skewing toward higher-fee products
      or larger placements, by agent, client type, or systematically. Compliance Review
      Board.

      5. When a client statement reveals a fundamental misunderstanding of agreed terms.
      Stop, route, re-educate, confirm understanding.

      6. When a client demonstrates an absorbed expectation that does not match reality —
      "I understand I'll be funded in 30 days", "I know the success rate is high for my
      profile". Correct it and document the correction. It indicates something reached
      them from marketing or a partner that should not have.

      7. When the client proceeds against Burkham's recommendation. Their right to do so
      is respected and the decision is documented — not to protect Burkham, but so the
      decision stays visible and reversible if their circumstances change.

      8. When the Compliance Review Board concludes in hindsight that Burkham should have
      declined or advised against. Not retrospective blame — the finding adjusts the
      discipline and enters agent training.

    depends_on:
      - Blueprint scope extending to whether capital is appropriate, not only readiness
      - Recommendation Engine producing recommended scope distinct from eligible scope
      - fee-alignment pattern tracking across agents, client types and product categories
      - workflow that surfaces a recommendation against placement rather than filtering it
      - scanner patterns for client statements indicating misunderstanding
      - declined engagements in training material, showing what the right call looks like when it is no
      - the Funding Ethics Firewall's five ethical rules, enumerated and implemented

    citation: "12 U.S.C. § 5531 (CFPA, abusive); 15 U.S.C. § 45 (FTC Act, unfair and deceptive)"

    claim_provenance:
      - claim: "The abusive prong reaches taking advantage of a client's reliance"
        tag: sourced
        source: "12 U.S.C. §5531(d) (CFPA); specifications-v2 §6.3 names UDAAP standards for small-business financing conduct"
      - claim: "Stewardship over transactions is an operating principle"
        tag: sourced
        source: "specifications-v2 §3.2 design principle 2: 'Structure rewards stewardship, not transactions'"
      - claim: "Burkham's clients are distressed businesses usually declined elsewhere"
        tag: reconstructed
        basis: "shaped from the target personas in the draft Pack and the decline-recovery emphasis in CapitalForge; no spec line characterises the client base this way"
      - claim: "Saying no is part of the service, and the fee is lost"
        tag: reconstructed
        basis: "shaped from design principle 2; no source authorises an agent to recommend against engagement"
      - claim: "The Blueprint must be able to conclude 'do not raise capital'"
        tag: proposed
        review_by: "both founders — this is a scope change to the Blueprint deliverable, not a restatement"
      - claim: "Recommended scope is distinct from eligible scope"
        tag: proposed
        review_by: "Compliance Review Board and product — confirmed absent: the Engine takes one amount, requestedCreditLimit, matched against offering min/max"
      - claim: "The fee structure pulls against the client in four places"
        tag: reconstructed
        basis: "derived from successFeeBasisPoints being per-placement; the enumeration is the entry's own analysis"
      - claim: "All four misalignments are held by this entry and human judgement alone"
        tag: sourced
        source: "packages/firewall/src/index.ts — a triggered/clear flag with an arbitrary reason string; no rule evaluation, and no fee-driven product selection check exists anywhere"
      - claim: "A signed agreement is not understanding"
        tag: reconstructed
        basis: "shaped from the abusive prong's 'lack of understanding' language; the five watch-fors and the demonstrate-don't-re-sign rule are the entry's own"

    status: draft_pending_claim_library_approval

    notes: >-
      THE PHILOSOPHICAL ENTRY. Every other entry states a discipline that can be checked.
      This one asks whether Burkham is optimising for the client's outcome or for
      placement volume, and whether it will earn less by placing less when placing less is
      right.

      The operating principles say stewardship over transactions and the Funding Ethics
      Firewall exists to stop harmful placement. But the Firewall constrains HOW capital
      is placed, not WHETHER placement should happen.

      GAP — no discipline currently asks, before engaging, whether raising capital serves
      this client. A client can be solvent, creditworthy, eligible, pass every Firewall
      check, get funded, and be worse off. Nothing fires.

      GAP — the Readiness Score measures readiness for funding, not appropriateness of
      funding. Those are different questions and the specs do not distinguish them.

      RECOMMENDED — disclose the incentive. State in the fee exhibit that success fees are
      earned on placement, that this creates a structural incentive, and name the
      disciplines that manage it. Defensive transparency: a client who knows the
      misalignment exists can weigh advice accordingly.

      RECOMMENDED — this entry evolves, and that is its nature rather than a defect. The
      others are largely static. This one requires institutional judgement about when
      clean rules are not enough, and that judgement is built from real cases, not
      specified upfront. Compliance Review Board should own its evolution as a standing
      responsibility.

      OPEN — the recommended-versus-eligible scope split is a design change to the
      Recommendation Engine, not a discipline addition. Confirmed absent: the Engine takes
      one amount, `requestedCreditLimit` — what the client asked for — and matches it
      against each offering's minimum and maximum. There is no second number for it to
      recommend, so producing one is new work rather than surfacing something computed.

      OPEN — scanner patterns for misunderstanding signals need real client interactions
      to learn from. Compliance & Evidence to draft once V1 has traffic.

      RAISED BY REVIEW — the fourth misalignment is NOT covered, and the correction runs
      in the unsafe direction. An earlier draft said "Rule 4 covers fee-driven product
      selection". There is no Rule 4 to cite. blueprint-v2 §6.2 says the Firewall performs
      "automated enforcement of five ethical rules on placement eligibility" and that
      sentence is the ONLY mention of them in either reference document. The five are
      never enumerated anywhere.

      Nor are they implemented as rules. `packages/firewall/src/index.ts` exposes
      `status`, `trigger`, `clear` and `evaluate`: a per-client triggered/clear flag whose
      `trigger` takes an arbitrary `reason` string, plus the Decision E coupling to
      compliance state. It is a flag a human or an agent sets, not five conditions
      evaluated. And nothing anywhere checks fee-driven product selection — the search
      returns nothing.

      So all four misalignments rest on this entry and on human judgement. The entry now
      says four rather than three, and the missing enumeration is a dependency rather than
      an assumption.

      RAISED BY REVIEW — the Section 6.2 collision, resolved by naming the document. In
      `docs/reference/blueprint-v2.md` §6.2 is the Funding Ethics Firewall. Any reference
      to Blueprint drafting or the Readiness Score under that number is pointing at a
      different document and must say which — "marketing plan §6.2", not "Section 6.2".
      Two documents in this venture carry a §6.2 and they are unrelated.

      The Readiness Score components are specified in neither reference document; see the
      same note on compliance/own-claims-and-pricing-v1 and the standing note at the head
      of this file.

  - entry_ref: compliance/own-claims-and-pricing-v1
    framework: FTC_ACT
    jurisdiction: [FEDERAL]
    runtime_flag: own_claims_discipline_required

    applicability_rule: >-
      Everything Burkham says about itself — its service, its results, its pricing.
      Every client-facing communication, deliverable, portal message, call script,
      marketing asset, case study and web page. Broader than the transactional entries:
      this is not a rule about an action, it is a rule about content.

      Distinct from compliance/estimate-not-offer-v1, which governs numbers about LENDER
      products. Burkham's own service pricing — Blueprint tiers, retainers, success fees
      — carries no lending disclosure obligation. It carries this one.

      NO SAFE HARBOUR. Unlike TILA or FCRA there is no disclosure that makes a deceptive
      claim acceptable. The standard is whether a reasonable consumer would be misled,
      so this entry is mostly about what is never said.

    agent_behavior_implication: >-
      THIS ENTRY DEFINES NO PHRASES. The Marketing Claim Library holds the approved and
      banned lists; this is the rule for deciding what belongs on which.

      THE CLASSIFICATION RULE: a firm-scale factual claim about aggregate activity is
      permitted. A claim that shifts a prospective client's expectation about their own
      outcome is not — including when it is true.

      "Burkham Wickmont has facilitated over $X in capital placements since founding" —
      firm-scale, factual, implies nothing about this client. Permitted.

      "Our clients have received $X in funding" — the same figure, pointed at the
      reader. Banned.

      BANNED REGARDLESS OF ACCURACY. Every one of these can be literally true and each
      creates an inference that does not match the individual case:

      - success rates — "most clients get funded". True at 78% across the book, and this
      client may sit at 20% or 95%

      - timeframe averages — "typical placement in 30 days"

      - approval likelihoods presented as probabilities

      - historical achievement offered as future expectation

      - speculation about lender behaviour — "Chase usually approves within 2 weeks"

      - comparative claims against named competitors

      The test: does the statement shift what a reasonable consumer expects about their
      own result? If yes, it is banned whether or not it is accurate. Technical truth is
      not a defence, and it is the specific pattern the FTC enforces.

      OUTCOME PROMISES. `guarantee_approval` is a Level 4 prohibited action, hard-blocked
      by the middleware for every actor. The PHRASES that express it — "guaranteed
      approval", "guaranteed funding", "get you approved", "get you funded" — are banned
      Marketing Claim Library entries caught at chain step 7. Two mechanisms, and it is
      worth knowing which is which: the action gate cannot see a sentence, and the
      scanner cannot see an intent.

      DELIVERABLE PROMISES ARE PERMITTED. The Blueprint may promise its own contents: a
      readiness assessment with named components, in a stated format, by a stated date.
      It may not promise a funding outcome, a score movement, or a time to funding. The
      client receives an artifact, not a prediction.

      PRICING — two tiers, and the distinction is the rule:

      BASELINE pricing is public and quotable in any context, with no exhibit required.
      "The Readiness Blueprint is $497 Standard or $997 Comprehensive."

      ENGAGEMENT-SPECIFIC pricing requires the all-in fee exhibit presented and signed
      first. Which tier applies, which success-fee schedule, which credits, which
      protective terms — none of it is quotable before the exhibit.

      "WHAT WILL THIS COST ME" is answered in three parts and never with a specific
      engagement total: state the baseline; explain that total cost depends on services
      engaged and placements succeeded, and that the exhibit shows every possible fee;
      offer the exhibit.

      SUCCESS FEES carry three attributes every time they are mentioned:

      1. CONTINGENT — charged only on successful placement; nothing for a decline

      2. CAPPED — the ceiling, stated, regardless of placement size

      3. TIMED — the triggering event, and that it appears in the per-application
      authorisation signed before submission

      The contingent framing is the critical one. A success fee described without it
      implies a guaranteed fee against no guaranteed service, which is the pattern that
      drew enforcement against comparable firms.

      PRICING VARIATIONS — an agent applies published logic and never its own judgement.
      Permitted: Blueprint credits, the auto-graduation retainer waiver, annual and
      quarterly prepay pricing. All of it is published pricing logic, not an exception.

      Not permitted at agent discretion: ad hoc discounts, goodwill waivers, reduced
      pricing to close a sale, any variation not in published logic. Two clients in
      materially similar situations quoted different prices creates a dispute-of-record
      whatever the intent.

    escalation_trigger: >-
      1. When output would state or imply a specific client outcome — most clients,
      typical result, you'll likely, should get funded.

      2. When a success fee is described without its contingent framing.

      3. When engagement-specific pricing is about to be quoted with no exhibit
      presented. Route to Consent & Authorization Center to present it first.

      4. When the client requests a discount, waiver or variation outside published
      logic. Compliance Review Board, both founders. An agent neither approves nor
      negotiates pricing.

      5. When any testimonial, case study or past-results claim is about to be released —
      regardless of source. FTC substantiation requires affirmative approval and
      documentation for every published performance claim.

      6. When a comparative claim names a competitor. Substantiation burden and
      litigation exposure both apply, and accuracy does not remove either.

      7. When the client references a specific promise Burkham allegedly made. Human
      Approval Console AND Compliance Review Board. Either output escaped scanning, a
      partner made an unsanctioned claim, or the client misremembers — all three need
      running down.

      8. When output contains a statistical or aggregate claim about firm performance,
      accurate or not. The agent does not judge whether a statistic is defensible; the
      human does.

    citation: "15 U.S.C. § 45 (FTC Act § 5); FTC Endorsement Guides, 16 C.F.R. Part 255 (2023)"

    depends_on:
      - Funding Readiness Score components specified, so a Blueprint deliverable promise names something that exists

    claim_provenance:
      - claim: "FTC Act §5 governs claims about the firm's own service"
        tag: sourced
        source: "15 U.S.C. §45; specifications-v2 §6.3 'FTC Act — small-business financing facilitation'"
      - claim: "Marketing claims require Compliance Review Board approval"
        tag: sourced
        source: "specifications-v2 §11: 'Marketing claims — versioned in Marketing Claim Library, Compliance Review Board approval required'"
      - claim: "Firm-scale factual claims are permitted; claims shifting a client's expectation are not"
        tag: reconstructed
        basis: "shaped from FTC substantiation doctrine; the firm-scale/reader-pointed distinction is the entry's own formulation"
      - claim: "Banned regardless of accuracy — success rates, timeframe averages, approval likelihoods"
        tag: proposed
        review_by: "Compliance Review Board — applying this rule reclassifies two SEEDED claims from requires_disclaimer to banned: 'success rate' and 'typical'"
      - claim: "guarantee_approval is a Level 4 prohibited action"
        tag: sourced
        source: "packages/core/src/authority.ts PROHIBITED_ACTIONS"
      - claim: "Baseline pricing is quotable; engagement-specific pricing requires the exhibit first"
        tag: reconstructed
        basis: "shaped from packages/billing/src/exhibit.ts, which assembles the exhibit from the engagement record; the two-tier quoting rule is not stated anywhere"
      - claim: "Success fees carry contingent, capped and timed framing every time"
        tag: proposed
        review_by: "Compliance & Evidence — approved phrasing not drafted"
      - claim: "No testimonials in V1; case studies with consent are permitted"
        tag: proposed
        review_by: "both founders — recorded as DECIDED in the entry, resting on the Endorsement Guides' typical-results requirement"
      - claim: "An agent applies published pricing logic and never its own judgement"
        tag: reconstructed
        basis: "shaped from the dispute-of-record risk; no source prohibits agent-level discounting"

    status: draft_pending_claim_library_approval

    notes: >-
      DECIDED — no testimonials in V1. Client quotes about their experience are
      persistent FTC enforcement bait: the Endorsement Guides require material
      disclosures, typical-results framing and substantiation for each claim, and the
      typical-results requirement is where comparable firms fail. Case studies with
      affirmative client consent, structured facts, dated outcomes and a
      results-not-typical disclosure are permitted. Testimonials at V1.5, with counsel
      review and per-claim substantiation.

      ACTION — anchor customer consent must be structured before the engagements begin.
      Greenstone EMD and MedLink payroll float will be the first case studies, and a case
      study needs consent captured at the outset, not requested afterwards. Compliance &
      Evidence owns this and it is time-sensitive.

      OPEN — trigger 8 has no implementation. Detecting a statistical claim is a pattern
      problem, not a banned-phrase problem, and the Scanner does phrases. Three routes: a
      Scanner rule, an agent self-catch trained into output discipline, or
      human-review-by-default for any claim containing a number about firm activity. The
      third is crude and works today. NOTE — `detectLenderNumbers` in @bwc/scanner is a
      worked precedent for the first route: number shapes detected in code, gated on
      nearby context terms, feeding the same requiredDisclosures path. A firm-performance
      variant would gate on "clients", "funded", "placements", "approval" rather than on
      lender terms.

      OPEN — prospective range disclosure. Where a client asks what the full ladder might
      total, the agent needs approved language for illustrative ranges that does not
      become an engagement-specific quote. Compliance & Evidence to draft.

      OPEN — Blueprint deliverable promises depend on the Readiness Score components,
      which are specified nowhere. See the correction below.

      NOTED — this entry deliberately owns no lists. It is the framework the Marketing
      Claim Library applies. Adding phrases here would create a second list, and two
      lists drift.

      RAISED BY REVIEW — applying this entry's classification rule to the SEEDED library
      reclassifies two existing claims. Both are currently `requires_disclaimer`, and this
      entry bans their category outright:

      `success rate` -> DISCLOSURE_SUBSTANTIATION. The entry bans success rates
      "regardless of accuracy".

      `typical` -> DISCLOSURE_NOT_TYPICAL. The entry bans timeframe averages, and
      "typical placement in 30 days" is its own example.

      A `requires_disclaimer` claim SHIPS with its disclosure attached; a `banned` one
      does not ship. So the library currently permits, with a disclaimer, two things this
      entry says are never said. One of the two is wrong and it is a decision, not a bug.

      Three further requires_disclaimer claims are arguable and left alone: `up to`, `as
      low as` and `projected` all describe LENDER product terms rather than firm
      performance, which puts them under estimate-not-offer rather than here.

      RAISED BY REVIEW — the Section 6.2 reference does not resolve, and the document it
