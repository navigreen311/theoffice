  - entry_ref: compliance/not-a-credit-repair-organization-v1
    framework: CROA
    jurisdiction: [FEDERAL]
    runtime_flag: croa_perimeter_required

    applicability_rule: >-
      Any discussion of a client's credit — profile, score, tradelines, utilisation,
      negative items, or what a lender wants to see. Applies to deliverables, portal
      messages, calls and internal reasoning that reaches a client.

      THIS IS NOT A COMPLIANCE RULE. Burkham Wickmont is not a Credit Repair
      Organization and does not provide credit repair services, so CROA does not govern
      it. This entry documents the discipline that keeps that true. The risk it
      addresses is recharacterisation — behaving in a way that makes Burkham a CROA
      entity by conduct.

    agent_behavior_implication: >-
      THE LINE: the agent may advise on the client's BUSINESS. It may not advise on the
      client's CREDIT FILE.

      "You have three negative items on your business credit report" — observation.
      Permitted.

      "Those items may not be accurate and you should dispute them" — action on the
      file. Refused.

      "Your score is 620 and this lender wants 680" — observation plus lender fact.
      Permitted.

      "Here is how to get from 620 to 680" — refused at the word 'how'.

      "Apply for Net 30 accounts with Uline, Grainger and Quill" — business operations.
      The client applies, in normal commerce, and a stronger profile follows. Permitted.

      NEVER, whatever the client asks:

      - dispute a tradeline or contact a bureau on the client's behalf

      - send, draft or supply dispute letters, templates or scripts

      - represent that Burkham can remove, delete, fix or repair any item. THIS ONE is
      a Level 4 prohibited action — `promise_credit_repair` — hard-blocked by the
      middleware for every actor at every level

      - promise or imply a specific score outcome

      - charge an upfront fee for anything credit-repair-adjacent

      - contract in terms that would recharacterise Burkham as a CROA entity

      HOW THE OTHER FIVE ARE ENFORCED, because it is not the authority layer. Level 4
      blocks nine named ACTIONS, and "draft a dispute letter" is not one of them — an
      agent doing it would be performing `draft_communication`, which is Level 1 and
      passes. What catches these is the Communication Compliance Scanner at chain step
      7, against the Marketing Claim Library's credit-repair phrases. The rules stand;
      the mechanism is the scanner, and a phrase absent from the library is a rule
      nothing enforces. See trigger 3.

      LANGUAGE: characterise analytically, never remedially. A profile has
      characteristics that limit access to particular products at particular lenders. It
      is not defective, and it does not need repair, fixing or cleaning up.

      THE SOFT EDGES — permitted with framing, and the framing is the rule:

      UTILISATION. The agent may observe that revolving utilisation is 82% across three
      cards, that this affects both cash-flow analysis in underwriting and the credit
      profile, and that paying down before applying would strengthen the application. It
      may not predict a score movement from that action. The specificity of the score
      prediction is what crosses the line, not the suggestion to pay down.

      TIMING. The agent may say that applying now would likely decline and that waiting
      sixty days after paying down would put the client in a stronger position for the
      same product. It may not forecast a score range for that window or frame it as
      timing applications for score benefit.

      EDUCATION. General credit education is permitted — utilisation is one factor in
      scoring models is on every bureau's own website. Tactical advice on arranging
      balances across accounts to move a score is not; that is the informational content
      of a credit repair service.

      REFERRING OUT is permitted and is the correct response to a genuine need —
      inaccurate items, fraudulent inquiries, identity theft. Refer to a consumer
      protection attorney or a CROA-compliant organization.

      TAKE NO FEE FOR THE REFERRAL. Refer freely, take nothing. A fee makes Burkham an
      indirect participant in a service it does not offer.

    escalation_trigger: >-
      1. When the client asks directly for credit repair — remove these items, dispute
      these tradelines, raise my score by X. The agent declines with the approved
      refer-out and logs the request. A logged request is a compliance data point, not
      an incident.

      2. When the client is already engaged with credit repair — currently working with
      an organization, has bulk-disputed inquiries, has taken credit-file action.
      Service continues; human review decides how it affects Readiness Score computation
      and application preparation, because file actions taken by others change how
      current bureau data should be read.

      3. When the Communication Compliance Scanner catches credit-repair-adjacent
      language in the agent's own draft. This is the operational catch for slippage, and
      it is the primary enforcement for five of the six NEVERs above. Thirteen phrases
      are seeded and matching today: "repair your credit", "credit repair services",
      "credit repair program", "erase your bad credit", "improve your credit score",
      "boost your credit score", "raise your credit score", "remove negative items",
      "we can remove negative items", "delete negative items", "dispute negative items",
      "remove late payments", "remove collections". Two phrases named in earlier drafts
      of this entry are NOT seeded and would pass — see notes.

      4. When application preparation would reference a disputed or under-review credit
      item. Handled under compliance/bureau-report-handling-v1.

      5. When the client claims a specific credit promise was made — a score outcome, an
      item removal, a credit-file action. Route immediately to Human Approval Console AND
      the Compliance Review Board. This may be agent output that escaped scanning, a
      partner making unsanctioned claims, or a client misremembering. Every one of those
      needs running down.

      6. When the refer-out is declined and the client keeps asking. Either the need is
      not what was described, or Burkham is being tested, or there is genuine confusion
      about what it does. Compliance & Evidence engages the client directly.

    citation: "15 U.S.C. § 1679 et seq. (CROA); 15 U.S.C. § 1679b (upfront fee prohibition)"

    claim_provenance:
      - claim: "No feature may recharacterize Burkham as a credit repair organization"
        tag: sourced
        source: "specifications-v2 §3.1 design principle 1 / §6.1, the Seek Capital test"
      - claim: "CROA attaches to anyone representing they will improve a credit record"
        tag: sourced
        source: "15 U.S.C. §1679a(3), §1679b(a)"
      - claim: "promise_credit_repair is a Level 4 prohibited action"
        tag: sourced
        source: "packages/core/src/authority.ts PROHIBITED_ACTIONS"
      - claim: "The other five NEVERs are scanner-enforced, not authority-enforced"
        tag: sourced
        source: "PROHIBITED_ACTIONS blocks named actions; drafting a dispute letter is draft_communication at Level 1 and passes"
      - claim: "Advise on the business, never on the credit file"
        tag: reconstructed
        basis: "shaped from CROA's definition of a credit repair organization; the business/file line and the 'refused at the word how' test are the entry's own"
      - claim: "Utilisation and timing may be discussed; score prediction may not"
        tag: proposed
        review_by: "Compliance & Evidence — flagged in the entry as the softest edge and most likely to be crossed by accident"
      - claim: "Refer out freely and take no fee for the referral"
        tag: reconstructed
        basis: "shaped from CROA's indirect-participation concern; no source addresses referral fees for credit repair"
      - claim: "Thirteen CROA phrases are seeded and matching"
        tag: sourced
        source: "packages/claims/src/seed.ts — verified list; 'fix your profile' and 'boost your score' are NOT seeded"

    status: draft_pending_claim_library_approval

    notes: >-
      OPEN — the utilisation boundary. "Pay down before applying" and "optimise
      utilisation for score" are the same suggestion in different words, and the
      difference lives entirely in framing. Village Compliance & Evidence must draft
      approved phrases for discussing utilisation that stay on the business-operations
      side. This is the softest edge in the entry and the most likely to be crossed by
      accident.

      OPEN — the characterisation language in the applicability rule is proposed, not
      sanctioned. Approved phrasing for describing a weak profile without remedial
      framing requires Compliance & Evidence drafting and Compliance Review Board
      approval.

      OPEN — trigger 2 is a conservative read rather than a known industry practice.
      Whether existing credit-repair engagement should change Burkham's workflow is worth
      outside-counsel input eventually. Included because the conservative direction costs
      little.

      RAISED BY REVIEW — two gaps in the claim library, each one word wide. "fix your
      profile" is not seeded; "fix your credit" is. "boost your score" is not seeded;
      "boost your credit score" is. `phrasePattern` bounds the whole phrase, so the
      near-miss does not match and the draft ships. Both are one-line additions to the
      Marketing Claim Library and should go in with the utilisation phrases.

      RAISED BY REVIEW — "Level 4, hard-blocked" held for one of the six NEVERs, not all
      six. `promise_credit_repair` is a prohibited action; the others name conduct rather
      than an action in the catalogue, so the authority layer cannot see them. Corrected
      in the implication above. The rules did not change — only the claim about what
      enforces them, which mattered because it decides whether a missing claim-library
      phrase is a gap or a redundancy. It is a gap.

      RAISED BY REVIEW — the Section 4.9 reference does not resolve. blueprint-v2's 4.x
      flow sections run 4.1 to 4.4 and neither reference document contains a cannabis,
      MCA or debt-settlement cut list, nor a documented refer-out pattern. The PRINCIPLE
      is real and better cited: specifications-v2 §6.1 design principle 1, the Seek
      Capital test — "no module design survives if it recharacterizes Burkham Wickmont as
      a lender, investment advisor, credit repair organization, or debt settlement firm."
      That sentence names credit repair explicitly and is the anchor this entry rests on.
      If a Section 4.9 exists in the marketing plan rather than the blueprint, the note
      should say which document.

  - entry_ref: compliance/estimate-not-offer-v1
    framework: STATE_COMMERCIAL_FINANCING_DISCLOSURE
    jurisdiction: [CA, NY, UT, VA, GA, CT, FL]
    runtime_flag: estimate_not_offer_required

    applicability_rule: >-
      Any client-facing output containing a number about a lender product — APR,
      factor rate, origination fee, monthly payment, repayment burden, total cost of
      capital, or blended stack cost. Chiefly Cost of Capital Calculator output,
      Funding Recommendation Engine output, Suitability Memos, Capital Command Briefs
      and Quarterly Capital Reviews.

      Does NOT apply to Burkham's own service fees — the $497/$997 Blueprint tiers,
      retainers, or success fees. Those are service pricing, not lender product terms.
      FTC Act and the Marketing Claim Library govern them; no lending disclosure regime
      attaches. An agent must not withhold a fee quote under this rule.

    agent_behavior_implication: >-
      Three elements must appear together with any lender-product number. If any one is
      absent, the number does not go out.

      1. HEDGE, in the same sentence as the number — not a footnote. Must contain all
      three of: "estimated at approximately", "not an offer of credit", "actual terms
      will be set by the lender's underwriting".

      2. PROVENANCE, adjacent to the number. Where provenance is issuer_rule, name the
      source and the verification date. Where provenance is unresearched_default, the
      hedge is replaced by the heavier variant, which is the registered disclosure
      "Unresearched default - not verified against the issuer." followed by the
      recorded rationale for the assumption. That exact string is what the scanner
      requires and step 7 matches; a paraphrase satisfies neither.

      3. NOT-THE-LENDER statement, at least once per deliverable containing any number:
      Burkham is not a lender, identifies options and prepares applications, and all
      lending decisions are made by the lender.

      An unresearched_default alone does not suppress the number and does not hold the
      output. Suppression is refused deliberately: an absent number in a comparison
      document is itself a signal, and it pushes clients toward the products Burkham
      knows least about.

      STATE ACTIVATION — this entry cannot enforce in a state until BOTH hold, and
      neither alone is sufficient:

      1. COUNSEL CERTIFICATION. The state's Regulatory Engine module has been
      activated: a named human at Authority Level 3 has recorded a counsel review
      against a document reference, and the reviewed version is the version now in
      force. A module that has been materially republished since its review reads as
      `needs_counsel_review`, not `active`, and that is a refusal.

      2. POPULATED DISCLOSURE VARIANTS. That module carries at least one disclosure
      requirement with real text and a citation. An activated module with an empty
      disclosure set supplies nothing, and the agent would compose the hedge itself —
      which is the state-specific requirement being answered by a generic one.

      Where either is absent the agent does not fall back to the standard hedge and
      does not proceed. It holds the output and routes to Human Approval Console, per
      escalation condition 2. A state Burkham is not activated in is a state Burkham
      does not present financing offers in.

      THE SECOND CONDITION IS NOT ENFORCED TODAY. `activateState` requires the counsel
      document reference and the Level 3 human, and does NOT check that the module has
      any disclosure requirements. TX, AZ and NV have modules with zero disclosures and
      could be activated as they stand. Until that check exists this element is a rule
      an agent follows, not a gate the engine applies — see notes.

    escalation_trigger: >-
      Five conditions. Each halts the output and routes to Human Approval Console.

      1. When the draft would read as an offer rather than an estimate. Detected on the
      Marketing Claim Library's banned phrases — "pre-approved", "you will be
      approved", "get you approved", "guaranteed approval", "guaranteed funding",
      "instant approval" — which block at middleware step 7 rather than escalating.

      2. When the client's state carries a disclosure requirement the standard hedge
      does not satisfy. Output holds pending the state-specific variant.

      3. When provenance is unresearched_default AND the client's Risk Rating is High
      or above AND the product is in a higher-cost category. Any one alone ships; the
      combination does not.

      4. When Calculator output materially disagrees with Lender Intelligence Database
      history for that lender. A data-quality signal, surfaced with the underlying data.

      5. When a lender-product number is detected and the required disclosure is present
      in the deliverable but not in the same sentence as the number. Step 7's check is
      an exact substring match over the whole document and a footnote satisfies it; this
      condition is what catches the case the machinery cannot. See notes.

    citation: >-
      CA Fin. Code § 22800 et seq. (SB 1235); NY Fin. Serv. Law art. 8; UT Code 7-27;
      VA Code 6.2-2200; GA SB 90; CT PA 23-201; FL Stat. 559.9611

    # Read against the Regulatory Engine on 2026-08-31. `satisfied_for` is empty
    # because ALL SEVEN seeded state modules ship as drafts and none has been
    # activated — the seeding function deliberately has no way to activate one.
    #
    # Three of the seven states this entry binds have no module at all, not even a
    # draft, so they cannot be satisfied by review alone: someone has to write them.
    depends_on:
      - kind: state_activation
        description: >-
          Counsel certification AND at least one populated disclosure requirement, per
          state. Both required; neither alone activates.
        required_for: [CA, NY, UT, VA, GA, CT, FL]
        satisfied_for: []
        blocking: true
      - kind: state_module_exists
        description: >-
          A Regulatory Engine module must exist for the state before it can be
          reviewed at all. VA, GA and CT have none — they are outside the V1 priority
          seven, which are NV, CA, NY, TX, FL, AZ, UT.
        required_for: [VA, GA, CT]
        satisfied_for: []
        blocking: true

    # `status`, `notes` and `depends_on` are AUTHORING-FILE fields. They are never
    # POSTed — see the note at the top of this file — and the checker refuses any entry
    # whose status is not `approved` or whose dependencies are unmet, so an open
    # question keeps the entry out of the database rather than travelling into it as a
    # silent draft.
    claim_provenance:
      - claim: "State commercial financing disclosure regimes apply in seven states"
        tag: sourced
        source: "specifications-v2 §6.3: 'CA SB 1235 + Oct 2023 UDAAP, NY commercial financing disclosure + AG MCA enforcement, UT / VA / GA / CT / FL disclosure regimes'"
      - claim: "Burkham's own service fees are out of scope"
        tag: sourced
        source: "specifications-v2 §6.3 lists lending regimes only; service pricing sits under FTC Act per own-claims-and-pricing-v1"
      - claim: "Three elements must appear together with any lender-product number"
        tag: proposed
        review_by: "Compliance & Evidence and both founders — the three hedge phrases are proposed, not sanctioned"
      - claim: "The hedge must be in the same sentence as the number, not a footnote"
        tag: reconstructed
        basis: "shaped from Reg Z trigger-term proximity practice; NOT enforceable — step 7's check is content.includes over the whole document"
      - claim: "unresearched_default requires the heavier variant naming it as an assumption"
        tag: sourced
        source: "packages/core/src/provenance.ts describeProvenance; lenders/profile.ts throws without a rationale"
      - claim: "Suppression of a number is refused deliberately"
        tag: reconstructed
        basis: "shaped from Decision D's provenance discipline; the reasoning about comparison documents is the entry's own"
      - claim: "A state needs counsel certification AND populated disclosures before this can enforce"
        tag: proposed
        review_by: "counsel at state activation — the second condition is NOT enforced: activateState does not inspect disclosures, and TX, AZ, NV have modules with zero"

    status: draft_pending_claim_library_approval
    notes: >-
      The three hedge phrases are proposed, not sanctioned. They require Village
      Compliance & Evidence drafting and Compliance Review Board approval before
      becoming approved Marketing Claim Library phrases. Until then the
      disclosure the scanner actually requires is DISCLOSURE_ESTIMATE, whose text is
      fixed and whose match at step 7 is exact — a paraphrase will not satisfy it.

      RESOLVED — what unresearched_default derives from. It derives from nothing
      computed. `typicalAnnualRate` and `typicalFactorRate` are columns on an offering
      row, supplied by whoever called `addOffering`, alongside a provenance tag the same
      caller chose. There is no market data, no category average, and no derivation of
      any kind. An `unresearched_default` is one number a person entered plus one
      sentence saying why, and `lenders/profile.ts` throws if that sentence is missing:
      "An assumption nobody can explain cannot be argued with or revisited."

      So "based on general market data" would have been a false statement in a client
      disclosure — the disclosure written to prevent a misrepresentation would have been
      making one. Element 2 says what is true instead.

      RESOLVED — which string the heavier variant is. It is
      `DISCLOSURE_UNRESEARCHED_DEFAULT` in `@bwc/core`, "Unresearched default - not
      verified against the issuer.", and it is not a new sentence: `describeProvenance`
      is now built FROM that constant rather than repeating it, so the registered
      disclosure and the rendered text share one source and cannot drift. The scanner
      requires it whenever a lender-product number is detected AND the caller reports
      that the figure rests on an unresearched default.

      It is the invariant PREFIX rather than the whole rendered sentence, because the
      rendered sentence interpolates the per-offering rationale and step 7's check is an
      exact substring match against a fixed string. A varying sentence registered as the
      disclosure would match nothing, every time, silently.

      READ 2026-08-31 — what the Regulatory Engine actually holds. It holds real
      per-state disclosure TEXT, not merely the concept of variants:
      `DisclosureRequirement` carries a key, the text itself, the citation that obliges
      it, and an optional productKind. State modules are versioned, every publish
      declares `material` or `editorial`, and a material republish returns an activated
      state to `needs_counsel_review` rather than leaving it active.

      Populated, of the seven V1 priority states (NV, CA, NY, TX, FL, AZ, UT):

      CA 2 — commercial financing disclosure, broker compensation.
      NY 2 — commercial financing disclosure, MCA conduct.
      FL 2 — commercial financing disclosure, broker conduct.
      UT 1 — commercial financing disclosure.
      TX 0. AZ 0. NV 0 — modules exist and oblige nothing.

      ALL SEVEN ARE DRAFTS. None is activated, and the seed says so plainly: "a
      scaffold for counsel, not legal advice", shipping unusable until a named Level 3
      human records a review. So this entry can enforce in no state today.

      THE SET MISMATCH, which matters more than the counts. This entry binds CA, NY,
      UT, VA, GA, CT, FL. The Regulatory Engine's V1 priority is NV, CA, NY, TX, FL,
      AZ, UT. The overlap is four. VA, GA and CT have no module at all; NV, TX and AZ
      have modules with no disclosure text. Whether that is a gap in the engine or an
      over-broad jurisdiction list on this entry is a decision — the disclosure regimes
      in VA, GA and CT are real, so the likelier answer is that the engine's priority
      list was drawn from where Burkham operates rather than from where the disclosure
      obligation attaches.

      RAISED BY REVIEW — the second activation condition is not enforced. `activateState`
      requires a non-empty document reference, a non-empty reviewer, and a human actor
      at Level 3 or above. It does NOT inspect the module's disclosure requirements. TX,
      AZ and NV could be activated today with zero disclosures: counsel reviews a module
      that obliges nothing, the review is recorded, `permitsClientFacingAction` becomes
      true, and the engine supplies an empty disclosure set to an agent that believes it
      received the state-specific variant. That is a control passing on absence, and the
      fix belongs in `activation.ts` rather than here.

      Nothing else remains open. Ready for Village Compliance & Evidence drafting of the
      three hedge phrases and Compliance Review Board approval.

