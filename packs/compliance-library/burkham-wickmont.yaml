  # WRITTEN BY IVAN. The Pack gained an FTC_TSR row; it declared none.
  # `jurisdiction` corrected to a list.
  #
  # NOT a contradiction with Greenstone, though it looks like the Nevada case.
  # `compliance/ftc-tsr-v2` is live in the Office library under flag
  # `tsr_disclosure_required` — "state identity, the company, and the purpose of the
  # call before anything else" — because Greenstone DOES cold-call property owners
  # and complies with TSR. This entry stays OUTSIDE TSR instead. Two ventures, one
  # statute, opposite postures, separate refs and separate flags. The portfolio
