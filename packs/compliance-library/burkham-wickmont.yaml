  - entry_ref: compliance/card-product-characterisation-v1
    framework: CARD_NETWORK_RULES
    jurisdiction: [FEDERAL]
    runtime_flag: card_product_discipline_required

    applicability_rule: >-
      Any discussion, deliverable, or placement work involving business credit card
      products — a single card or a coordinated stack. Covers how the product is named,
      what is disclosed before a stack is authorised, and what is said about the effect
      on the client's credit.

      NOT A STATUTE. Visa and Mastercard operating rules govern the issuers, who pass
      requirements down to Burkham as a referral partner. Enforcement is relational: an
      issuer that finds its product mischaracterised terminates the relationship, which
      removes Burkham's ability to place that card at all. The deceptive-practices
      exposure underneath is real and statutory — see
      compliance/own-claims-and-pricing-v1 and compliance/application-truthfulness-v1 —
      but this entry's own teeth are contractual.

    agent_behavior_implication: >-
      NEVER CALLED:

      - a loan, business loan, or small business loan. Cards are revolving credit, not
      term debt. This is the specific consumer harm named in the Seek Capital
      enforcement — clients believed they were getting business loans and received
      credit cards with debt structures they did not expect. `mislabel_card_as_loan` is
      a Level 4 prohibited ACTION, which the middleware refuses for every actor; the
      WORDS are caught by the Marketing Claim Library, and only three compounds are
      seeded today. See notes.

      - a line of credit or LOC. A business LOC is a distinct product Burkham places
      separately, with different terms, underwriting and disclosures. Conflating them
      misrepresents both. NOT bannable as a bare phrase — Burkham discusses real LOCs —
      so this one is a discipline the scanner cannot carry.

      - funding, working capital, cash, capital in your bank account, or money in your
      business, WHERE THE FRAMING IMPLIES RECEIVED CAPITAL. An unused credit limit is
      available capital, not capital in hand. The qualifier is the rule: these words
      are not wrong in themselves, and "working capital" is a purpose a client states
      on an application.

      - a package or facility. Both imply one integrated product with unified terms. A
      stack is several distinct products with several issuers.

      - "no interest" or "0% APR" without the intro period bounded.

      CORRECT: business credit cards · business credit card products · card stack ·
      credit card portfolio · available business credit.

      THE STACK IS NOT A PRODUCT. It is Burkham's characterisation of coordinated
      placement work. The client holds a set of cards; each has its own issuer, terms,
      limit and repayment obligation.

      BEFORE A STACK IS AUTHORISED, all of the following are disclosed:

      - these are business credit cards, not loans

      - personal guarantees are required; the client is personally liable

      - the planned number of applications, their timing, and the specific issuers and
      card products

      - the expected number of hard inquiries on PERSONAL credit

      - the expected temporary personal score impact and recovery window

      - which cards report to personal bureaus and which to business bureaus only. Most
      business cards report to business bureaus; some issuers do not

      - approval is not guaranteed for any individual card. The strategy applies to more
      cards than the client needs, expecting declines

      - interest accrues on unpaid balances at the published APR

      - Burkham's own success fees per card placed

      RATE-SHOPPING LOGIC DOES NOT APPLY TO CARDS. FICO and VantageScore merge multiple
      hard inquiries inside a 14-45 day window into one for autos, mortgages and student
      loans. Credit cards are excluded. Five card applications are five inquiries. An
      agent must never suggest that clustering reduces the impact.

      "WILL NOT AFFECT YOUR CREDIT" is banned because it is false. A stack affects credit
      through the inquiries and through the guarantees created.

      TWO AUTHORISATIONS, NOT ONE. The coordinated strategy is authorised once at the
      outset, with the disclosures above. Each individual card application then carries
      its own written authorisation at submission under
      compliance/application-truthfulness-v1.

    escalation_trigger: >-
      1. When banned terminology appears in draft output. The Scanner refuses the send;
      the agent redrafts or a human reviews.

      2. When the client asks to skip the strategy authorisation — "just start applying,
      I trust you". The agent refuses and explains why. This protects the client and
      protects Burkham from a later claim of not understanding.

      3. When the client's personal credit profile will not sustain the planned inquiries
      without material harm, or bureau data indicates declines are highly likely. Route
      to Funding Strategy to recalibrate the stack.

      4. When field evidence suggests an issuer velocity rule has changed and the Issuer
      Rules Engine still shows the old one. Escalate to the Capital Product Governance
      Board before submitting further applications against a stale rule.

      5. When the client requests a card or issuer Burkham has cut from scope. Decline
      with explanation; refer out where the need is legitimate.

      6. When the client's own words indicate they misunderstand the personal guarantee.
      "So if the business defaults, the business is on the hook, right?" — stop the
      workflow and route to a human for direct education. Do not place while the client's
      understanding of their personal liability is materially wrong.

      7. When execution would produce more inquiries than the strategy authorisation
      disclosed — declines requiring more attempts, timing extending. Stop and
      re-authorise the revised strategy. Never silently expand beyond authorised scope.

      8. When any issuer communication touches characterisation — a terminated
      relationship, a requested change to how their product is described, any compliance
      contact. Route immediately to both the Compliance Review Board and the Capital
      Product Governance Board. Issuer relationships are the enforcement mechanism here
      and they require active tending.

    citation: "Visa Core Rules; Mastercard Rules; issuer referral agreements; 15 U.S.C. § 45"

    depends_on:
      - kind: claim_library_phrases
        description: >-
          The card-as-loan compounds must be seeded before the Scanner can enforce the
          NEVER CALLED list. Three are: "our loan to you", "credit card loan", "card
          loan". The two that name the Seek Capital harm are not.
        required_for: ["business loan", "small business loan"]
        satisfied_for: []
        blocking: true
      - kind: card_bureau_reporting_data
        description: >-
          The pre-authorisation disclosure "which cards report to personal bureaus and
          which to business bureaus only" requires per-card-product bureau reporting.
          No such field exists in either the Console or CapitalForge, so an agent has
          no source for a disclosure this entry requires it to make.
        required_for: [per_card_bureau_reporting_field]
        satisfied_for: []
        blocking: true
      - kind: inquiry_count_tracking
        description: >-
          Trigger 7 compares executed hard inquiries against the number the strategy
          authorisation disclosed. Nothing counts inquiries anywhere.
        required_for: [executed_inquiry_count]
        satisfied_for: []
        blocking: true

    claim_provenance:
      - claim: "Card products must not be called loans"
        tag: sourced
        source: "packages/core/src/authority.ts PROHIBITED_ACTIONS includes mislabel_card_as_loan; specifications-v2 §6.3 Visa/Mastercard lawful-use language"
      - claim: "Visa and Mastercard rules reach Burkham through issuer referral agreements"
        tag: sourced
        source: "specifications-v2 §6.3: 'Visa / Mastercard rules — lawful-use language, cash-advance fee disclosure, AML / sanctions'"
      - claim: "Enforcement is relational rather than statutory"
        tag: reconstructed
        basis: "shaped from the referral-partner structure; no source describes the enforcement mechanism"
      - claim: "Eight of the NEVER CALLED terms are unenforced by the Scanner"
        tag: sourced
        source: "packages/claims/src/seed.ts — only 'our loan to you', 'credit card loan', 'card loan' are seeded"
      - claim: "Rate-shopping inquiry consolidation excludes credit cards"
        tag: sourced
        source: "FICO and VantageScore published methodology; the 14-45 day window applies to auto, mortgage and student loans"
      - claim: "Ten disclosures are required before a stack is authorised"
        tag: proposed
        review_by: "Compliance & Evidence — the strategy authorisation document is not drafted, and two of the ten have no data behind them"
      - claim: "Two authorisations, not one — strategy then per application"
        tag: reconstructed
        basis: "shaped from the per-application authorization requirement in §6.3 extended to the coordinated strategy; the two-level structure is the entry's own"
      - claim: "Personal guarantees are modelled per position"
        tag: sourced
        source: "packages/capital/src/positions.ts personalGuarantee; health.ts reasons over it"

    status: draft_pending_claim_library_approval

    notes: >-
      OPEN — trigger 3's threshold. "Material harm to personal credit" needs a definition
      Compliance & Evidence can apply: a score-impact range, an inquiry count, a profile
      pattern, or some combination. The principle is clear and the operational threshold
      is not.

      OPEN — the strategy authorisation document structure. A signed acknowledgment
      carrying the disclosures above, presented before Placement Program engagement,
      copied to the Compliance Evidence Vault. Compliance & Evidence to draft.

      OPEN — where "funding" is acceptable. The word is not per se wrong and the industry
      uses it loosely, but it is wrong wherever it implies received capital. Approved
      phrases needed rather than a blanket ban.

      NOTED — the banned terms here overlap with compliance/own-claims-and-pricing-v1.
      That is correct: one Marketing Claim Library serves several frameworks, and a
      phrase banned twice is banned once in the list.

      NOTED — triggers 4 and 7 depend on operational monitoring that does not yet exist.
      Trigger 4 needs field decline patterns feeding back against the Rules Engine;
      trigger 7 needs the executed inquiry count tracked against the authorised one. Both
      are named so the gap is visible rather than assumed closed.

      RAISED BY REVIEW — the NEVER CALLED list is almost entirely unenforced. Seeded and
      matching: "our loan to you", "credit card loan", "card loan". NOT seeded: "business
      loan", "small business loan", "line of credit", "working capital", "package",
      "facility", "money in your business", "cash in your bank". Eight of the terms this
      entry forbids pass the Scanner today.

      And they do not all become bannable by adding them. Three groups:

      SAFE TO BAN — "business loan" and "small business loan" as bounded phrases. These
      are the Seek Capital harm named in this entry's own rationale, they have no
      legitimate use describing a card, and they should go in with the CROA phrases.

      NOT BANNABLE — "line of credit", "working capital", "package", "facility". Each has
      a legitimate use: Burkham places real business LOCs, and "working capital" is a
      stated purpose an agent must enter verbatim on an application under
      compliance/application-truthfulness-v1, which says so explicitly. A blanket ban
      would put two entries in direct conflict.

      NEEDS A DETECTOR, NOT A PHRASE — "cash in your bank account", "money in your
      business". The rule is about the FRAMING implying received capital, and a phrase
      list cannot express a framing. `detectLenderNumbers` is the precedent for the
      shape: a detector in code, gated on nearby context terms.

      RAISED BY REVIEW — `mislabel_card_as_loan` is genuinely Level 4 and hard-blocked,
      which is more than CROA had. But it blocks an ACTION NAME, and no agent performs an
      action called `mislabel_card_as_loan` — it performs `draft_communication` and
      writes the word. The Level 4 entry states the prohibition; the Scanner is what
      catches it, and for eight of these terms the Scanner has nothing to match.

      RAISED BY REVIEW — the Issuer Rules Engine trigger 4 names is CapitalForge's, not
      the Console's. `issuer-rules-engine.ts` there holds the real thing, including
      `CROSS_ISSUER_VELOCITY_RULE = 'velocity_max_apps_per_period'` and Chase 5/24. The
      Console has only two comments mentioning velocity policy and no engine. So this
      trigger fires across the Office-to-CapitalForge bridge, which does not exist yet —
      capitalforge is not in `forge_registry` and V2 fails on it.

      RAISED BY REVIEW — personal guarantees ARE modelled. `packages/capital/positions.ts`
      carries `personalGuarantee` per position and `health.ts` reasons over it, so the
      disclosure and trigger 6 have a data model behind them. That is the one item in the
      pre-authorisation list that does.

  # =========================================================================
  # WRITTEN BY IVAN. `TAX_ADVICE_SCOPE` added to the schema enum — it is not a
  # statute, and the enum already carries obligation surfaces that are not statutes
  # (TWO_PARTY_CONSENT_RECORDING, VOICE_CLONING_CONSENT), so it fits the pattern.
  #
  # THE FIRST ENTRY THAT REMOVES SOMETHING. It replaces a would-be IRC §163(j) entry
  # on the grounds that §163(j) tells an agent nothing it would not otherwise do.
  # That is the deletion test applied one level up — to what belongs in the library
  # at all, rather than to a field inside an entry — and it is the right instinct.
  # A library organised by statute grows an entry per citation and teaches nothing;
  # one organised by discipline grows an entry per behaviour.
  #
  # `jurisdiction` corrected to a list — seventh time.
  # =========================================================================
  - entry_ref: compliance/tax-advice-boundary-v1
    framework: TAX_ADVICE_SCOPE
    jurisdiction: [FEDERAL]
    runtime_flag: tax_advice_boundary_required

    applicability_rule: >-
      Any client interaction touching tax treatment — deductibility, entity elections,
      depreciation, taxable events, state nexus, or anything else in the tax code.
      Applies to conversation, deliverables, and CFO Advisory output.

      THIS ENTRY IS NOT ABOUT A STATUTE. IRC §163(j) does not appear here because
      §163(j) tells an agent nothing it would not otherwise do — the deletion test
      removes it. It appears as one example among many of where the boundary applies,
      alongside §162, §168, §199A and every state provision.

      The entry's subject is the boundary itself: Burkham Wickmont does not provide tax
      advice. Tax advice as principal is cut from V1 scope, and unauthorised practice is
      enforced by some states directly.

    agent_behavior_implication: >-
      THE LINE: an agent prepares information a CPA uses. It does not reach a tax
      conclusion, and it does not present one as Burkham's.

      CFO Advisory produces coordination packets for the client's CPA, not tax analysis.
      No tax documents are generated. CapitalForge's tax DOCUMENT endpoints refuse
      explicitly — listing, downloading, summarising and generating a tax document all
      return one shared refusal — and that refusal is the design, not a gap. Its §163(j)
      report endpoint is a different case and is live; see notes.

      NEVER SAID:

      - "this interest will be deductible"

      - "you can write this off"

      - "this triggers §X treatment"

      - "this is a taxable event"

      - any statement placing a tax position as settled

      Giving tax advice is Level 4. The prohibited action is
      `give_legal_or_tax_advice_without_professional_review`, and its name carries a
      qualifier this entry does not: it forbids advice given WITHOUT professional
      review, which implies a review path. In V1 there is none — tax advice as principal
      is out of scope — so the boundary here is the stricter one and the action name is
      the looser. See notes.

      SAID INSTEAD: "your CPA will assess deductibility of this interest expense under
      applicable rules." The reframing is consistent — the agent describes what a CPA
      will evaluate, never what the answer is.

      REFER OUT to the client's CPA. This is the correct answer to a tax question, not
      an evasion of one. Same shape as the credit repair refer-out in
      compliance/not-a-credit-repair-organization-v1: a service Burkham does not
      provide, a client pointed at the right provider.

      NOTHING GOES TO A TAXING AUTHORITY. Deliverables reach the client's CPA, who
      prepares and submits filings. Burkham submits nothing to the IRS or any state
      authority. Bright line.

    escalation_trigger: >-
      1. When the client asks for a tax opinion — can I deduct this, how should I
      structure this, will this be taxable. The agent declines with the approved
      refer-out, and the request is logged.

      2. When draft output states a tax position as fact. The Scanner catches it; the
      agent rewrites to coordination language or removes the passage.

      3. When a deliverable would present tax analysis as a Burkham conclusion. CFO
      Advisory output routes through Deliverable Approval Workflow with tax content as a
      named checkpoint — coordination content passes, advice content does not.

      4. When the client references specific tax advice Burkham allegedly gave. Human
      Approval Console AND Compliance Review Board. Either output escaped scanning, a
      partner made an unsanctioned claim, or the client misremembers.

      5. When the client intends to take a tax position on Burkham's analysis rather than
      their CPA's — "I don't need to run this by my CPA, you already told me it's
      deductible." Stop. Route to a human for direct clarification and log it. Either
      advice was given that should not have been, or the client misunderstands Burkham's
      role, and both need correcting before anything proceeds.

      6. When a deliverable is being packaged for direct submission to a taxing
      authority. Human review. Burkham does not submit tax documents.

    citation: "IRC § 163(j) and § 162 as examples only; Circular 230; state unauthorised-practice statutes"

    depends_on:
      - kind: deliverable_tax_checkpoint
        description: >-
          Trigger 3 requires tax content to be a NAMED checkpoint in the Deliverable
          Approval Workflow. The workflow exists and has a human approval gate; a
          tax-specific checkpoint within it does not.
        required_for: [named_tax_checkpoint_in_3_4]
        satisfied_for: []
        blocking: true

    claim_provenance:
      - claim: "Burkham does not provide tax advice; it is cut from V1 scope"
        tag: sourced
        source: "specifications-v2 §3.1 design principle 1 — no feature may recharacterize as investment advisor; V1 scope excludes tax advice as principal"
      - claim: "Giving tax advice without professional review is Level 4"
        tag: sourced
        source: "packages/core/src/authority.ts — give_legal_or_tax_advice_without_professional_review"
      - claim: "The qualifier implies a review path V1 does not have"
        tag: sourced
        source: "the action name's suffix versus the entry's own scope statement; both read directly"
      - claim: "CapitalForge's tax DOCUMENT endpoints refuse"
        tag: sourced
        source: "capitalforge src/backend/api/routes/tax.routes.ts — four routes share one refuse() helper"
      - claim: "The §163(j) report endpoint is live and returns planning notes"
        tag: sourced
        source: "capitalforge tax-reports.routes.ts GET /api/businesses/:id/tax/163j-report; services/irc163j.ts computes the limitation"
      - claim: "An agent prepares information a CPA uses and reaches no tax conclusion"
        tag: reconstructed
        basis: "shaped from the scope exclusion; the prepare-versus-conclude line and the SAID INSTEAD reframe are the entry's own"
      - claim: "Nothing goes to a taxing authority"
        tag: reconstructed
        basis: "shaped from the same exclusion; no source states it as a bright line"
      - claim: "The library is organised by discipline, not by statute"
        tag: sourced
        source: "Founder decision, 31 August 2026, ratifying the STRUCTURAL note in this entry. Governs how every subsequent entry is written: a new statute is folded into the discipline it constrains unless it constrains a discipline no entry covers."

    status: draft_pending_claim_library_approval

    notes: >-
      STRUCTURAL AND RATIFIED, founder decision 31 August 2026. The organising principle
      is settled and now governs authoring: a new statute does NOT get an entry because it
      is a new statute. It gets one only if it constrains an agent behaviour no existing
      entry reaches. Otherwise it is folded into the discipline it belongs to, and the
      citation is added there.

      This entry is the worked example. It replaces what would have been an IRC §163(j)
      entry. That
      draft failed the deletion test: "agents should be aware of §163(j) limitations"
      changes no agent behaviour, since tax advice is already Level 4 blocked and CFO
      Advisory output already routes through Deliverable Approval Workflow. It was
      reference material with the right fields filled in — the same shape as the
      "Documented." instruction stub.

      The compliance library is organised by agent behaviour discipline, not by statute.
      A statute earns an entry when an agent must do something specific because of it.
      Otherwise it is an example of a broader discipline, and this is that discipline.

      OPEN — approved phrasing for coordination content versus advice content. The
      general reframe is clear; the specific language across many interaction types needs
      Compliance & Evidence drafting and Marketing Claim Library approval.

      OPEN — unauthorised practice of tax advice varies by state and some enforce
      actively. Whether any priority state carries a requirement beyond the general
      boundary should be part of state activation counsel review, alongside the
      disclosure variants in compliance/estimate-not-offer-v1.

      NOTED — §163(j) itself belongs in the CFO Advisory playbook as reference material,
      not here. Moving it out of the library is the point of this entry.

      RAISED BY REVIEW — the refusal claim is right about documents and incomplete about
      reports. `src/backend/api/routes/tax.routes.ts` refuses all four document
      operations through a single shared `refuse()` helper, written so "the four cannot
      drift apart" — exactly as this entry says.

      But `tax-reports.routes.ts` is live, and one of its routes is
      `GET /api/businesses/:id/tax/163j-report`, which "generates an IRC §163(j) business
      interest deductibility report … returns the full computation with planning notes,
      disclaimer, and alert flags." `services/irc163j.ts` implements the limitation:
      business interest income, floor plan financing, 30% of ATI, indefinite carryforward.

      So §163(j) is not reference material anywhere — it is a working computation that
      returns a number. A report that computes deductible interest and attaches PLANNING
      NOTES sits on the far side of the line this entry draws at "never say this interest
      will be deductible", and a disclaimer does not move it back. The other two live
      routes are cleaner: year-end-summary and the accountant-ready export are
      coordination packets, which is exactly the model this entry describes.

      The question for Compliance & Evidence is narrow: does the §163(j) report reach a
      client, or only their CPA? If it reaches a client it needs the same treatment as a
      deliverable and the planning notes need re-framing. If it is CPA-only it is a
      coordination packet and belongs with the export.

      RAISED BY REVIEW — the Level 4 action is
      `give_legal_or_tax_advice_without_professional_review`. Its qualifier describes an
      escape hatch V1 does not have. Either the action should lose the suffix, or this
      entry should say what professional review would consist of. Leaving both as they
      are means the perimeter and the entry disagree about whether a review path exists.

      RAISED BY REVIEW — CFO Advisory is a Village DEPARTMENT (blueprint-v2 Appendix B,
      the department-to-module ownership map: Phase
      4 workflows, Cost of Capital Calculator, Debt Service Capacity Score, Capital
      Policy Manual generation), not a Console module. It is also not one of the Village's
      twelve real departments, so it carries the same mapping problem as Burkham's other
      department names — see the Pack's positions_required.

