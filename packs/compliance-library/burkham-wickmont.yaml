  # WRITTEN BY IVAN. The Pack gained a TWO_PARTY_CONSENT_RECORDING row; it declared
  # none. `depends_on` kept in the plain-string form as written — the checker now
  # accepts it, because forcing the structured mapping on "this capability does not
  # exist" is ceremony and a field that is awkward to write is a field left out.
  #
