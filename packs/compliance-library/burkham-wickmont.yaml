  # =========================================================================
  # WRITTEN BY IVAN. Same split shape as FCRA: authorization is one flag, conduct is
  # another, and a compliance_surface row carries one flag each — so the Pack has two
  # rows for this framework too.
  #
  # `framework` adopted as written: the enum value was renamed
  # FALSE_STATEMENTS_CREDIT_APPLICATION -> FALSE_STATEMENT_TO_LENDER. Nothing is
  # provisioned yet, so a rename is free now and a schema change later. The name is
  # also the better one: the exposure is a false statement TO A LENDER, whether it
  # rides on an application form or a lender packet.
  #
  # `jurisdiction` corrected to a list — third time. As a scalar it reads as absent.
  # =========================================================================
  - entry_ref: compliance/application-truthfulness-v1
    framework: FALSE_STATEMENT_TO_LENDER
    jurisdiction: [FEDERAL]
    runtime_flag: application_truthfulness_required

    applicability_rule: >-
      Any preparation, population or staging of a lender application. Fires from the
      first field populated, not at submission — the exposure is in what goes onto the
      form, and by the time a submission is staged the false statement already exists.

      Applies to every field regardless of source: client-stated, Plaid-derived,
      bureau-derived, or extracted from a client-uploaded document.

    agent_behavior_implication: >-
      NO AGENT SUBMITS. Preparation is Authority Level 1; submission is Level 3 and a
      human presses the button.

      Half of that is enforced today and half is not, and the entry says which. The
      middleware DOES refuse a Level 1 agent attempting to submit: `submit_application`
      is Level 3 in the action catalogue and step 3 of the chain compares the actor's
      level against it. The human at the button is NOT enforced — Level 3 is a level an
      agent can hold, and the chain has no human-actor step, so a Level 3 agent passes
      it. The rule stands as written; see the note below for the one-line gap.

      NEVER ENTERED, whatever the source:

      - a figure the client has not authorised for this specific application

      - a characterisation the client has not confirmed. If the client said "working
      capital", the agent enters working capital — not "inventory purchase", however
      clearly the Plaid data suggests it

      - any signature or attestation on the client's behalf. This one IS hard-blocked:
      `sign_for_client` is a Level 4 prohibited action and the middleware refuses it
      for every actor at every level

      - any answer misrepresenting the business's nature, industry or structure

      WHEN SOURCES DISAGREE — the agent surfaces the conflict; it does not pick a
      winner. Client says $500K trailing revenue, Plaid shows $340K, the bureau shows a
      third figure:

      - leave the field unpopulated

      - display all values with their provenance

      - route to the client with the specific question and ask for the figure and the
      context for the differences

      - the client's answer is what goes on the form

      - log the conflict, the resolution and the client's context to the Compliance
      Evidence Vault

      Silently taking the client's number while holding data that contradicts it is the
      exposure. The client's authorisation does not insulate Burkham from having
      knowingly used data it had reason to question.

      NO ESTIMATES ON APPLICATIONS. Where no verified source supplies a value, the agent
      requests it from the client, leaves the field blank where the form permits, or
      routes to human review. Never a reasonable estimate, never based on similar
      businesses, never a conservative figure to be safe. An estimated field is a false
      statement waiting to be produced.

      This is the one place the estimate rule inverts. Cost of Capital Calculator output
      is estimated by design and governed by compliance/estimate-not-offer-v1 —
      client-facing education. It never appears on a lender application.

    escalation_trigger: >-
      Seven. The first six are mechanical; the seventh is judgement and is caught by the
      Level 3 human, not by the agent.

      1. When the draft would contain never-entered data. Refuse to stage; route to
      Compliance & Evidence, not merely to submission approval.

      2. When a source conflict is unresolved — the client has not responded, has given
      a materially incompatible answer, or has given one no source can verify.

      3. When synthetic-document detection is positive. Nothing built on a flagged
      document proceeds. Using a tampered client document to prepare an application
      creates the exact reason-to-know exposure §1014 punishes. NOT BUILT — see notes.

      4. When the compliance categorical state moves to Needs Review or Fail during
      preparation. Placement freezes.

      5. When authorisation is withdrawn after capture and before submission.

      6. When the provider's Capital Product Governance Board standing is anything other
      than `approved` — `under_review`, `suspended` or `blacklisted` — or when its
      approval has gone stale past its review cadence, which stops being usable rather
      than continuing to count. Applies even where the application content is clean.

      7. When the aggregate would mislead although every field is individually
      defensible. Technically complete answers that selectively omit what a lender would
      consider material. Stated as a discipline principle: the agent's duty is to
      surface everything transparently; the human's duty at Level 3 is to judge whether
      the whole is defensible.

    citation: "18 U.S.C. § 1014; 18 U.S.C. § 1344"

    claim_provenance:
