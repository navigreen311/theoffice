  # =========================================================================
  - entry_ref: compliance/outbound-contact-boundary-v1
    framework: FTC_TSR
    jurisdiction: [FEDERAL]
    runtime_flag: outbound_contact_boundary_required

    applicability_rule: >-
      Any Burkham-initiated contact with an individual — phone, email, SMS, any channel.
      Applies to Concierge Desk calls, follow-up on form fills and gated downloads, and
      first contact with a Ring 1 referral.

      A BOUNDARY ENTRY. V1 does not conduct outbound telemarketing. This documents the
      line and the discipline that keeps Burkham outside TSR's reach, not how to comply
      with it.

      Broader than TSR by design. TSR reaches telephone contact; CAN-SPAM reaches email;
      UDAAP reaches any commercial contact. Rather than run three tests, one test governs
      all outbound channels.

    agent_behavior_implication: >-
      NO OUTBOUND CONTACT WITHOUT ALL THREE. An agent checks these before dialling,
      sending or messaging. Any one missing, no contact.

      A — THE RELATIONSHIP EXISTS. One of: an active engagement, or a former client
      inside an 18-month lookback; an affirmative initiating action, documented with
      source attribution — a form submitted, a call requested, a gated asset downloaded
      with contact fields, a webinar registered, a subscription taken; or a Ring 1
      introduction WITH DOCUMENTED CONSENT from the person introduced.

      B — THE CHANNEL IS AUTHORISED. A form supplying a phone number authorises phone. A
      form supplying only email does not. The channel the person gave is the channel
      available.

      C — THE PURPOSE MATCHES THE REASON. A whitepaper downloaded about non-dilutive
      funding authorises follow-up about non-dilutive funding. It does not authorise
      outreach about Stack Management. A Blueprint client may be contacted about their
      Blueprint, not cross-sold a partner's product.

      A REFERRAL IS NOT CONSENT. A Ring 1 partner sending a name does not satisfy Part A.
      The person referred must have known they were being introduced and agreed to it,
      and that agreement must be documented in the referral packet. Without it, Burkham
      does not make contact — the partner is asked to obtain it.

      COLD OUTREACH IS BANNED IN EVERY CHANNEL. A prospect list with no documented
      initiating action fails Part A however warm the list is thought to be. This is
      consistent with the Ring 1 model: Burkham does not grow through cold contact.

      AI-MEDIATED OUTBOUND IS RESTRICTED IN V1. Concierge outbound defaults to
      human-initiated. Not because the law distinguishes — TSR does not care whether a
      human or a system dials — but because AI-mediated contact scales, exercises less
      real-time judgement about whether a particular call is appropriate, and can drift
      in scope without anyone noticing. Deployment requires an authorised scope, a volume
      ceiling, and Compliance Review Board approval.

      DO NOT CALL is TWO checks, not one, and they fail differently. The client's own
      standing instruction is held in the Communications Hub as a preference with legal
      force that nothing overrides — that one is enforced today. The national registry is
      a separate lookup that does not exist here; where a number is registered and the
      existing business relationship does not clearly apply, do not call — email, or wait
      for inbound.

      TIME OF DAY — 8am to 9pm local to the recipient, no exceptions for urgency. This is
      enforced: the Communications Hub computes the window against the recipient's own
      timezone rather than the sender's.

      THE BOUNDARY MOVES ONLY BY DECISION. An agent never approves outbound outside this
      test. Neither does a venture operator. Expanding outbound — a new channel, a new
      prospect category, a higher volume, AI-mediated deployment — is a Compliance Review
      Board decision recorded in the Event Ledger. "Just a few warm calls to the referral
      list" is how this boundary erodes, and it erodes without anyone deciding to cross
      it.

    escalation_trigger: >-
      1. When outbound is about to be initiated without documented evidence for A, B and
      C. Refuse; route for evidence review or collection.

      2. When a Ring 1 referral arrives without consent documentation. No contact. Route
      to Channel Partnerships to obtain it from the partner. A repeated pattern raises a
      `documentation_gap` finding against that partner, which is what adjusts their
      standing.

      3. When the proposed purpose does not match the initiating action's scope. Refuse;
      human review on whether additional consent is needed or the outreach should be
      redirected.

      4. When the recipient indicates they did not expect the contact — "how did you get
      my information", "I never signed up", "take me off your list". End the call, update
      the record, and Compliance & Evidence determines which of three happened: the
      evidence was insufficient, a partner referred without consent, or a system error.

      5. When complaint responses from Concierge outbound exceed a defined rate.
      Compliance Review Board reviews whether the three-part test is being applied
      correctly.

      6. When any expansion of AI-mediated outbound is proposed — channel, category, or
      volume. Compliance Review Board before deployment, never automatic.

      7. When DNC status is unverified before a dial, on either check.

      8. When a dial would fall outside 8am–9pm recipient local time.

    depends_on:
      - Ring 1 consent documentation captured in the Partner & Referrer Portal
      - a consent kind for referral introduction in the Consent & Authorization Center
      - partner training content covering the consent obligation
      - national Do Not Call registry lookup before outbound dial
      - automatic documentation_gap findings when a referral arrives without consent

    citation: "16 C.F.R. Part 310 (TSR); 15 U.S.C. § 7701 et seq. (CAN-SPAM); 15 U.S.C. § 45"

    claim_provenance:
      - claim: "V1 does not conduct outbound telemarketing"
        tag: sourced
        source: "the outbound cut recorded in V1 scope; specifications-v2 §12 phasing"
      - claim: "TSR reaches telephone, CAN-SPAM reaches email, UDAAP reaches any commercial contact"
        tag: sourced
        source: "16 C.F.R. Part 310; 15 U.S.C. §7701 et seq.; 15 U.S.C. §45"
      - claim: "The three-part test — relationship, channel, purpose"
        tag: proposed
        review_by: "outside counsel — the entry states plainly that it is a defensible operational test, not a verified legal one"
      - claim: "A referral is not consent; the referred person must have agreed and it must be documented"
        tag: reconstructed
        basis: "shaped from TSR's established-business-relationship exemption; no industry-standard implementation exists, as the entry notes"
      - claim: "The 18-month lookback for former clients"
        tag: proposed
        review_by: "counsel — follows common TSR safe-harbour practice rather than a verified requirement"
      - claim: "Calls and texts are restricted to 8am-9pm local to the recipient"
        tag: sourced
        source: "packages/comms/src/windows.ts — computed against the recipient's timezone, DST case reasoned in source"
      - claim: "The client's own do-not-call instruction has legal force and nothing overrides it"
        tag: sourced
        source: "packages/comms/src/preferences.ts doNotCall"
      - claim: "Referrals capture no consent and no consent kind exists for one"
        tag: sourced
        source: "packages/partners/src/referrals.ts records attribution and counts only; @bwc/consent has eight kinds, none for referral introduction"

    status: draft_pending_claim_library_approval

    notes: >-
      KNOWN FRICTION — this entry adds a requirement to Burkham's core acquisition
      channel. Ring 1 partners must obtain and document the referred person's consent
      before introducing them, and partners will resist. "I'm just introducing a client,
      this doesn't need paperwork" is the natural reaction and it is exactly why the
      discipline matters.

      RECOMMENDED — hold the discipline and let it filter partners rather than relaxing
      it and absorbing the TSR exposure. A partner who cannot be brought to consistent
      consent documentation is a partner whose referrals carry risk Burkham cannot see.

      OPEN — the consent language itself is novel. Business referrals ordinarily happen
      through informal introduction with no documented consent, so there is no
      industry-standard implementation to copy. Compliance & Evidence with outside
      counsel to develop language that works legally and does not make the introduction
      unnatural.

      OPEN — whether the three-part test is legally sufficient to stay outside TSR
      jurisdiction. It is a defensible operational test, not a verified legal one.
      Counsel review before locking.

      OPEN — the complaint rate threshold in trigger 5. Needs operational data. Start
      conservative and relax as evidence accumulates.

      OPEN — the 18-month lookback for former clients follows common TSR safe-harbour
      practice rather than a verified requirement. Confirm at counsel review.

      RAISED BY REVIEW — the dependency list was longer than it needed to be. Three of
      the original six are built or nearly built, and the list has been narrowed to what
      is actually missing.

      BUILT — time of day. `packages/comms/src/windows.ts` restricts calls and texts to
      8am-9pm LOCAL TO THE RECIPIENT and computes it against the recipient's timezone
      rather than the sender's, with the daylight-saving case reasoned through in the
      source: a fixed offset would be "quietly wrong for half the year, and the wrong
      half is the one where an 8am send" lands too early. Trigger 8 has an enforcer. The
      entry now says so rather than asking for it.

      BUILT — the client's own do-not-call instruction. `comms/preferences.ts` carries
      `doNotCall` as "a standing instruction with legal force. Nothing overrides it",
      distinguished in the source from a mere channel preference an urgent alert may
      override. What is NOT built is the national registry lookup, which is a different
      check with a different failure mode, so DNC is now stated as two checks.

      MOSTLY BUILT — Partner Risk Score. `packages/partners/src/risk.ts` has standings,
      severities, thresholds, a ten-referral minimum before a rate is computed, and a
      `FindingKind` list that already includes `documentation_gap` — the exact kind a
      missing referral consent should raise. The score does not need building; the
      automatic finding does, and that is the dependency now recorded.

      PARTLY BUILT — partner training. `partners/curriculum.ts`, `tracks.ts` and
      `certification.ts` exist, so the machinery is there and only the content is
      missing. Narrowed to content.

      NOT BUILT, and the core gap. `packages/partners/src/referrals.ts` records
      attribution and counts — total, converted, lost, open — and captures NO CONSENT
      from the person referred. There is also no consent KIND for it: the Consent &
      Authorization Center has eight, and a referral introduction is not among them.

      That second one matters more than it looks. `@bwc/consent` refuses a consent with
      an empty scope, on the reasoning that an unscoped consent is a blanket consent by
      accident — which is precisely the discipline this entry wants for referrals. The
      right home for Ring 1 consent is a ninth kind in that store, not a field on a
      referral row, because the store already enforces scope, expiry and revocation
      propagation and a bare boolean on a referral would enforce none of them.

