    status: draft_pending_claim_library_approval

    notes: >-
      OPEN — approval authority is unspecified. "Human approval required at Level 3" is
      locked; which human is not. Any Compliance & Evidence member for standard
      applications, founders for edge cases under Gardner's escalation thresholds, is a
      reasonable read but has not been decided. Needs an approval-authority matrix from
      Village Compliance & Evidence and a founder decision.

      OPEN — in-flight work when compliance state changes. Trigger 4 freezes placement;
      it does not say what becomes of preparation already done. Discard, preserve for
      resumption, or time-box before requiring rebuild. Not blocking for this entry, but
      it will matter operationally.

      NOTED — trigger 7 resists mechanical enforcement by design. It is named here so
      the discipline is on the record and so the Level 3 reviewer knows it is theirs to
      apply. An entry that only listed the six testable triggers would imply the seventh
      does not exist.

      RAISED BY REVIEW — "a human presses the button" is not enforced. Level 3 is a
      level an agent can hold, and the middleware chain has seven steps of which none
      checks actor kind. A Level 3 agent calling submit_application passes it. The
      seeded playbook does place a `compliance_officer_approval` human_checkpoint before
      the `submit_application` node, but that is workflow SEQUENCING rather than a gate:
      it binds only work flowing through that playbook, and the engine dispatches the
      node by raising a notification rather than executing anything.

      The fix is one line in an idiom this codebase already uses in six places —
      `if (actor.kind !== 'human') return refused(...)`, as `deliverables/approval.ts`,
      `firewall/index.ts`, `retention/deletion.ts`, `billing/refunds.ts`,
      `admin/settings.ts` and `contracts/templates.ts` all do. It is not applied to
      submission. Given §1014 this is the highest-value single guard outstanding, and it
      is a code change rather than a library decision.

      RAISED BY REVIEW — synthetic-document detection does not exist. Trigger 3 names a
      capability nothing implements: `@bwc/intelligence` does `classifyByFilename` and
      coverage assessment — whether the documents required for a phase are present — and
      never inspects content. Note that classifying a document by its filename is the
      same shape of defect as moderating a video by its filename, found in AnimaForge
      this week. The trigger is kept and marked NOT BUILT rather than removed, so the
      requirement is on the record ahead of the capability.

