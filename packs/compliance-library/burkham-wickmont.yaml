  - entry_ref: compliance/outbound-contact-boundary-v1
    framework: FTC_TSR
    jurisdiction: [FEDERAL]
    runtime_flag: outbound_contact_boundary_required

    applicability_rule: >-
      Any Burkham-initiated contact with an individual — phone, email, SMS, any channel.
      Applies to Concierge Desk calls, follow-up on form fills and gated downloads, and
      first contact with a Ring 1 referral.

      A BOUNDARY ENTRY. V1 does not conduct outbound telemarketing. This documents the
      line and the discipline that keeps Burkham outside TSR's reach, not how to comply
      with it.

      Broader than TSR by design. TSR reaches telephone contact; CAN-SPAM reaches email;
      UDAAP reaches any commercial contact. Rather than run three tests, one test governs
      all outbound channels.

    agent_behavior_implication: >-
      NO OUTBOUND CONTACT WITHOUT ALL THREE. An agent checks these before dialling,
      sending or messaging. Any one missing, no contact.

      A — THE RELATIONSHIP EXISTS. One of: an active engagement, or a former client
      inside an 18-month lookback; an affirmative initiating action, documented with
      source attribution — a form submitted, a call requested, a gated asset downloaded
      with contact fields, a webinar registered, a subscription taken; or a Ring 1
      introduction WITH DOCUMENTED CONSENT from the person introduced.

      B — THE CHANNEL IS AUTHORISED. A form supplying a phone number authorises phone. A
      form supplying only email does not. The channel the person gave is the channel
      available.

      C — THE PURPOSE MATCHES THE REASON. A whitepaper downloaded about non-dilutive
      funding authorises follow-up about non-dilutive funding. It does not authorise
      outreach about Stack Management. A Blueprint client may be contacted about their
      Blueprint, not cross-sold a partner's product.

      A REFERRAL IS NOT CONSENT. A Ring 1 partner sending a name does not satisfy Part A.
      The person referred must have known they were being introduced and agreed to it,
      and that agreement must be documented in the referral packet. Without it, Burkham
      does not make contact — the partner is asked to obtain it.

      COLD OUTREACH IS BANNED IN EVERY CHANNEL. A prospect list with no documented
      initiating action fails Part A however warm the list is thought to be. This is
      consistent with the Ring 1 model: Burkham does not grow through cold contact.

      AI-MEDIATED OUTBOUND IS RESTRICTED IN V1. Concierge outbound defaults to
      human-initiated. Not because the law distinguishes — TSR does not care whether a
      human or a system dials — but because AI-mediated contact scales, exercises less
      real-time judgement about whether a particular call is appropriate, and can drift
      in scope without anyone noticing. Deployment requires an authorised scope, a volume
      ceiling, and Compliance Review Board approval.

      DO NOT CALL is TWO checks, not one, and they fail differently. The client's own
      standing instruction is held in the Communications Hub as a preference with legal
      force that nothing overrides — that one is enforced today. The national registry is
      a separate lookup that does not exist here; where a number is registered and the
      existing business relationship does not clearly apply, do not call — email, or wait
      for inbound.

      TIME OF DAY — 8am to 9pm local to the recipient, no exceptions for urgency. This is
      enforced: the Communications Hub computes the window against the recipient's own
      timezone rather than the sender's.

      THE BOUNDARY MOVES ONLY BY DECISION. An agent never approves outbound outside this
      test. Neither does a venture operator. Expanding outbound — a new channel, a new
      prospect category, a higher volume, AI-mediated deployment — is a Compliance Review
      Board decision recorded in the Event Ledger. "Just a few warm calls to the referral
      list" is how this boundary erodes, and it erodes without anyone deciding to cross
      it.

    escalation_trigger: >-
      1. When outbound is about to be initiated without documented evidence for A, B and
      C. Refuse; route for evidence review or collection.

      2. When a Ring 1 referral arrives without consent documentation. No contact. Route
      to Channel Partnerships to obtain it from the partner. A repeated pattern raises a
      `documentation_gap` finding against that partner, which is what adjusts their
      standing.

      3. When the proposed purpose does not match the initiating action's scope. Refuse;
      human review on whether additional consent is needed or the outreach should be
      redirected.

      4. When the recipient indicates they did not expect the contact — "how did you get
      my information", "I never signed up", "take me off your list". End the call, update
      the record, and Compliance & Evidence determines which of three happened: the
      evidence was insufficient, a partner referred without consent, or a system error.

      5. When complaint responses from Concierge outbound exceed a defined rate.
      Compliance Review Board reviews whether the three-part test is being applied
      correctly.

      6. When any expansion of AI-mediated outbound is proposed — channel, category, or
      volume. Compliance Review Board before deployment, never automatic.

      7. When DNC status is unverified before a dial, on either check.

      8. When a dial would fall outside 8am–9pm recipient local time.

    depends_on:
      - Ring 1 consent documentation captured in the Partner & Referrer Portal
      - a consent kind for referral introduction in the Consent & Authorization Center
      - partner training content covering the consent obligation
      - national Do Not Call registry lookup before outbound dial
      - automatic documentation_gap findings when a referral arrives without consent

    citation: "16 C.F.R. Part 310 (TSR); 15 U.S.C. § 7701 et seq. (CAN-SPAM); 15 U.S.C. § 45"

    claim_provenance:
      - claim: "V1 does not conduct outbound telemarketing"
        tag: sourced
        source: "the outbound cut recorded in V1 scope; specifications-v2 §12 phasing"
      - claim: "TSR reaches telephone, CAN-SPAM reaches email, UDAAP reaches any commercial contact"
        tag: sourced
        source: "16 C.F.R. Part 310; 15 U.S.C. §7701 et seq.; 15 U.S.C. §45"
      - claim: "The three-part test — relationship, channel, purpose"
        tag: proposed
        review_by: "outside counsel — the entry states plainly that it is a defensible operational test, not a verified legal one"
      - claim: "A referral is not consent; the referred person must have agreed and it must be documented"
        tag: reconstructed
        basis: "shaped from TSR's established-business-relationship exemption; no industry-standard implementation exists, as the entry notes"
      - claim: "The 18-month lookback for former clients"
        tag: proposed
        review_by: "counsel — follows common TSR safe-harbour practice rather than a verified requirement"
      - claim: "Calls and texts are restricted to 8am-9pm local to the recipient"
        tag: sourced
        source: "packages/comms/src/windows.ts — computed against the recipient's timezone, DST case reasoned in source"
      - claim: "The client's own do-not-call instruction has legal force and nothing overrides it"
        tag: sourced
        source: "packages/comms/src/preferences.ts doNotCall"
      - claim: "Referrals capture no consent and no consent kind exists for one"
        tag: sourced
        source: "packages/partners/src/referrals.ts records attribution and counts only; @bwc/consent has eight kinds, none for referral introduction"

    status: draft_pending_claim_library_approval

    notes: >-
      KNOWN FRICTION — this entry adds a requirement to Burkham's core acquisition
      channel. Ring 1 partners must obtain and document the referred person's consent
      before introducing them, and partners will resist. "I'm just introducing a client,
      this doesn't need paperwork" is the natural reaction and it is exactly why the
      discipline matters.

      RECOMMENDED — hold the discipline and let it filter partners rather than relaxing
      it and absorbing the TSR exposure. A partner who cannot be brought to consistent
      consent documentation is a partner whose referrals carry risk Burkham cannot see.

      OPEN — the consent language itself is novel. Business referrals ordinarily happen
      through informal introduction with no documented consent, so there is no
      industry-standard implementation to copy. Compliance & Evidence with outside
      counsel to develop language that works legally and does not make the introduction
      unnatural.

      OPEN — whether the three-part test is legally sufficient to stay outside TSR
      jurisdiction. It is a defensible operational test, not a verified legal one.
      Counsel review before locking.

      OPEN — the complaint rate threshold in trigger 5. Needs operational data. Start
      conservative and relax as evidence accumulates.

      OPEN — the 18-month lookback for former clients follows common TSR safe-harbour
      practice rather than a verified requirement. Confirm at counsel review.

      RAISED BY REVIEW — the dependency list was longer than it needed to be. Three of
      the original six are built or nearly built, and the list has been narrowed to what
      is actually missing.

      BUILT — time of day. `packages/comms/src/windows.ts` restricts calls and texts to
      8am-9pm LOCAL TO THE RECIPIENT and computes it against the recipient's timezone
      rather than the sender's, with the daylight-saving case reasoned through in the
      source: a fixed offset would be "quietly wrong for half the year, and the wrong
      half is the one where an 8am send" lands too early. Trigger 8 has an enforcer. The
      entry now says so rather than asking for it.

      BUILT — the client's own do-not-call instruction. `comms/preferences.ts` carries
      `doNotCall` as "a standing instruction with legal force. Nothing overrides it",
      distinguished in the source from a mere channel preference an urgent alert may
      override. What is NOT built is the national registry lookup, which is a different
      check with a different failure mode, so DNC is now stated as two checks.

      MOSTLY BUILT — Partner Risk Score. `packages/partners/src/risk.ts` has standings,
      severities, thresholds, a ten-referral minimum before a rate is computed, and a
      `FindingKind` list that already includes `documentation_gap` — the exact kind a
      missing referral consent should raise. The score does not need building; the
      automatic finding does, and that is the dependency now recorded.

      PARTLY BUILT — partner training. `partners/curriculum.ts`, `tracks.ts` and
      `certification.ts` exist, so the machinery is there and only the content is
      missing. Narrowed to content.

      NOT BUILT, and the core gap. `packages/partners/src/referrals.ts` records
      attribution and counts — total, converted, lost, open — and captures NO CONSENT
      from the person referred. There is also no consent KIND for it: the Consent &
      Authorization Center has eight, and a referral introduction is not among them.

      That second one matters more than it looks. `@bwc/consent` refuses a consent with
      an empty scope, on the reasoning that an unscoped consent is a blanket consent by
      accident — which is precisely the discipline this entry wants for referrals. The
      right home for Ring 1 consent is a ninth kind in that store, not a field on a
      referral row, because the store already enforces scope, expiry and revocation
      propagation and a bare boolean on a referral would enforce none of them.

  # =========================================================================
  # WRITTEN BY IVAN. The Pack gained a STATE_LENDER_LICENSURE row; it declared none.
  #
  # `jurisdiction` is [ALL] rather than the seven-plus-"+". The rule binds in every
  # state — that is what "every engagement, in every state" means — and the seven
  # are where a finding is being sought, which belongs in depends_on rather than in
  # the jurisdiction list. A "+" in a jurisdiction list binds nothing.
  # =========================================================================
  # =========================================================================
  # WRITTEN 31 August 2026, alongside the flat success fee schedule. The schedule
  # records six products and deliberately omits a seventh; this is what the omission
  # means. Without it, "no row for merchant_cash_advance" reads as an oversight
  # rather than as a decision, and the next person to complete the schedule fills
  # the gap.
  # =========================================================================
  - entry_ref: compliance/no-advance-placement-v1
    framework: UDAAP
    jurisdiction: [ALL]
    runtime_flag: advance_placement_prohibited

    applicability_rule: >-
      Any point at which a merchant cash advance could be recommended, applied for,
      submitted, or discussed as something Burkham would arrange. Intake, Blueprint,
      recommendation, submission, and any conversation where a client asks for one.

      NOT A PRICING RULE. It sits beside the success fee schedule because that is where the
      decision became visible - the schedule prices six products and omits this one - but the
      omission is a consequence rather than the rule. The rule is that Burkham does not place
      advances at all.

    agent_behavior_implication: >-
      BURKHAM DOES NOT PLACE MERCHANT CASH ADVANCES. Not at a higher fee, not with extra
      disclosure, not on a client's insistence. There is no fee at which this becomes a
      product the firm arranges.

      REFER OUT, AND TAKE NOTHING FOR IT. A client whose situation genuinely points to an
      advance is told so and pointed elsewhere. Burkham accepts no referral fee, no
      commission and no consideration of any kind for that referral. A payment for sending
      someone toward a product the firm will not itself place is a reason to send them, and
      the reason this entry exists is that the firm decided it should have no such reason.

      SAY WHY, NOT JUST NO. A client who is refused without explanation goes and finds an
      advance on their own, from whoever answers the phone, on worse terms and with nobody
      explaining the daily remittance. The refusal carries the reasoning: what an advance
      costs relative to the alternatives, how the repayment works against daily receipts,
      and what would have to change about their situation for a placeable product to fit.

      NO FEE IS RECORDED FOR IT, AND THE ABSENCE IS THE RECORD. The success fee schedule
      carries no row for merchant_cash_advance. That is deliberate and is not the same as a
      row of zero: a zero says the product is free, and no row says the product is not
      priced. `recordFundingOutcome` refuses a placement of it, naming the product.

      IF AN ADVANCE REACHES THE PLACEMENT PATH, SOMETHING UPSTREAM FAILED. The refusal is a
      backstop and not the control. Funding Ethics Firewall rule 1 already refuses an
      advance for five of the six capital needs on fit alone, and this entry covers the
      sixth and any case where fit would have permitted it.

    escalation_trigger: >-
      1. When a client asks Burkham to arrange a merchant cash advance. Explain, refer out,
      document the referral and that no consideration was taken.

      2. When any output recommends, quotes, or describes an advance as something Burkham
      would arrange. Refuse and rewrite.

      3. When a placement of merchant_cash_advance is attempted. It refuses; the attempt is
      the finding. Route to Compliance & Evidence to establish how it got that far.

      4. When any arrangement is proposed under which Burkham would receive consideration
      for referring a client to an advance provider. Compliance Review Board. This is a
      change to what the firm is, not a partnership decision.

      5. When a client returns having taken an advance elsewhere. Not a failure of this rule
      and not a reason to disengage - it becomes an input to Firewall rules 3 and 4, and the
      client should be asked about it precisely because the system cannot see it.

    depends_on:
      - a documented refer-out procedure naming who the client is sent to and on what basis
      - scanner detection of advance-arranging language in client-facing output
      - a place to record that a referral was made and that no consideration was taken

    citation: "12 U.S.C. § 5531 (CFPA, abusive); FTC Act 15 U.S.C. § 45"

    claim_provenance:
      - claim: "Burkham does not place merchant cash advances"
        tag: proposed
        review_by: "Compliance Review Board. Founder decision of 31 August 2026, recorded as NOT_OFFERED in packages/billing/src/successFeeSeed.ts and enforced by the absence of a schedule row."
      - claim: "No referral fee is taken for referring a client to an advance provider"
        tag: proposed
        review_by: "Compliance Review Board. A payment for sending someone toward a product the firm will not place is a reason to send them."
      - claim: "The refusal explains, so the client does not go and find a worse one alone"
        tag: reconstructed
        basis: "Shaped from compliance/client-interest-standard-v1, which says saying no is part of the service and that the client's outcome is the obligation. No source states the explaining requirement."
      - claim: "An advance reaching the placement path means something upstream failed"
        tag: reconstructed
        basis: "Follows from Firewall rule 1 refusing merchant_cash_advance for five of six capital needs on fit alone; the refusal here is a backstop rather than the primary control."

    status: draft_pending_claim_library_approval

    notes: >-
      WHY THIS IS AN ENTRY AND NOT A LINE IN THE SCHEDULE. The schedule can record that a
      product has no price. It cannot record why, cannot tell an agent what to do when a
      client asks, and cannot distinguish "not priced yet" from "never". An omission with
      no entry behind it is the shape this library exists to catch - somebody completing the
      schedule later would fill the gap in good faith.

      OPEN - the refer-out procedure. There is no documented list of who an advance client is
      sent to, and no basis on which such a list would be built. Sending a client to a
      provider the firm has not assessed is its own problem, and it is the reason this
      dependency is first.

      OPEN - nothing records that a referral was made or that no consideration was taken.
      The commitment is currently unfalsifiable, which is the weakest kind.

      NOTED - this entry costs revenue by construction, and that is the point. A client
      refused an advance is a client who may place nothing at all. compliance/client-interest-standard-v1
      names four ways the fee structure pulls against the client; this is the firm choosing
      against itself in the one case where the pull is strongest, because the alternative is
      a fee earned on the product most likely to end the client's business.
  # =========================================================================
  # WRITTEN 1 September 2026, replacing the retired compliance/reg-z-trigger-terms-v1.
  # That template would have stated an obligation the firm does not have. This states
  # the boundary and what governs instead, which is the part an agent needs.
  # =========================================================================
  - entry_ref: compliance/reg-z-advertising-boundary-v1
    framework: REG_Z_ADVERTISING
    jurisdiction: [FEDERAL]
    runtime_flag: trigger_term_disclosure_required

    applicability_rule: >-
      Any content reaching a person who has not engaged Burkham. Website, landing pages,
      social posts, partner-distributed material, gated downloads, conference material,
      outbound copy of any kind.

      THE LINE IS WHO IS READING, NOT WHAT IS SAID. Advertising is anything reaching
      prospects who have not engaged. Communication inside a live engagement — a Blueprint,
      a stack recommendation, a fee exhibit, a lender-option memo — belongs to
      compliance/estimate-not-offer-v1, which requires the hedge in the same sentence as
      the number. Two disciplines, two audiences, and the same figure can be permitted in
      one and refused in the other.

      TILA DOES NOT REACH BURKHAM'S ADVERTISING. specifications-v2 §6 records a
      business-purpose credit exemption from most of TILA; the parts that survive it — card
      issuance and unauthorized-use rules — are the issuer's obligations and are not
      advertising rules. This entry exists because that exemption is easy to discover and
      easy to over-read: exempt from Reg Z is not exempt from FTC Act §5, from UDAAP, or
      from the firm's own claim discipline.

    agent_behavior_implication: >-
      BURKHAM DOES NOT ADVERTISE CREDIT TERMS. No rate, no APR, no factor rate, no payment,
      no term length, no credit limit, in any content reaching a person who has not engaged.
      Not as a range, not as a floor, not as a typical figure, not attributed to a lender.

      The reason is not Reg Z. It is that a credit term on a public surface is a
      representation about what a reader could obtain, made before anyone has seen their
      file — which is compliance/own-claims-and-pricing-v1's banned category, reached by a
      number instead of a sentence.

      WHAT MAY BE SAID PUBLICLY: the products Burkham helps place, the service, the process,
      firm-scale aggregates under own-claims-and-pricing-v1's substantiation rule, and
      Burkham's OWN pricing, which is not a credit term.

      FOUR CROSSINGS, AND WHICH SIDE EACH FALLS ON. These are the cases where the line is
      actually decided:

      1. THE SAME FIGURE IN TWO PLACES. "Lines of credit from 9% APR" on the pricing page is
      advertising and is refused. The same 9% inside a Blueprint, hedged in-sentence and
      attributed, is estimate-not-offer-v1's territory and is permitted. The figure did not
      change; the reader did.

      2. THE GATED DOWNLOAD. A whitepaper behind an email capture reaches a prospect, not a
      client. An email address is not an engagement. Gating changes who receives it and not
      what it is, so the content is advertising and carries no credit terms.

      3. THE PARTNER'S OWN MATERIAL. A Ring 1 referrer writing "Burkham gets lines at around
      9%" is advertising Burkham's service to prospects, and the fact that Burkham did not
      write it does not make it someone else's problem — see
      compliance/facilitator-not-broker-v1 trigger 8 on third-party characterisation.
      Partner material carrying credit terms is a finding against the partner and a
      correction request, not a shrug.

      4. THE PAID-BUT-NOT-PLACED CLIENT. Someone who bought a Blueprint has engaged. Content
      prepared for them is in-engagement even though no placement has happened, so the
      Blueprint may carry hedged figures. A general marketing email sent to the same person
      about a different service is advertising again, because it is not prepared for them.

      WHERE THE LINE IS UNCLEAR, IT IS ADVERTISING. The restrictive direction, for the reason
      compliance/bureau-report-handling-v1 gives for characterising rather than reproducing:
      the cost of treating an in-engagement document as an advertisement is a hedge nobody
      needed, and the cost of the reverse is a public credit representation.

    escalation_trigger: >-
      1. When any credit term appears in content reaching a non-engaged reader. Refuse and
      rewrite. This is a refusal and not a disclosure obligation — there is no disclosure
      that makes a public credit term acceptable, because the problem is not that it is
      unqualified.

      2. When it is unclear whether a reader has engaged. Treat as advertising.

      3. When partner-distributed material carries a credit term. Correction request to the
      partner, and a `documentation_gap` finding if it repeats.

      4. When somebody argues a figure is permitted because Reg Z does not apply. Escalate.
      The Reg Z exemption is real and is not the basis of this rule, and an agent reasoning
      from it has the wrong rule in mind.

      5. When a client-facing deliverable is repurposed as marketing material — a Blueprint
      excerpt in a case study, a stack recommendation in a pitch deck. It becomes advertising
      on republication and the figures come out.

    depends_on:
      - a Scanner rule that refuses a credit term on a public surface, rather than obliging the estimate disclosure written for in-engagement deliverables
      - a surface classification the Scanner can read, so it knows whether content is public or in-engagement

    citation: "15 U.S.C. § 1601 et seq. and 12 C.F.R. § 1026.2(a)(12) (business-purpose exemption); 12 C.F.R. § 1026.16 (advertising, consumer credit); 15 U.S.C. § 45"

    claim_provenance:
      - claim: "TILA does not reach Burkham's advertising, because the credit is business-purpose"
        tag: sourced
        source: "specifications-v2 §6: 'CFPB Regulation Z - business-purpose credit exemption from most TILA, but card issuance and unauthorized-use rules apply.'"
      - claim: "Burkham advertises no credit terms at all"
        tag: proposed
        review_by: "Compliance Review Board. Stricter than the exemption requires and stricter than most competitors, and it forecloses a category of marketing copy the firm might otherwise want."
      - claim: "The line is the reader, not the content: advertising is anything reaching a non-engaged person"
        tag: reconstructed
        basis: "Written 1 September 2026 to separate this entry from compliance/estimate-not-offer-v1, which governs the same figures inside an engagement. No source draws the line; the two entries needed a boundary and this is where it was put."
      - claim: "The four crossings, and which side each falls on"
        tag: reconstructed
        basis: "Written to make the definition usable. Each is derived from an existing entry - own-claims-and-pricing-v1 on public figures, facilitator-not-broker-v1 trigger 8 on partner characterisation, estimate-not-offer-v1 on in-engagement hedging - rather than from a source that addresses advertising scope."
      - claim: "Where the line is unclear, treat it as advertising"
        tag: reconstructed
        basis: "The same restrictive tie-break compliance/bureau-report-handling-v1 uses for characterise-versus-reproduce, applied to a different boundary."

    status: draft_pending_claim_library_approval

    notes: >-
      THE SCANNER GAP, STATED PRECISELY BECAUSE THE OBVIOUS VERSION OF IT IS WRONG.

      It is tempting to say a bare rate on a public surface passes every existing check. It
      does not. `detectLenderNumbers` is wired into `scanText` and obliges an estimate
      disclosure on any lender-product number, whether or not a Claim Library phrase matched.
      Verified 1 September 2026:

      "Business lines of credit from 9% APR"  -> requires_disclosure, DISCLOSURE_ESTIMATE
      "Rates as low as 9% APR"                -> requires_disclosure, DISCLOSURE_LOWEST_RATE
                                                 + DISCLOSURE_ESTIMATE
      "Lines of credit up to $250,000"        -> clean
      "Business funding for growing companies" -> clean

      THE REAL GAP IS THE REMEDY, NOT THE DETECTION. The disclosure obliged is "Estimates are
      based on the information available at the time of preparation and are not an offer or
      commitment of credit." That sentence is written for a deliverable prepared for a
      specific client. On a public advertisement nothing was prepared and there is no client,
      so attaching it produces a compliant-looking page that says something untrue about
      itself. The scanner catches the number and prescribes the wrong cure.

      A SECOND GAP, SMALLER AND REAL. "Lines of credit up to $250,000" scans clean. An amount
      with no rate is not a lender-product number under `NUMBER_SHAPES`, and on a public
      surface it is still a representation about what a reader could obtain.

      WHAT IS NEEDED is a Scanner rule that REFUSES rather than discloses, conditioned on the
      surface being public — which means the Scanner needs to know which surface it is
      scanning, and it currently does not. Both are recorded as dependencies. Neither is this
      entry's job to build, and the entry states the rule regardless, because the alternative
      is weakening the rule to match the machinery.

  # =========================================================================
  # WRITTEN 1 September 2026, replacing the retired
  # compliance/cfpb-1071-data-collection-v1 and superseding the paragraph folded
  # into fair-treatment-in-routing-v1 earlier the same day. Not being covered has
  # two consequences and the fold only carried one of them.
  # =========================================================================
  - entry_ref: compliance/cfpb-1071-boundary-v1
    framework: CFPB_1071
    jurisdiction: [FEDERAL]
    runtime_flag: sb_lending_data_collection

    applicability_rule: >-
      Any point at which demographic or protected-class data about a small business applicant
      could be collected, transmitted, retained or used. Intake, application preparation,
      submission, and any analysis of Burkham's own routing.

      BURKHAM IS NOT A COVERED FINANCIAL INSTITUTION. Section 1071 obliges collection and
      reporting by institutions that ORIGINATE covered credit transactions.
      specifications-v2 §6 puts the tiers "at the issuer level". Burkham prepares, packages
      and submits applications; it does not originate, and no 1071 reporting duty attaches
      to it.

      NOT BEING COVERED HAS TWO CONSEQUENCES AND THEY POINT IN OPPOSITE DIRECTIONS. One
      narrows what Burkham may do. The other makes an existing gap urgent. Both are here
      because carrying only the first is how "we are not covered" becomes a reason to stop
      thinking about it.

    agent_behavior_implication: >-
      NO 1071 OBLIGATION MEANS NO 1071 COLLECTION AUTHORIZATION. This is the ceiling and it
      comes first.

      A covered institution may lawfully ask an applicant their ethnicity, race and sex
      because 1071 requires it to. Burkham has no such requirement, and therefore no such
      permission. The ECOA prohibition on collecting protected-class information stands
      undisturbed — it is REINFORCED by not being covered, not relaxed. An agent that
      reasons "1071 is about collecting this data, so collecting it is normal in small
      business lending" has drawn the exactly wrong conclusion from the exemption.

      So: Burkham never asks. Not on an intake form, not in conversation, not as an optional
      field, not to improve a match, and not because a lender will ask later anyway.

      WHERE AN ISSUER COLLECTS THROUGH BURKHAM: transmit what the issuer's own form requires,
      retain none of it, use none of it in routing or recommendation, and tell the client it
      goes to the issuer and is used by the issuer. Burkham is a conduit for that field and
      not a holder of it. The route in is what makes this worth stating separately from the
      volunteered-information rule in compliance/fair-treatment-in-routing-v1: volunteered
      data arrives in conversation, and this arrives on a form Burkham is filling in, which
      makes retaining it the natural mistake rather than the obvious one.

      AND THE SECOND CONSEQUENCE: BURKHAM'S ROUTING BECOMES VISIBLE IN SOMEBODY ELSE'S
      REPORTING. Every application Burkham submits to a covered issuer enters that issuer's
      1071 dataset, carrying the demographic data the issuer collected and the outcome. Which
      lenders Burkham routed which clients to is therefore reconstructable from public
      reporting, in aggregate, by regulators and by anyone else reading it — without Burkham
      collecting a single protected-class field itself.

      THAT MAKES THE DISPARATE IMPACT GAP TIME-SENSITIVE RATHER THAN ASPIRATIONAL.
      compliance/fair-treatment-in-routing-v1 records that disparate impact monitoring over
      Recommendation Engine output does not exist. Until 1071 reporting begins, that gap is
      an internal one. Once it does, a pattern in Burkham's routing is discoverable by
      someone else before it is discoverable by Burkham — and the first the firm would learn
      of it is an inquiry.

      An agent does not act on this. It is here because the entry that owns the gap needs to
      know why the clock started.

    escalation_trigger: >-
      1. When any Burkham-originated form, script or field would collect ethnicity, race, sex
      or another protected characteristic. Refuse. There is no business justification
      available, and the 1071 exemption is not one.

      2. When an agent proposes collecting demographic data "because the lender will ask
      anyway". Refuse and route. The lender asking under its own obligation is not authority
      for Burkham to ask under none.

      3. When issuer 1071 fields appear in a submission path that persists them. Compliance &
      Evidence. Transmission is permitted and storage is not, and the difference is an
      implementation detail nobody will notice by reading the form.

      4. When 1071 reporting begins for any issuer Burkham routes to. Compliance Review Board,
      and the disparate impact monitoring dependency in
      compliance/fair-treatment-in-routing-v1 moves from open to overdue.

      5. When a regulator, a lender or a journalist raises a pattern in Burkham's routing
      drawn from published 1071 data. Compliance Review Board and outside counsel. Do not
      respond with a denial that cannot be substantiated from Burkham's own records, which
      today it could not be.

    depends_on:
      - a submission path that transmits issuer 1071 fields without persisting them, which nothing implements because no issuer submission path exists
      - disparate impact monitoring over Recommendation Engine output, held by compliance/fair-treatment-in-routing-v1 and now time-bound rather than open-ended

    citation: "15 U.S.C. § 1691c-2 (ECOA § 1071); 12 C.F.R. § 1002.107 (covered financial institution, covered credit transaction); 15 U.S.C. § 1691(a) and 12 C.F.R. § 1002.5(b) (prohibition on requesting protected-class information)"

    claim_provenance:
      - claim: "Burkham is not a covered financial institution under Section 1071"
        tag: sourced
        source: "specifications-v2 §6: 'CFPB Section 1071 - small business lending data collection tiers apply from 2026-2027 at the issuer level.' 12 C.F.R. §1002.107 conditions coverage on originating covered credit transactions; Burkham prepares and submits and does not originate."
      - claim: "No 1071 obligation means no 1071 collection authorization, so the ECOA prohibition is reinforced rather than relaxed"
        tag: sourced
        source: "12 C.F.R. §1002.5(b) prohibits requesting protected-class information; §1002.5(a)(4) permits it only where required by a regulation such as 1071. Burkham has no such requirement and therefore no such exception."
      - claim: "Issuer 1071 fields are transmitted, never retained, never used in routing"
        tag: reconstructed
        basis: "Extends compliance/fair-treatment-in-routing-v1's volunteered-information rule to data arriving on an issuer's form. No source addresses a non-covered intermediary's handling of a covered institution's 1071 collection."
      - claim: "Burkham's routing becomes reconstructable from issuer 1071 reporting"
        tag: reconstructed
        basis: "Follows from every submitted application entering the receiving issuer's dataset with its outcome. Not stated anywhere, and it is the entry's own reasoning about what published data would show."
      - claim: "The disparate impact monitoring gap is time-bound by the 2026-2027 phase-in"
        tag: proposed
        review_by: "Compliance Review Board. It converts an open dependency in fair-treatment-in-routing-v1 into one with a deadline, which is a resourcing decision rather than a compliance reading."

    status: draft_pending_claim_library_approval

    notes: >-
      WHY THIS IS AN ENTRY AFTER ALL. It was retired as a template on 31 August and folded
      into compliance/fair-treatment-in-routing-v1 the same day, on the reasoning that a
      framework that does not bind the firm does not need an entry. That was half right. The
      fold carried the conduit rule and lost both of the things that make non-coverage
      consequential: that it removes the only lawful basis for asking, and that Burkham's
      routing is legible in somebody else's reporting regardless.

      An entry whose whole content is "this does not apply to us" is not worth a slot. An
      entry that says "this does not apply to us, and here are the two things that follow"
      is a different document.

      THE FIRST CONSEQUENCE IS THE ONE AN AGENT GETS WRONG. "1071 is about collecting
      demographic data in small business lending" is true and leads directly to the wrong
      behaviour, because the collection is authorised BY the obligation. Removing the
      obligation removes the authorisation. That inference is the reason the behaviour
      section leads with the ceiling rather than the conduit rule.

      THE SECOND IS THE ONE THE FIRM GETS WRONG. Not being covered reads as not being visible.
      It is the opposite: Burkham submits into datasets it does not control and cannot see,
      and the aggregate picture of its routing will exist whether or not it builds the means
      to look at it.

      OPEN — no issuer submission path exists, so the conduit rule is unenforceable today and
      the retention risk is not yet live. It becomes live with the first real submission
      integration, which is also when it will be easiest to get wrong.
  # =========================================================================
  # WRITTEN BY IVAN, 1 September 2026. Closes both `privacy_request_handling` Pack
  # rows — CCPA and STATE_PRIVACY_COMPREHENSIVE — which were the last two rows in the
  # Pack declaring a gap with no entry at all.
  #
  # `framework` set to STATE_PRIVACY_COMPREHENSIVE: STATE_PRIVACY is not a value the
  # validator accepts, and of the two that are, this is the one whose row is not
  # already California-scoped.
  #
  # `jurisdiction` corrected from [CA, TX, VA, CO, CT, +] to [ALL]. The "+" binds
  # nothing — this entry's own author made that correction to
  # compliance/facilitator-not-broker-v1 — and the discipline as written applies to a
  # request from any person wherever they are, which is what [ALL] says. The five
  # named regimes are in the citation, where they are checkable.
  # =========================================================================
  - entry_ref: compliance/consumer-privacy-rights-v1
    framework: STATE_PRIVACY_COMPREHENSIVE
    jurisdiction: [ALL]
    runtime_flag: privacy_request_handling

    applicability_rule: >-
      Any request from a person for access to, a copy of, or deletion of personal data
      Burkham holds about them. Applies whatever their relationship — client, engaged
      prospect, declined applicant, form-fill respondent, or a person referred by a partner
      who never engaged.

      NOT CURRENTLY COVERED, AND THAT DOES NOT SETTLE IT. Burkham meets no CCPA threshold:
      revenue is far below $25M, California consumer volume is far below 100,000, and no
      personal data is sold. Texas exempts small businesses. Coverage is unlikely in V1 under
      any state regime.

      Two things make the discipline apply anyway:

      VENDOR CONTRACTS. A data processing agreement typically requires a processor to honour
      data subject rights flowing from the vendor's own obligations, so the discipline may be
      contractually required exactly where it is not statutorily required — and a threshold
      answer does not reach a contract term. WHICH vendors carry such an agreement is
      unverified and smaller than assumed; see notes.

      THE THRESHOLDS MOVE. Coverage is re-analysed on: revenue crossing $25M, California
      consumer volume approaching 100,000, activation in any new state, and any change to a
      vendor DPA. Until one of those, the discipline is voluntary and operationally sound
      rather than obligatory.

    agent_behavior_implication: >-
      THE RIGHT ATTACHES TO THE PERSON, NOT THE RELATIONSHIP. A form-fill respondent who
      never engaged has the same standing as a funded client. Verification differs; the
      standing does not.

      AN AGENT MAY: acknowledge receipt and state the response timeline; run identity
      verification; compile what is held across systems; prepare the compiled data for
      delivery.

      AN AGENT MAY NOT: decide the scope of disclosure; decide a deletion where a retention
      obligation conflicts; respond to anything beyond a routine access or deletion request;
      act on a request from someone whose relationship is unclear or contested; act on a
      request carrying threats or legal framing.

      EVERY RESPONSE IS REVIEWED BY A HUMAN BEFORE DELIVERY. Compilation is mechanical; what
      leaves the building is not.

      NINE SYSTEMS HOLD DATA ABOUT A PERSON. Client Lifecycle & CRM · Household / Entity
      Graph · Secure Document Vault · Consent & Authorization Center · Communications Hub
      recordings and message logs · Compliance Evidence Vault · Event Ledger · Marketing Ops
      form fills and gated downloads · Partner & Referrer Portal. A response that omits one
      is incomplete, and nothing currently compiles across them.

      DELETION IS EVALUATED AGAINST RETENTION, NEVER AGAINST CONVENIENCE.

      CANNOT BE DELETED AT ALL, EVER: the Event Ledger. It is append-only and the database
      rejects UPDATE, DELETE and TRUNCATE outright — enforced by a trigger, not by policy.
      This is not "retained while an obligation runs" and must never be described that way to
      a requester: there is no date on which it becomes deletable. What the Ledger holds about
      a person is what a Ledger holds — that an event occurred, when, and by which actor —
      and a response says so plainly rather than implying a future erasure that cannot happen.

      Cannot be deleted while the obligation runs: application records (§1014 defence),
      consent records, bureau reports under Regulatory Engine state rules, compliance evidence
      artifacts, financial records, communications held as disclosure evidence.

      Can be deleted: marketing contact records for people who never engaged, form fill data
      past its window, session and analytics data, general correspondence outside a compliance
      record.

      Where more than one applies, delete what can be deleted and retain what must be
      retained, documenting both. A partial deletion is stated as one — never presented as a
      completed erasure.

      SAY WHAT IS RETAINED AND WHY. A request refused in part gets the specific obligation and
      the date deletion becomes possible, or that there is no such date where the Ledger is
      concerned. Data Burkham merely finds useful is not retained against a request; only data
      it is required to keep.

      NON-CLIENT DATA EXPIRES BY DEFAULT. Form fills, gated downloads and referral records for
      people who do not engage within the defined window expire automatically. This shrinks the
      compliance surface, matches what a person reasonably expects of an enquiry they made
      once, and makes most deletion requests trivial.

    escalation_trigger: >-
      1. A privacy request reaches anyone — agent, Concierge, founder — without routing to
      Compliance & Evidence with a response timeline. Never handled informally.

      2. Identity verification cannot be completed. Do not disclose. Route for how to handle
      failure without disclosing to an impostor.

      3. The request asks for something outside a routine access or deletion.

      4. A retention obligation conflicts with the deletion requested.

      5. The request carries threats, legal action, or a complaint — "delete everything or I
      file", "I'm consulting a lawyer". Compliance Review Board, and consider counsel. No
      substantive response without founder review.

      6. The person claims Burkham holds their data and no system shows them. Identity
      confusion, a breach signal, or a fraudulent request — all three need a human.

      7. The request implicates third-party data — deletion of communications that also
      describe partners, other clients, or family members.

      8. Request volume exceeds what manual handling can meet inside the response window. That
      is the point at which the compilation capability stops being deferrable.

    depends_on:
      - consumer data access response capability compiling across the nine systems
      - a dedicated privacy request intake channel with defined routing
      - identity verification workflow for non-clients with no portal access
      - a retention obligation matrix mapping data type to rule and expiry date, which the vault resolves per document and no surface answers per person
      - auto-expiration for non-client data past its window
      - response templates approved by Compliance & Evidence
      - request volume monitoring against response-window capacity
      - a read of the actual vendor data processing agreements, to establish which of them oblige this discipline contractually

    citation: "Cal. Civ. Code § 1798.100 et seq. (CCPA/CPRA); Tex. Bus. & Com. Code ch. 541 (TDPSA); Va. Code § 59.1-575 (VCDPA); Colo. Rev. Stat. § 6-1-1301 (CPA); Conn. Gen. Stat. § 42-515 (CTDPA)"

    claim_provenance:
      - claim: "Burkham meets no CCPA threshold in V1"
        tag: sourced
        source: "Cal. Civ. Code §1798.140(d): $25M gross revenue, or 100,000 consumers or households, or 50% of revenue from selling or sharing. Burkham meets none, and sells no personal data."
      - claim: "Texas exempts small businesses"
        tag: sourced
        source: "Tex. Bus. & Com. Code §541.002 conditions the TDPSA on not being a small business as defined by the SBA."
      - claim: "The right attaches to the person, not the relationship"
        tag: reconstructed
        basis: "Every regime cited defines a consumer by residency rather than by any commercial relationship. The operational consequence - that a form-fill respondent has a funded client's standing - is this entry's own statement and follows from the definitions rather than from a source that draws it."
      - claim: "Nine systems hold data about a person, and nothing compiles across them"
        tag: sourced
        source: "Verified 1 September 2026: no cross-system subject-data compile exists in the repository. The nine named map to packages clients, graph, vault, consent, comms, evidence, ledger, marketing and partners."
      - claim: "The Event Ledger cannot be deleted at all, ever"
        tag: sourced
        source: "packages/ledger/src/index.ts: 'append-only : the database rejects UPDATE, DELETE and TRUNCATE (migration trigger)'. Structural, not a retention period."
      - claim: "A partial deletion is stated as one, never presented as a completed erasure"
        tag: reconstructed
        basis: "Follows from the same discipline compliance/own-claims-and-pricing-v1 applies to accuracy: a technically true statement that leaves a false impression is the thing being guarded against. No source states it for deletion responses."
      - claim: "The discipline may be contractually required by vendor DPAs where it is not statutorily required"
        tag: proposed
        review_by: "Compliance Review Board, and it needs the agreements read first. `REQUIRED_EVIDENCE` obliges a signed DPA per vendor, but only Plaid among the vendors named is a selected one - see notes."
      - claim: "Non-client data expires by default"
        tag: proposed
        review_by: "Compliance Review Board. The window itself is undecided; 12 to 18 months is a default and not a figure anyone has agreed."
      - claim: "Coverage is re-analysed on four named triggers"
        tag: reconstructed
        basis: "The triggers are derived from the thresholds in the cited statutes plus the per-state activation gate this library already relies on. Not a schedule anybody has adopted."

    status: draft_pending_claim_library_approval

    notes: >-
      THE ANSWER TO "CAN WE PRODUCE IT" IS CURRENTLY NO. Nine systems hold data about a person
      and nothing queries across them. Compliance & Evidence can assemble a response by hand
      at V1 volumes; that stops being true before anyone notices, because the trigger is a
      response window rather than a workload.

      RAISED BY REVIEW — the vendor list does not survive checking, and the argument that
      rests on it is weaker than it reads. The draft named Plaid, Nav, Array, ContractWorks
      and QuickBooks as each carrying a DPA. What the repository holds:

      · PLAID is a selected vendor in `VENDOR_IDS` and does carry a DPA requirement —
      `REQUIRED_EVIDENCE` obliges a signed DPA for every vendor before activation.

      · NAV is a CANDIDATE, not a selection. `integration/src/index.ts` reads "Decision B -
      business bureau. Vendor selection still open (Nav / Experian / D&B)."

      · ARRAY is likewise a candidate, named in blueprint-v2 as one option for personal
      bureau pulls.

      · CONTRACTWORKS appears nowhere in the repository or either reference document.

      · QUICKBOOKS appears once, in specifications-v2 §595, as a recommendation for an
      ACCOUNTING FORGE integration. It is not a Burkham vendor.

      So of five named vendors, one is real, two are unchosen candidates, one is absent and
      one belongs to a different venture. The DPA argument is not wrong — a signed DPA is
      required per vendor and Plaid's will exist — but it currently rests on one agreement
      rather than five, and no one has read that one to see whether it obliges this
      discipline. That is now the last `depends_on`.

      OPEN — the vendor DPA question, narrowed. Whether Plaid's DPA contractually requires
      Burkham to honour data subject rights is unverified, and it is the reason this
      discipline may bind despite no statutory coverage. Same review as the bureau TOS work
      already delegated in compliance/bureau-report-handling-v1 — bundle them, and add the
      remaining vendors as they are selected rather than assuming them now.

      OPEN — the non-client expiry window. 12 to 18 months is a reasonable default and is not
      a decided figure.

      PARTLY BUILT, and worth knowing which half. `packages/retention/src/deletion.ts` has
      `requestDeletion`, `assessEligibility`, `decideRequest` and `recordCompletion`, with
      deletion set at Authority Level 3. What it answers is the LEGAL HOLD half — whether a
      hold blocks destruction. It deliberately does not answer retention, and says so:
      "Retention is per document and cannot be answered per client." So the matrix this entry
      depends on is not missing entirely; what is missing is a per-person view over a vault
      that resolves per document.

      NOTED — the state privacy landscape is fragmented and moving. This entry names five
      regimes and does not assume they behave alike. Coverage analysis is per state at
      activation, alongside the disclosure and broker determinations already required there.



  - entry_ref: compliance/facilitator-not-broker-v1
    framework: STATE_LENDER_LICENSURE
    jurisdiction: [ALL]
    runtime_flag: facilitator_status_required

    applicability_rule: >-
      Every engagement, in every state, from intake through placement. Governs how
      Burkham characterises itself, how it is compensated, what its agents do with a
      lender, and whether it may operate in a given state at all.

      NOT A BOUNDARY ENTRY. The credit repair, tax and outbound entries describe services
      Burkham does not provide. This describes the service Burkham does provide, and
      whether that activity requires a licence is a per-state question with no single
      answer.

      "WE ARE NOT A LENDER" IS THE WRONG CLAIM. Nobody alleges Burkham lends. The
      exposure is broker licensure: several states license anyone taking compensation for
      arranging credit, regardless of whose money funds it. Burkham charges a success fee
      contingent on placement — which is the definition, not a distance from it. The
      contingent structure makes the question sharper, not softer.

    agent_behavior_implication: >-
      FOUR STRUCTURAL DISCIPLINES. Each supports the position that Burkham facilitates
      rather than brokers. Each must hold continuously; any one breaking requires
      re-analysis of the whole perimeter.

      1. NEVER TOUCH THE MONEY. Burkham does not receive, hold, escrow, disburse or
      otherwise handle client capital at any point. Clients pay Burkham for its service;
      lender approvals disburse directly from lender to client. This is load-bearing for
      more than broker status — handling funds reaches money transmission, custody and
      potentially banking regulation.

      2. NEVER TAKE LENDER-SIDE COMPENSATION. Fees come from the client only. No lender
      referral fee, no origination participation, no volume arrangement, no economic
      relationship with the lender in either direction.

      3. NEVER NEGOTIATE TERMS. Burkham's role is preparation, packaging, coordination
      and submission. Agent contact with a lender's underwriters is scoped to
      documentation clarification, timing, and advocacy for approval on the client's
      circumstances. Pushing for a lower rate, different covenants or an altered
      structure is term negotiation, and in several states that is exactly the licensed
      activity.

      4. FEES ARE FOR FACILITATION, NOT FOR AN OUTCOME. The engagement documents, the fee
      exhibit and every description of the success fee must be clear that compensation is
      for the facilitation service performed, not consideration for arranging a specific
      credit outcome. This is a documentation discipline, not merely a phrasing
      preference.

      TWO OF THESE HOLD BY ABSENCE TODAY, WHICH IS NOT THE SAME AS BEING ENFORCED.
      Nothing in the system models client capital — no escrow, no disbursement, no
      custody — so discipline 1 cannot currently be broken. Nothing models compensation
      flowing FROM a lender either; the fee model on an offering describes what the
      lender charges the client, and partner payouts run outward. A discipline that holds
      because the capability is missing is one a future feature breaks silently, which is
      what trigger 2 exists for.

      NEVER CALLED A BROKER. Not by Burkham, not in a deliverable, not in partner
      material. The approved characterisation is that Burkham helps identify suitable
      funding options and prepares and submits applications on the client's
      authorisation.

      That said — declining the label does not decide the question. A state characterises
      activity by what is done, not by what it is called.

      NO SERVICE IN A STATE WHOSE BROKER TREATMENT IS UNREVIEWED. Counsel review must
      return one of four findings per state:

      - permitted without registration

      - permitted with structural tightening — and the tightening named

      - registration required

      - not activatable

      Until a state has one of those four on record, Burkham does not serve clients there.

      THIS IS A SECOND GATE, NOT THE EXISTING ONE. The Regulatory Engine's activation
      gate answers "has counsel reviewed this state's disclosure module". That is a
      different question from "may Burkham operate here at all", and a state can pass the
      first while the second is untouched. An agent must not read `active` as answering
      this entry. See notes.

    escalation_trigger: >-
      1. When output characterises Burkham as a broker, loan broker or credit broker.
      Refuse; rewrite to the approved characterisation.

      2. When any feature, workflow or arrangement is proposed that would put Burkham in
      position to receive, hold, escrow or disburse client capital. Compliance Review
      Board immediately. This is a structural change requiring re-analysis of the entire
      perimeter, not a product decision — and it is the trigger that matters most,
      because discipline 1 currently holds only because nothing implements the capability.

      3. When an agent's contact with a lender moves from clarification and advocacy into
      term negotiation. Route for a determination on whether it crosses the line in that
      client's state.

      4. When a client is in a state whose broker treatment has not been counsel-reviewed.
      No service.

      5. When the client requests something that would be brokerage in their state — term
      negotiation, lender-side representation. Compliance Review Board decides whether it
      can be accommodated within the structural disciplines or must be refused.

      6. When any compensation change is proposed that introduces lender-side economics.
      Compliance Review Board immediately; it changes the analysis fundamentally.

      7. When any regulatory inquiry touches broker status — a state regulator question, a
      complaint alleging unlicensed brokerage. Compliance Review Board and outside
      counsel. Do not respond without counsel.

      8. When an external source characterises Burkham as a broker — trade press, an
      industry directory, a partner's own marketing. Third-party characterisation creates
      exposure regardless of Burkham's own language. Review whether correction is
      required.

    depends_on:
      - per-state broker treatment analysis by outside counsel, one of four findings per state
      - a broker-treatment field on the Regulatory Engine state module, distinct from activation status
      - a second gate refusing service in a state whose broker treatment is unrecorded
      - engagement and fee documentation stating compensation is for facilitation
      - scanner detection of term-negotiation language in lender-facing agent contact

    citation: "Cal. Fin. Code Div. 9 (CFL); N.Y. Banking Law art. 12-D; Fla. Stat. ch. 494; state commercial loan broker statutes generally"

    claim_provenance:
      - claim: "State broker licensure reaches compensation for arranging credit"
        tag: sourced
        source: "Cal. Fin. Code Div. 9; N.Y. Banking Law art. 12-D; Fla. Stat. ch. 494"
      - claim: "California and Florida modules already flag broker conduct for counsel"
        tag: sourced
        source: "packages/regulatory/src/seed.ts — CA summary 'Broker conduct and compensation disclosure require counsel attention', ca_broker_compensation and fl_broker_conduct disclosures"
      - claim: "Burkham charges a success fee contingent on placement"
        tag: sourced
        source: "packages/billing/src/engagements.ts successFeeBasisPoints"
      - claim: "'We are not a lender' answers the wrong question"
        tag: reconstructed
        basis: "shaped from the licensure definitions above; the specs' locked language is the lender claim and no source makes this distinction"
      - claim: "Four structural disciplines support the facilitator position"
        tag: proposed
        review_by: "outside counsel — the entry states the specs do not address broker licensure at all"
      - claim: "Nothing models client capital or lender-side compensation"
        tag: sourced
        source: "no escrow, disbursement or custody anywhere in the Console; feeModel on an offering is the lender's charge to the client; partner payouts run outward"
      - claim: "Four findings per state, and no service until one is on record"
        tag: proposed
        review_by: "outside counsel and both founders — a second gate that does not exist; ActivationStatus certifies the disclosure module only"
      - claim: "Term negotiation is the licensed activity in several states"
        tag: reconstructed
        basis: "shaped from the broker statutes cited; the clarification-versus-negotiation line is the entry's own and the entry flags it as needing tightening"

    status: draft_pending_claim_library_approval

    notes: >-
      MATERIAL RISK TO LAUNCH SCOPE. If several priority states require broker
      registration and Burkham does not register, it cannot operate there. California
      alone is the largest small business market in the country. The national footprint
      positioning may need revising, and that is a founder decision informed by counsel
      findings rather than a compliance detail.

      THREE OPTIONS PER STATE, and they need not be the same everywhere. Register. Avoid.
      Or structure the activity to fall outside the definition — which is achievable in
      many states through the four disciplines above, and may not be achievable in all.

      GAP — current specs do not address broker licensure. The locked language is "we are
      not a lender", which sidesteps rather than answers. Three of the four structural
      disciplines already hold in practice; the third — no term negotiation — needs
      tightening, because the line between advocating for approval and negotiating terms
      is fuzzy in operation and some state definitions reach both.

      OPEN — per-state findings. NV, CA, NY, TX, FL, AZ and UT all need the four-way
      determination. CA, NY and FL are likely to reach this activity; NV, TX, AZ and UT
      are unknown. This is state law expertise and cannot be answered internally.

      OPEN — scanner rules for term-negotiation language. Trigger 3 needs detection that
      does not exist. Compliance & Evidence to draft. Note that nothing in the Console
      models lender contact at all, so there is no channel to scan yet either.

      NOTED — the success fee is the sharpest exposure and it is central to the pricing
      model. If a state's definition reaches contingent compensation for arranging credit,
      restructuring the fee is not a small change. Worth knowing before counsel findings
      arrive rather than after. It is modelled as `successFeeBasisPoints` on the
      engagement record, so the exposure is concrete rather than notional.

      RAISED BY REVIEW — the Regulatory Engine already knows broker conduct is live in two
      priority states, and has flagged it for counsel in its own words. California's
      module summary says "Broker conduct and compensation disclosure require counsel
      attention", and carries a `ca_broker_compensation` disclosure keyed to SB 1235's
      broker provisions and Fin. Code §22800. Florida's says the state "regulates broker
      conduct in connection with" covered transactions, and carries `fl_broker_conduct`.

      So this is not a question nobody has raised — it is one the seeded modules raised
      and nothing has answered. Both are still drafts and neither state is activated.

      RAISED BY REVIEW — and this is the structural point. The existing activation gate
      CANNOT enforce trigger 4. `ActivationStatus` is `no_module | draft |
      needs_counsel_review | active | withdrawn`, and `activateState` requires a counsel
      document reference plus a Level 3 human. What it certifies is that counsel reviewed
      the DISCLOSURE MODULE. Nothing in it records a licensure determination, and
      `SeedState` has no field for one — a module carries a state, a summary, citations,
      disclosures and marketing notes.

      A state could therefore reach `active`, `permitsClientFacingAction` could return
      true, and the broker question would remain entirely unexamined. Reusing that flag
      for this entry would be the same defect as an activated module with no disclosures:
      a control reporting a pass on a question it never asked.

      So this entry needs a SECOND determination stored alongside the first, and the
      depends_on names it. The four findings map onto a field, not onto the existing
      status enum — "registration required" and "not activatable" are both compatible
      with a reviewed disclosure module, and neither is expressible today.

      RAISED BY REVIEW — disciplines 1 and 2 hold structurally, which is stronger than
      policy and weaker than enforcement. There is no escrow, disbursement, custody or
      client-funds model anywhere in the Console, and no model for compensation flowing
      from a lender to Burkham. `feeModel` on an offering is what the LENDER charges the
      CLIENT; partner payouts run outward under versioned agreements. Both disciplines
      are currently unbreakable because the capability is absent — and both would be
      broken by a feature nobody flagged as a compliance change. That is precisely
      trigger 2's job, and it is worth the entry saying which disciplines depend on it.
