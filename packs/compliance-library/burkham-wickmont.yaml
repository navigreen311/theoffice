  - entry_ref: compliance/fair-treatment-in-routing-v1
    framework: ECOA
    jurisdiction: [FEDERAL]
    runtime_flag: fair_treatment_required

    applicability_rule: >-
      Any decision affecting which lenders a client is shown, whether a client is
      served, and what client information enters a structured record or an automated
      decision. Covers Recommendation Engine output, Lender Intelligence Database
      pattern formation, intake and disengagement decisions, and the handling of
      protected class information a client volunteers.

      Burkham does not lend, so it issues no adverse action notices. It does decide
      which lenders a client sees and whether to serve them at all, and those are
      decisions about access to credit facilitation.

    agent_behavior_implication: >-
      VOLUNTEERED PROTECTED CLASS INFORMATION — acknowledge, never record, never use.

      A client mentions on a call that they are a veteran, that they are 68 and thinking
      about succession, that English is not their first language. Nobody asked. The
      rules:

      - the call recording captures it — that is a factual record of a conversation

      - the STRUCTURED RECORD does not. No tag, no field, no searchable attribute

      - the Recommendation Engine never sees it, because it is not in the input stream

      - call summarisation redacts protected class references from structured output

      - it does not reach a lender packet unless the client authorises it per application

      A human handler may respond conversationally. Congratulating someone on their
      service is not a decision input.

      PROGRAMS FOR PROTECTED CLASSES — the client self-identifies; Burkham never infers.

      Veteran-preference SBA products, minority and women-owned programs, rural programs
      — these exist because legislatures created them to widen access. Surfacing one to
      an eligible client is not discrimination. But inferring eligibility from something
      said on a call is Burkham deciding which protected class benefits apply to which
      clients on the basis of informal disclosure, and that is using the information
      however benign the intent.

      The clean pattern: agents surface the EXISTENCE of these program categories to
      every client — "some programs have specific eligibility categories including
      veteran-owned, minority-owned, women-owned, or geographic; if any apply we can
      identify what you may be eligible for." The client then self-identifies through the
      per-application authorisation, deliberately and on the record.

      THE RECOMMENDATION ENGINE'S INPUTS ARE ENUMERATED AND FIXED. What the eligibility
      check reads today, exactly: requested amount against the offering's minimum and
      maximum, time in business in months, annual revenue, personal credit score,
      industry label matched against the offering's excluded industries, and the states
      the offering serves. Suitability and governance standing are separate stages with
      their own inputs.

      Any addition requires Compliance Review Board approval with disparate impact
      analysis first. No silent expansion.

      PROXY DISCRIMINATION IS THE REAL RISK, AND IT NEEDS NO PROTECTED FIELD.

      The Lender Intelligence Database exists to learn which lenders approve which
      profiles. If a lender's own approval history embeds discrimination — which is the
      premise of every fair lending statute — the Database learns that pattern and the
      Engine routes accordingly:

      - zip code correlates with race in most American cities

      - industry classification correlates with owner demographics

      - time in business correlates with owner age

      - banking patterns visible in cash flow correlate with demographics

      Each routing decision looks defensible alone. The disparity is only visible in
      aggregate, measured against characteristics Burkham deliberately does not collect.

      ROUTING IS DOCUMENTED PER CLIENT. Every recommendation records which lenders were
      considered, which were excluded, and why — with reasons mapping to lender
      underwriting criteria, never to client attributes that could proxy for a protected
      class. Three lenders shown and four omitted is a decision about that client,
      whether or not they are told.

      DECLINING TO SERVE requires documented client-specific reasons in the Compliance
      Evidence Vault. ECOA requires no notice for this, and it is treated as though it
      did — a service decision that cannot state its reason is a service decision nobody
      can defend.

    escalation_trigger: >-
      1. When output would place volunteered protected class information into a
      structured field or an automated routing decision. Refuse the structural record;
      route for guidance on acknowledging it conversationally without using it as data.

      2. When an expansion of Recommendation Engine inputs is proposed. Compliance Review
      Board, with disparate impact analysis before approval.

      3. When statistical disparity appears in aggregate routing, approval or service
      patterns correlating with a proxy variable. Compliance Review Board with the
      evidence.

      4. When a client is declined without documented client-specific reasons — or with
      reasons that could correlate with a protected class. Human review before the
      decline executes.

      5. When the client asks why particular lenders were or were not included. Route to
      a human for a specific factual answer. No canned response and no refusal to
      explain. Transparency about routing is discipline, not exposure.

      6. When any client communication indicates perceived discrimination — "you're only
      showing me these because of X", "why aren't you helping me like you helped my
      friend". Compliance Review Board immediately. Perception problem, communication
      problem or real pattern; all three need investigating.

      7. When a recommendation references information about the client that cannot be
      traced to a structured source with provenance. Route to Agent QA. Untraceable input
      is how volunteered protected class information leaks into a decision.

    depends_on:
      - disparate impact monitoring over Recommendation Engine output and Lender Intelligence Database patterns
      - Compliance Review Board governance over the Recommendation Engine input list
      - documented reasons on every service decline
      - client-facing explanation of routing rationale
      - fair lending review by outside expertise
      - a decision on whether CapitalForge's Section 1071 demographic capture applies to Burkham

    citation: "15 U.S.C. § 1691 et seq. (ECOA); Regulation B, 12 C.F.R. Part 1002"

    claim_provenance:
      - claim: "ECOA and Regulation B reach decisions about access to credit facilitation"
        tag: sourced
        source: "15 U.S.C. §1691 et seq.; 12 C.F.R. Part 1002"
      - claim: "Burkham issues no adverse action notices because it does not lend"
        tag: reconstructed
        basis: "shaped from the facilitator position; no source states the adverse-action conclusion"
      - claim: "Volunteered protected class information is acknowledged, never recorded, never used"
        tag: reconstructed
        basis: "shaped from ECOA's prohibited-basis structure; the recording-versus-structured-record split is the entry's own"
      - claim: "Clients self-identify for protected class programs; Burkham never infers"
        tag: reconstructed
        basis: "shaped from the same; the surface-the-category-to-everyone pattern is the entry's own solution to the inference problem"
      - claim: "The eligibility check reads amount, time in business, revenue, credit score, industry, states"
        tag: sourced
        source: "packages/lenders/src/eligibility.ts EligibilityCriteria — a typed fixed structure"
      - claim: "Industry is NAICS-derived and is in the decision path"
        tag: sourced
        source: "packages/lenders/src/profile.ts — 'Free-text or NAICS-derived label, matched case-insensitively against exclusions'"
      - claim: "Routing rationale is recorded per client with reasons keyed to underwriting stages"
        tag: sourced
        source: "packages/placement/src/recommend.ts RejectedAlternative — provider, offering, stage, reason"
      - claim: "Nothing computes disparate impact anywhere"
        tag: sourced
        source: "capitalforge fair-lending.service.ts — 415 lines, zero occurrences of 'disparate'; nothing in the Console"
      - claim: "Proxy discrimination needs no protected field"
        tag: reconstructed
        basis: "shaped from fair lending doctrine; the four named correlations are the entry's own analysis"

    status: draft_pending_claim_library_approval

    notes: >-
      NAMED GAP — corrected. The original note said none of the six dependencies exists.
      Four do not. One is built. One is partly built. The correction is in the expensive
      direction: building a thing that already exists costs more than the note saved.

      BUILT — per-client routing rationale. `packages/placement/src/recommend.ts` returns
      `RejectedAlternative` per excluded offering, carrying the provider, the offering,
      the STAGE the rejection happened at (governance, eligibility or suitability) and a
      `reason` written, in its own words, "in the words a memo should use" because "a
      compliance officer cannot tell a sound rejection from a bug and neither can the
      client". The stage field is exactly this entry's requirement that reasons map to
      underwriting criteria rather than to client attributes. It also returns
      `missingProfileFields` — the actionable inverse, "record the entity's revenue and
      four more providers resolve" — which is most of what trigger 5 needs.

      PARTLY BUILT — the enumerated input list. `EligibilityCriteria` is a typed,
      fixed structure, so an addition is a type change rather than a config edit and
      cannot happen silently. What does not exist is the GOVERNANCE around it: nothing
      routes a change through the Compliance Review Board, and nothing requires a
      disparate impact analysis first. The dependency has been narrowed to that.

      The original enumerated list in this entry also over-stated what the Engine reads.
      It named cash flow signals, bureau data, entity structure, revenue, existing debt,
      NAICS and state. The eligibility check actually reads amount, time in business,
      annual revenue, personal credit score, industry label and states served. An entry
      that governs inputs has to name the real ones, so the implication now does.

      Industry IS in the decision path — `excludedIndustries` is matched against a
      "free-text or NAICS-derived label" — so the proxy concern about industry
      classification is live rather than hypothetical.

      NOT BUILT, and the core claim stands. Nothing computes disparate impact anywhere.
      CapitalForge has a 415-line `FairLendingService` whose header lists "fair-lending
      monitoring dashboards" among its responsibilities, and the word "disparate" does
      not appear in it once. What it implements is Section 1071 record capture, adverse
      action reporting in 1071 format, and CFPB reason codes. Record-keeping, not
      disparity analysis.

      So the honest answer to "would proxy discrimination be noticed if it were
      occurring" remains: probably not. Individual recommendations look defensible one
      at a time, the rejection reasons are sound one at a time, and the pattern is only
      visible in aggregate against characteristics not collected.

      RAISED BY REVIEW — a direct tension with CapitalForge, and it needs deciding rather
      than noting. This entry says protected class information is NEVER recorded.
      CapitalForge's `FairLendingRecord` model records `demographicData` deliberately,
      with `isFirewalled` defaulting to true, and activates at a 100-application coverage
      threshold. Burkham's own Pack declares CFPB_1071.

      Both positions are coherent and they are not compatible. Do-not-collect rests on
      Burkham not being a covered financial institution — 1071 attaches at the issuer,
      which is what the Pack's own CFPB_1071 row says. Collect-and-firewall rests on
      Burkham being covered, or becoming covered at volume.

      If Burkham is not covered, CapitalForge's demographic capture must never be reached
      by a Burkham tenant, and that needs enforcing rather than assuming. If Burkham
      becomes covered at 100 applications, this entry's "never record" expires on a
      threshold nobody is watching. Either way the decision belongs to counsel and the
      answer changes what an agent does.

      ACTION — fair lending expertise. Disparate impact monitoring is a discipline that
      CFPB examiners and fair lending consultants practise full-time. It should be
      engaged rather than invented internally. Natural pairing with the third Compliance
      Review Board seat and outside counsel engagement.

      ACTION — public benchmark comparison. Where small business lending data is
      published, compare Burkham's routing and approval patterns to the market baseline.
      A material divergence for clients from particular geographies or industries is the
      first signal available without collecting protected class data.

      OPEN — conversational scripting for volunteered disclosures. The line between a
      handler acknowledging what was said and using it to shape service is genuinely
      soft. If a client mentions veteran status and the handler notes that
      veteran-preference programs exist, information has arguably been used. Compliance &
      Evidence to draft the specific guidance.

      OPEN — how much routing rationale a client sees. `RejectedAlternative.reason` is
      already written to be readable by a client as well as a compliance officer, so the
      question is narrower than it was: not whether an explanation can be produced, but
      whether the full set is shown. Full internal reasoning includes proprietary
      Database patterns. A product and compliance decision together.

