      - claim: "Success fees carry contingent, capped and timed framing every time"
        tag: proposed
        review_by: "Compliance & Evidence for the phrasing, and FOUNDERS for the cap itself — no ceiling exists in the pricing model, so the CAPPED attribute currently has nothing to state"
      - claim: "Success fees are flat on approved and funded capital, not a percentage of limit"
        tag: sourced
        source: "Marketing Plan Intake §4.2 Claims we make, item 8: 'Flat success fees on approved and funded capital, not percentage-of-limit.' Restated in §2 Group C and in §9.5 as the Seek Capital class-action pattern the firm is 'architected specifically to prevent'."
      - claim: "The per-product success fee schedule: $500 card, $5,000 equipment, $7,500 line, $10,000 term, $20,000 SBA, $7,500 factoring, flat per placement"
        tag: proposed
        review_by: "Compliance Review Board. Recorded by the founder on 31 August 2026 in packages/billing/src/successFeeSeed.ts, each figure with the effort that justifies it. Enforced as proposed rather than described as it: successFeeFor refuses a fee the Board has not approved, so nothing can be quoted or billed until it does."
      - claim: "Fees are set by the work a placement takes, not by the capital it places"
        tag: sourced
        source: "Founder decision, 31 August 2026. The reason two tiering proposals were rejected: cards at $300/$750/$1,500 by approved limit, and factoring setup at $1,500-$3,500 by facility size. Sizing a fee by the capital placed is percentage-of-limit pricing in steps. REJECTED_TIERING in successFeeSeed.ts."
      - claim: "Merchant cash advance is not offered, is referred out, and carries no fee"
        tag: proposed
        review_by: "Compliance Review Board. Recorded as the ABSENCE of a schedule row rather than a fee of zero, because a zero says the product is free and no row says it is not priced. A placement of it refuses loudly. See compliance/no-advance-placement-v1."
      - claim: "No testimonials in V1; case studies with consent are permitted"
        tag: sourced
        source: "Founder decision, 31 August 2026, ratifying the DECIDED note in this entry. Rests on the FTC Endorsement Guides' typical-results and substantiation requirements."
      - claim: "An agent applies published pricing logic and never its own judgement"
        tag: reconstructed
        basis: "shaped from the dispute-of-record risk; no source prohibits agent-level discounting"

    status: draft_pending_claim_library_approval

    notes: >-
      DECIDED AND RATIFIED, founder decision 31 August 2026 — no testimonials in V1. Client quotes about their experience are
      persistent FTC enforcement bait: the Endorsement Guides require material
      disclosures, typical-results framing and substantiation for each claim, and the
      typical-results requirement is where comparable firms fail. Case studies with
      affirmative client consent, structured facts, dated outcomes and a
      results-not-typical disclosure are permitted. Testimonials at V1.5, with counsel
      review and per-claim substantiation.

      ACTION — anchor customer consent must be structured before the engagements begin.
      Greenstone EMD and MedLink payroll float will be the first case studies, and a case
      study needs consent captured at the outset, not requested afterwards. Compliance &
      Evidence owns this and it is time-sensitive.

      OPEN — trigger 8 has no implementation. Detecting a statistical claim is a pattern
      problem, not a banned-phrase problem, and the Scanner does phrases. Three routes: a
      Scanner rule, an agent self-catch trained into output discipline, or
      human-review-by-default for any claim containing a number about firm activity. The
      third is crude and works today. NOTE — `detectLenderNumbers` in @bwc/scanner is a
      worked precedent for the first route: number shapes detected in code, gated on
      nearby context terms, feeding the same requiredDisclosures path. A firm-performance
      variant would gate on "clients", "funded", "placements", "approval" rather than on
      lender terms.

      OPEN — prospective range disclosure. Where a client asks what the full ladder might
      total, the agent needs approved language for illustrative ranges that does not
      become an engagement-specific quote. Compliance & Evidence to draft.

      OPEN — Blueprint deliverable promises depend on the Readiness Score components,
      which are specified nowhere. See the correction below.

      NOTED — this entry deliberately owns no lists. It is the framework the Marketing
      Claim Library applies. Adding phrases here would create a second list, and two
      lists drift.

      OPEN, AND THE MOST SERIOUS THING IN THIS ENTRY — the CAPPED attribute has no cap
      behind it, and the pricing model implements the pattern the firm says it exists to
      prevent.

      Marketing Plan Intake §4.2 Claims we make lists as item 8: "Flat
      success fees on approved and funded capital, not percentage-of-limit." §9.5 Has
      anything already gone wrong gives the reason: firms in this space "have faced
      class-action exposure for
      percentage-of-credit-limit success fees", and Burkham's "flat success-fee schedule"
      is "architected specifically to prevent this pattern".

      `packages/billing/src/seed.ts` prices success fees as `successFeeBasisPoints` — 300
      for Foundation, 350 for Growth — against `approvedCreditLimit`, with its own comment
      reading "3% of the approved credit limit". `successFeeBasis()` returns the limit
      unchanged. Nothing caps it. The fee exhibit renders `successFeeBasisPoints / 100` as
      a percentage. That is percentage-of-credit-limit pricing, uncapped, which is the
      named pattern rather than a distance from it.

      Every seeded offer is labelled DRAFT PRICING, so the likeliest reading is that the
      code is stale rather than that the policy changed. The code is what bills.

      THE UDAAP LINK, raised by review and correct. compliance/client-interest-standard-v1
      names four places the fee structure pulls against the client and records all four as
      held by this entry and human judgement. An uncapped basis-point rate on a large
      placement is the fourth misalignment made concrete: the larger the facility, the
      larger the fee, with no ceiling and no additional work behind the increment. Nothing
      checks it. Firewall rule 2 reaches the firm's supply constraints being passed to a
      client and does not reach this, because this is not about which product was chosen.

      WHAT IS NEEDED, and it is a pricing decision rather than a compliance one: either a
      per-product flat schedule and caps set and recorded, or the flat-fee principle
      withdrawn and the Marketing Plan corrected. The first is what every document says.
      The second is what the code does. An agent cannot state attribute 2 until one of
      them changes.

      RESOLVED — the conflict with the SEEDED library, and this entry was the half that
      changed. As drafted it banned success rates and timeframe averages "regardless of
      accuracy", while `packages/claims/src/seed.ts` seeds `success rate` and `typical`
      as `requires_disclaimer` — both in `REQUIRES_DISCLAIMER`, each with a named
      disclosure. A
      `requires_disclaimer` claim SHIPS with its disclosure attached and a `banned` one
      does not ship, so the two artifacts obliged different behaviour — and the code was
      the one that ran.

      What settled it is that the entry contradicted ITSELF. The classification rule
      directly above permits a firm-scale factual claim about aggregate activity and bans
      the same figure pointed at the reader — "Burkham Wickmont has facilitated over $X"
      against "our clients have received $X". A performance figure divides on exactly that
      line, and the banned-regardless bullet ignored the distinction its own entry had
      just drawn.

      So `success rate` and `typical` stay `requires_disclaimer`, the seed is unchanged,
      and the bullet now bans the POINTED claim rather than the category. The seed's own
      rationale — "5.5 makes one computable for the first time; the disclosure states the
      period it is drawn from and that it does not predict" — is consistent with the entry
      as it now reads, and the entry goes one step further by making computability a
      precondition rather than treating the disclosure as the whole cure.

      FOUNDER DECISION, 31 August 2026.

      NOT COVERED BY THAT DECISION — lender-behaviour speculation and named-competitor
      comparisons are now stated as banned outright, with no firm-scale exception. Neither
      is Burkham's own performance, so the exception's basis — substantiation from the
      firm's own records — cannot reach them. That is reasoning applied to keep the list
      internally consistent rather than a decision that was taken, and it is tagged
      `reconstructed` accordingly.

      Three further requires_disclaimer claims are arguable and left alone: `up to`, `as
      low as` and `projected` all describe LENDER product terms rather than firm
      performance, which puts them under estimate-not-offer rather than here.

      RAISED BY REVIEW — the Section 6.2 reference does not resolve, and the document it
      referred to must be named. In blueprint-v2 — the canonical
      module specification — §6.2 is the Funding Ethics Firewall. If the intended source
      is the marketing plan or another document, cite it as "marketing plan §6.2" rather
      than a bare section number: this venture now has at least two documents with a §6.2
      and they are different things.

      THE READINESS SCORE IS SPECIFIED NOWHERE. Searched across both reference documents,
      1,807 lines. It appears three times and none is a specification: "readiness score
      changed" as an Event Ledger event type (blueprint §11.3); "Funding Readiness Score
      generated (provenance on each component)" as one line in a flow diagram; and
      "Funding Readiness Score improvement (Phase 0 clients)" as a KPI in specifications
      §12. There is no module section, no component list, and the phrase "eight
      components" appears in no document.

      The flow diagram's "provenance on each component" is the only evidence that
      components exist at all. So the dependency is real, the section number is not, and
      the eight components are an intention rather than a specification — see the
      standing note on unspecified controls at the head of this file.

      RAISED BY REVIEW — trigger 3's mechanism exists. `@bwc/billing/exhibit.ts` assembles
      the fee exhibit from the engagement record and already carries the rule that a
      repricing must not change what an existing client's exhibit says they agreed to pay.
      Baseline pricing is data rather than code, which is correct — $497/$997 live in
      offers, not in a constant.

