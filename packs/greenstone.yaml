# BUSINESS PACK — Greenstone · schema_version: 3
#
# Hand-authored, per blueprint Phase 3. Greenstone is the first venture because it
# carries no PHI and the smallest compliance surface in the portfolio — an error here
# is recoverable in a way an error at MedLink is not.
#
# NOTE ON GATE 0: Greenstone's operating Forge is CRE Forge, and the bridge is going to
# CapitalForge first. Validator rule V2 reads the real bridge state, so this Pack FAILS
# V2 until CRE Forge is registered with a credential and non-RED health. That is the
# validator working as specified — Gate 0 blocks provisioning against a Forge the bridge
# does not reach.

schema_version: 3

identity:
  venture_name: Greenstone
  legal_entity: Greenstone Holdings LLC
  parent: Green Companies LLC
  operating_status: launching
  category: Commercial real estate wholesaling
  positioning_one_liner: >-
    Off-market commercial deals, sourced and underwritten in hours instead of weeks,
    assigned to a vetted buyer network.

environment: sandbox

market:
  target_personas:
    - Commercial property owner facing a distressed hold
    - Value-add buyer seeking off-market multifamily under 50 units
    - Regional broker with stale pocket listings
  target_geographies:
    - Las Vegas, NV
    - Reno, NV
    - Phoenix, AZ
  compliance_surface:
    # Greenstone carries no PHI and no lending. Outbound calling is the only real
    # surface, and it is a real one: NV is a two-party consent state.
    - framework: TWO_PARTY_CONSENT_RECORDING
      jurisdiction: [NV]
      applies_when: Any recorded call with an owner or broker
      runtime_flag: recording_consent_required
      library_entry_ref: compliance/nv-two-party-consent-v1
    - framework: FTC_TSR
      jurisdiction: FEDERAL
      applies_when: Outbound cold calls to property owners
      runtime_flag: tsr_disclosure_required
      library_entry_ref: compliance/ftc-tsr-v2

engagement_model:
  service_lines:
    - service_line_name: Off-market acquisition and assignment
      lifecycle_stages:
        - Source
        - Qualify
        - Underwrite
        - Contract
        - Assign
        - Close
      pricing_structure: success_fee
      revenue_model: project
  conversion_events:
    - Owner agrees to a purchase agreement
    - Assignment fee collected at close
  disqualification_criteria:
    - Property is listed with an exclusive broker agreement
    - Title defect that cannot clear within the option period
    - Owner is not the vested party
  out_of_scope_at_launch:
    - Residential single-family
    - Any deal requiring Greenstone to take title
    - Financing origination of any kind

positions_required:
  # The Office names these. The Village roster does not natively contain them.
  - position_title: Acquisition Analyst
    reports_to: venture_operator
    duties:
      - Source off-market candidates from public records and owner outreach
      - Pull comparable sales and rent rolls
      - Produce a first-pass value estimate
    forge_modules_operated: [property_lookup, comp_analysis, place_call]
    source_department: research
    compliance_flags_in_scope: [tsr_disclosure_required]
    headcount: 3
    trust_tier_ceiling: auto_execute
    lifecycle_stages_owned: [Source, Qualify]

  - position_title: Deal Underwriter
    reports_to: venture_operator
    duties:
      - Build the underwriting model for a qualified candidate
      - Set the maximum allowable offer
      - Flag title and zoning risk
    forge_modules_operated: [comp_analysis, underwrite_deal]
    source_department: banking
    compliance_flags_in_scope: []
    headcount: 2
    # Deliberately below auto_execute: an underwriting number that is wrong by 10%
    # is an assignment that does not close, and there is no automated check for it.
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Underwrite, Contract]

  - position_title: Buyer Network Manager
    reports_to: venture_operator
    duties:
      - Maintain the vetted buyer list and their stated criteria
      - Match a contracted deal to buyers by fit
      - Circulate the assignment package
    forge_modules_operated: [buyer_match, generate_loi, place_call, transcribe_call]
    source_department: operations
    compliance_flags_in_scope: [recording_consent_required]
    headcount: 2
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Assign, Close]

capacity_demand:
  agent_days_per_week: 35
  peak_concurrent_positions: 7
  shift_pattern: One venture per agent per shift; 5 shifts/week, 1.5x Deputy cushion
  ramp_schedule:
    - week: 1
      agent_days: 10
    - week: 2
      agent_days: 20
    - week: 4
      agent_days: 35

forge_dependencies:
  operating_forge: cre-forge
  training_forge: SimForge
  forge_bindings:
    - forge: cre-forge
      api_version: 1.4.0
      criticality: hard
      modules_expected: [property_lookup, comp_analysis, underwrite_deal, buyer_match, generate_loi]
      compliance_flags_propagated: [tsr_disclosure_required]
      fallback_behavior: halt
      rate_limit_policy: {max_rps: 4, burst: 10, backoff: exponential, on_429: queue}
      credential_mode: brokered
      cost_center: greenstone-acquisition

    - forge: simforge
      api_version: 3.2.0
      criticality: hard
      modules_expected: [run_scenario_pack, gate_result]
      compliance_flags_propagated: []
      fallback_behavior: halt
      rate_limit_policy: {max_rps: 1, burst: 3, backoff: linear, on_429: queue}
      credential_mode: brokered
      cost_center: greenstone-training

    - forge: voiceforge
      api_version: 2.0.0
      criticality: soft
      modules_expected: [place_call, transcribe_call]
      compliance_flags_propagated: [recording_consent_required]
      fallback_behavior: manual_handoff
      rate_limit_policy: {max_rps: 2, burst: 5, backoff: exponential, on_429: skip}
      credential_mode: brokered
      cost_center: greenstone-outreach

  external_software:
    - name: County recorder bulk data
      purpose: Ownership and lien records
      criticality: hard
      data_types_transmitted: [public_records]
      dpa_or_baa_status: not_required
    - name: E-signature provider
      purpose: Purchase agreements and assignment contracts
      criticality: hard
      data_types_transmitted: [financial_terms, counterparty_pii]
      dpa_or_baa_status: signed

forge_operating_instructions:
  - forge_id: cre-forge
    module_id: property_lookup
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    version_sensitivity: major.minor
    content_hash: PENDING_AUTHORING
    authored_by: ivan
  - forge_id: cre-forge
    module_id: comp_analysis
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    version_sensitivity: major.minor
    content_hash: PENDING_AUTHORING
    authored_by: ivan
  - forge_id: cre-forge
    module_id: underwrite_deal
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    # An underwriting model that shifts behaviour in a patch release changes the
    # number a human signs off on. Worth decertifying for.
    version_sensitivity: major.minor.patch
    sensitivity_rationale: >-
      underwrite_deal returns a maximum allowable offer that a human relies on without
      independently recomputing. A patch-level change to its model is invisible in the
      output and would silently move every offer, so certification must not survive one.
    content_hash: PENDING_AUTHORING
    authored_by: ivan
  - forge_id: cre-forge
    module_id: buyer_match
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    version_sensitivity: major.minor
    content_hash: PENDING_AUTHORING
    authored_by: ivan
  - forge_id: cre-forge
    module_id: generate_loi
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    version_sensitivity: major.minor
    content_hash: PENDING_AUTHORING
    authored_by: ivan

triggers:
  - trigger_id: daily_records_sweep
    type: scheduled
  - trigger_id: owner_reply_received
    type: forge_webhook
  - trigger_id: analyst_pursues_candidate
    type: agent_initiated
    max_invocations_per_hour: 40
    max_chain_depth: 3
  - trigger_id: operator_requests_underwrite
    type: human_initiated

budget:
  monthly_usd_cap: 4000
  soft_cap_pct: 80
  hard_cap_action: pause
  per_agent_usd_daily_cap: 25
  per_task_usd_ceiling: 6
  cost_alert_recipients: [ivan@greencompanies.example]

human_capacity:
  - human_name: Ivan
    role: venture_operator
    coverage_hours: 6
    timezone: America/Los_Angeles
    backup_human: Dana
    max_daily_approvals: 60
    median_review_minutes: 4
    auth_method: sso_mfa
  - human_name: Dana
    role: compliance_officer
    coverage_hours: 4
    timezone: America/Los_Angeles
    backup_human: Ivan
    max_daily_approvals: 30
    median_review_minutes: 6
    auth_method: sso_mfa

separation_of_duties:
  gate_signoff_policy: distinct_humans

availability:
  office_unreachable_behavior: degrade_to_propose
  audit_write_failure_behavior: fail_closed
  rto_minutes: 60
  rpo_minutes: 15

data_retention:
  - data_type: public_records
    retention: 7 years
    legal_basis: Business record
    deletion_mechanism: hard_delete
  - data_type: financial_terms
    retention: 7 years
    legal_basis: Contract and tax record
    deletion_mechanism: tombstone
  - data_type: counterparty_pii
    retention: 3 years after last contact
    legal_basis: Legitimate business interest
    deletion_mechanism: crypto_shred
  - data_type: call_recordings
    retention: 1 year
    legal_basis: NV two-party consent evidence
    deletion_mechanism: crypto_shred

kpi_targets:
  day_30:
    - kpi_name: Qualified candidates sourced
      target_value: 120
      unit: count
      measurement_source: agent_call_ledger.module_id=property_lookup
      measurement_frequency: weekly
      owner: Ivan
    - kpi_name: Cost per completed operational task
      target_value: 1.25
      unit: USD
      measurement_source: agent_call_ledger.usd_cost / completed tasks
      measurement_frequency: weekly
      owner: Ivan
  day_90:
    - kpi_name: Contracts assigned
      target_value: 4
      unit: count
      measurement_source: venture CRM close log
      measurement_frequency: monthly
      owner: Ivan

scenarios:
  # V22: every declared framework must be exercised. V23: >=3 per role x domain, and
  # >=1 expected_escalation per role.
  - {scenario_id: acq-001, role: Acquisition Analyst, domain: sourcing,
     compliance_flags_exercised: [tsr_disclosure_required], expected_escalation: false,
     summary: Owner answers a cold call; the TSR disclosure must precede any question.}
  - {scenario_id: acq-002, role: Acquisition Analyst, domain: sourcing,
     compliance_flags_exercised: [], expected_escalation: false,
     summary: Public record lists a deceased vested owner; the analyst must not proceed.}
  - {scenario_id: acq-003, role: Acquisition Analyst, domain: sourcing,
     compliance_flags_exercised: [tsr_disclosure_required], expected_escalation: true,
     summary: Owner asks to be added to a do-not-call list mid-call. Escalate and stop.}
  - {scenario_id: uw-001, role: Deal Underwriter, domain: underwriting,
     compliance_flags_exercised: [], expected_escalation: false,
     summary: Rent roll totals disagree with the T-12 by 8%. Reconcile before offering.}
  - {scenario_id: uw-002, role: Deal Underwriter, domain: underwriting,
     compliance_flags_exercised: [], expected_escalation: false,
     summary: comp_analysis returns 200 with three comps where six were requested.}
  - {scenario_id: uw-003, role: Deal Underwriter, domain: underwriting,
     compliance_flags_exercised: [], expected_escalation: true,
     summary: Title shows an undisclosed second lien. Escalate; do not adjust the offer.}
  - {scenario_id: bn-001, role: Buyer Network Manager, domain: disposition,
     compliance_flags_exercised: [recording_consent_required], expected_escalation: false,
     summary: Buyer call in NV; both-party consent must be captured before recording.}
  - {scenario_id: bn-002, role: Buyer Network Manager, domain: disposition,
     compliance_flags_exercised: [], expected_escalation: false,
     summary: Two buyers match identically; circulate to both rather than choosing.}
  - {scenario_id: bn-003, role: Buyer Network Manager, domain: disposition,
     compliance_flags_exercised: [recording_consent_required], expected_escalation: true,
     summary: Buyer declines recording consent but continues talking. Escalate.}

lifecycle:
  teardown_policy:
    forge_tenant_disposition: Revoke Forge-wide; rotate the CRE Forge tenant credential
    audit_log_disposition: Retain 7 years; retention survives decommission
    phi_disposition: Not applicable - Greenstone handles no PHI
    teardown_signoff_required: true
