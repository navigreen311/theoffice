# BUSINESS PACK — Greenstone · schema_version: 3
#
# Hand-authored, per blueprint Phase 3. Greenstone is the first venture because it
# carries no PHI and the smallest compliance surface in the portfolio — an error here
# is recoverable in a way an error at MedLink is not.
#
# NOTE ON GATE 0: Greenstone's operating Forge is CRE Forge, and the bridge is going to
# CapitalForge first. Validator rule V2 reads the real bridge state, so this Pack FAILS
# V2 until CRE Forge is registered with a credential and non-RED health. That is the
# validator working as specified — Gate 0 blocks provisioning against a Forge the bridge
# does not reach.

schema_version: 3

identity:
  venture_name: Greenstone
  legal_entity: Greenstone Holdings LLC
  parent: Green Companies LLC
  operating_status: launching
  category: Commercial real estate wholesaling
  positioning_one_liner: >-
    Off-market commercial deals, sourced and underwritten in hours instead of weeks,
    assigned to a vetted buyer network.

environment: sandbox

market:
  target_personas:
    - Commercial property owner facing a distressed hold
    - Value-add buyer seeking off-market multifamily under 50 units
    - Regional broker with stale pocket listings
  target_geographies:
    - Las Vegas, NV
    - Reno, NV
    - Phoenix, AZ
  compliance_surface:
    # Greenstone carries no PHI and no lending. Outbound calling is the only real
    # surface, and it is a real one: NV is a two-party consent state.
    - framework: TWO_PARTY_CONSENT_RECORDING
      jurisdiction: [NV]
      applies_when: Any recorded call with an owner or broker
      runtime_flag: recording_consent_required
      library_entry_ref: compliance/nv-two-party-consent-v1
      # FOUNDER-HELD. No agent of this venture can place or record a call.
      human_held:
        why: >
          No position here holds a duty that touches a recorded call, and no agent could.
          `voiceforge/place_call` is forbidden in forge_module_exclusion behind a live
          BEFORE INSERT trigger, under a founder decision binding every venture: no agent
          may initiate an outbound phone call as principal. The VoiceForge binding left
          this Pack entirely on 2026-09-15, there are zero call grants, and Buyer Network
          Manager operates buyer_match and assign_contract - neither of which calls
          anybody. If a call with an owner or broker is recorded, a human makes it, and
          the duty to capture consent belongs to whoever is on the call. Writing a
          scenario would mean teaching an agent to perform an act no position authorizes.
    - framework: FTC_TSR
      jurisdiction: FEDERAL
      applies_when: Outbound cold calls to property owners
      runtime_flag: tsr_disclosure_required
      library_entry_ref: compliance/ftc-tsr-v2
      # FOUNDER-HELD, AND NOT YET DUE.
      human_held:
        why: >
          A telemarketing-disclosure duty attaches to outbound cold calls, and this
          venture has no position that makes one. Acquisition Analyst sources from public
          records and pulls comps; it operates property_lookup and comp_analysis, and CRE
          Forge's own code confirms neither contacts an owner - property_lookup is a
          paginated search over this tenant's properties and never loads the owner rows one
          join away. The flag sat on that position because a test fixture wrote one flag
          list per Forge onto every module of it (entry 105), not because anybody read a
          module.
        pending_activation:
          activates_when: >
            A Seller Outreach position is declared in this Pack - a position whose duties
            include contacting property owners directly. Until one exists, no agent of this
            venture places an outbound cold call, so the TSR has nothing to attach to.
          deferred_to: >
            The founders, at the point the Seller Outreach position is declared. Whoever
            declares it owns the disclosure script and the discharge that covers it.

engagement_model:
  service_lines:
    - service_line_name: Off-market acquisition and assignment
      lifecycle_stages:
        - Source
        - Qualify
        - Underwrite
        - Contract
        - Assign
        - Close
      pricing_structure: success_fee
      revenue_model: project
  conversion_events:
    - Owner agrees to a purchase agreement
    - Assignment fee collected at close
  disqualification_criteria:
    - Property is listed with an exclusive broker agreement
    - Title defect that cannot clear within the option period
    - Owner is not the vested party
  out_of_scope_at_launch:
    - Residential single-family
    - Any deal requiring Greenstone to take title
    - Financing origination of any kind

positions_required:
  # The Office names these. The Village roster does not natively contain them.
  - position_title: Acquisition Analyst
    reports_to: venture_operator
    duties:
      - Source off-market candidates from public records and owner outreach
      - Pull comparable sales and rent rolls
      - Produce a first-pass value estimate
    # `voiceforge/place_call` removed 2026-09-15 (decisions entries 73 and 83). It is
    # FORBIDDEN in forge_module_exclusion by a founder decision binding every venture:
    # no agent may initiate an outbound phone call as principal, whether or not the
    # module works. Declaring it here could never produce a usable grant -
    # runtime_config.apply skips excluded modules and a BEFORE INSERT trigger refuses
    # them anyway. What it did produce was demand: V13 billed human review for a module
    # no agent may ever call.
    forge_modules_operated: [cre-forge/property_lookup, cre-forge/comp_analysis]
    source_department: research
    # `tsr_disclosure_required` moved to market.compliance_surface as human_held with a
    # pending_activation on 2026-09-16 (item F, decisions entry 109). It was never this
    # position's: neither property_lookup nor comp_analysis contacts an owner.
    compliance_flags_in_scope: []
    # ONE SEAT, 2026-09-16. Three was the original guess; the Village now carries exactly
    # one Acquisition Analyst - Victor Serath, retitled from Trend Analyst 2 and moved to
    # report to the Research Director. A headcount of three would leave V24 failing on two
    # seats no agent exists for.
    headcount: 1
    trust_tier_ceiling: auto_execute
    lifecycle_stages_owned: [Source, Qualify]
    # One step per module, in the stage it runs in. The generator used to emit the cross
    # product - both modules in both stages - and the projection billed for each.
    module_stages:
      cre-forge/property_lookup: Source
      cre-forge/comp_analysis: Qualify
    # No expected_weekly_volume: every module here is auto_execute, so none of it reaches
    # a reviewer and a rate would multiply by zero. Lowering either tier makes a volume
    # newly required, and V13 names the module.

  - position_title: Deal Underwriter
    reports_to: venture_operator
    duties:
      - Build the underwriting model for a qualified candidate
      - Set the maximum allowable offer
      - Flag title and zoning risk
    forge_modules_operated: [cre-forge/comp_analysis, cre-forge/underwrite_deal]
    source_department: banking
    compliance_flags_in_scope: []
    headcount: 2
    # Deliberately below auto_execute: an underwriting number that is wrong by 10%
    # is an assignment that does not close, and there is no automated check for it.
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Underwrite, Contract]
    # Both modules are underwriting work, so both run in Underwrite.
    #
    # CONTRACT HAS NO MODULE STEP, AND THAT IS A GAP RATHER THAN AN ERROR.
    # LOI and PSA work has no module on any Forge. In V1 Ivan Green and Ira Green do it by
    # hand. The stage stays owned and declared so the absence is visible; a stage quietly
    # dropped would read as work nobody does.
    module_stages:
      cre-forge/comp_analysis: Underwrite
      cre-forge/underwrite_deal: Underwrite
    # DECLARED, UNFILLED, PENDING ACTIVATION.
    #
    # No expected_weekly_volume, because a pending position adds no agent demand. The
    # underwriting hours are real and they are Ivan's - they are declared as `other_hours`
    # in human_capacity below, not as an approval queue.
    pending_activation:
      activates_when: >
        Ivan Green and Ira Green have written 10-20 real MAOs and the pattern is
        extractable into an operating instruction a Village agent can be certified
        against.
      deferred_to: >
        Ivan Green and Ira Green underwrite V1 directly. Burkham underwrites capital
        placement and Greenstone underwrites CRE - comps, cap rates, CapEx-adjusted MAO -
        so this is not shared with Burkham, and it is specialist work rather than
        management, so it is not staffed with managers. This text is prose and is checked
        against no account; if it should ever be, that comes after the rename.

  - position_title: Buyer Network Manager
    reports_to: venture_operator
    # DECIDED 2026-09-06, after four days with the duty deliberately unbacked.
    #
    # The question asked on 2026-09-02 was whether this role still circulates an
    # assignment package, and through what, once `generate_loi` was removed for not
    # existing. The duties were left as written rather than quietly narrowed so the
    # answer would be a ruling and not a side effect.
    #
    # The answer: the duty stands, and the Pack had asked for the wrong module name
    # for work CRE Forge could already do. Its own assignment template settles it -
    # assignor is the company, assignee is the end buyer, and `assignment_fee` is
    # the wholesaler's spread. That is an assignment contract, which is what
    # "circulate the assignment package" means; a letter of intent is a different
    # document and CRE Forge never had one.
    #
    # `assign_contract` binds that capability. It writes and sends for signature,
    # so it is declared is_mutating with at_most_once idempotency at the adapter's
    # binding site.
    duties:
      - Maintain the vetted buyer list and their stated criteria
      - Match a contracted deal to buyers by fit
      - Circulate the assignment package
    # `voiceforge/place_call` removed 2026-09-15 - forbidden, as above.
    # `voiceforge/transcribe_call` removed 2026-09-15 with the whole VoiceForge binding
    # (decisions entry 87). Not on the founder decision - it permits transcription - but
    # because nothing serves it: no Office adapter, a registry row at example.invalid, no
    # credential that resolves, no manual anywhere. `recording_consent_required` stays in
    # scope below: the duty to capture consent on a recorded call belongs to whoever is
    # on the call, and it does not leave with the Forge.
    forge_modules_operated: [cre-forge/buyer_match, cre-forge/assign_contract]
    source_department: operations
    # `recording_consent_required` moved to market.compliance_surface as human_held on
    # 2026-09-16 (item F). Neither buyer_match nor assign_contract calls anybody, and no
    # agent of this venture can place or record a call at all.
    #
    # THIS POSITION NOW CARRIES NO FLAG, AND assign_contract STILL ROUTES TO THE
    # COMPLIANCE OFFICER - because module_reviewer_roles below says so. Before that
    # declaration existed, this edit moved the approval to the venture operator silently.
    compliance_flags_in_scope: []
    headcount: 2
    trust_tier_ceiling: propose
    lifecycle_stages_owned: [Assign, Close]
    module_stages:
      cre-forge/buyer_match: Assign
      cre-forge/assign_contract: Close
    # RULED 2026-09-16 by Ivan: buyer_match runs at auto_execute.
    #
    # It is non-mutating and the specification requires no human on it. Read from the
    # Forge: it ranks buyers with `save_matches=False`, and filtering a suppression list
    # is not contact. Its volume therefore reaches no reviewer and none is declared.
    module_trust_tiers:
      cre-forge/buyer_match: auto_execute
    # WHO REVIEWS assign_contract, SAID RATHER THAN INHERITED.
    #
    # It routes to the compliance officer today only because this position happens to carry
    # `recording_consent_required`. When that flag becomes founder-held and leaves the
    # position, the approval lands on the venture operator - Ivan, who usually wrote the
    # MAO - and nothing fails. Measured: {compliance_officer: 0.2} becomes
    # {venture_operator: 0.2}.
    #
    # Declaring it holds the routing across that edit. Decisions entry 108, ruling 4.
    module_reviewer_roles:
      cre-forge/assign_contract:
        role: compliance_officer
        why: >
          Separation of duties, not a compliance flag. Ivan Green usually writes the MAO
          for a deal, and the author of an MAO may not approve that deal's assignment, so
          the approval is Ira Green's as compliance officer. This routing must survive
          `recording_consent_required` moving off this position, which is why it is stated
          here rather than left to follow from the flags.
    # ONE CLOSED ASSIGNMENT A WEEK, WHICH IS IVAN'S FIGURE AND THE ONLY ONE HERE.
    #
    # `assign_contract` is the module that runs once per closing, so the venture's closing
    # rate is its rate directly, with no funnel ratio in between. Every other figure that
    # was offered for this Pack - buyer-match runs per deal, an MAO cycle time - was an
    # assumption made while planning and was withdrawn. None of them is in this file.
    expected_weekly_volume:
      cre-forge/assign_contract: 1
    volume_provenance:
      basis: declared
      established_by: Ivan Green
      detail: >
        About one closed assignment a week on average, ramping to two a week by Month 12,
        with 5-10 active deals and 4-8 in-flight MAOs. The closing rate is declared here
        because assign_contract runs once per closing. The Month 12 figure is 2 and is NOT
        declared yet: this Pack states today's rate, and raising it is an edit somebody
        makes deliberately rather than a ramp the validator applies on a date.

capacity_demand:
  # The divisor that turns every expected_weekly_volume into a daily rate.
  #
  # DECLARED BY IVAN, 2026-09-16 (decisions entry 108). Greenstone operates Monday to
  # Friday in Phase 1, on four reasons that are about the business and not about a Pack:
  #
  #   counterparties   sellers, brokers, buyers, escrow, title, comps and POF vendors all
  #                    work business days
  #   money            banks do not wire on weekends
  #   founder time     budgeted for five-day weeks - Ivan 8h x 5, Ira Green 6h x 5
  #   the SLAs         the specifications' SLAs are business-hour SLAs
  #
  # **This was transcribed from `shift_pattern` for one commit and that was the wrong
  # source**, even though it gave the same number. `shift_pattern` describes how agent
  # shifts are arranged; this says which days the venture trades. Two facts that happen to
  # agree are still two facts, and a divisor sourced from the one that does not mean it
  # would have gone on meaning nothing the day they diverged.
  #
  # Nothing in the schema supplied a divisor before this field: `agent_days_per_week`
  # below is agent-days summed across the venture, not a calendar week, and Gate 2's V13
  # divided it by a hardcoded 7.0.
  #
  # WEEKEND WORK EXISTS AND IS NOT CAPACITY. Three declared exceptions - walker safety
  # events, wire fraud indicators, and kill-state deal viability transitions - are handled
  # when they happen and are never counted here. Everything else waits for Monday. A
  # divisor of 7 would have bought reviewer capacity on days nobody is reviewing.
  operating_days_per_week: 5
  agent_days_per_week: 35
  peak_concurrent_positions: 7
  shift_pattern: One venture per agent per shift; 5 shifts/week, 1.5x Deputy cushion
  ramp_schedule:
    - week: 1
      agent_days: 10
    - week: 2
      agent_days: 20
    - week: 4
      agent_days: 35

forge_dependencies:
  operating_forge: cre-forge
  training_forge: SimForge
  forge_bindings:
    - forge: cre-forge
      api_version: 1.4.0
      criticality: hard
      # generate_loi removed 2026-09-02, replaced by assign_contract 2026-09-06.
      #
      # generate_loi could not be granted: CRE Forge does not dispatch it and has
      # nothing behind the name - no LOI service, no route, and no letter-of-intent
      # among its contract templates. It was declared here at criticality:hard, so
      # the Pack asserted the workflow could not run without a module that will
      # never exist. Found by V32 rather than by hand; V6 passed on all five,
      # because five rows had been written.
      #
      # Removing it was correct and left the Assign/Close duty with no module, which
      # no rule would have caught - duties are prose. assign_contract is the module
      # the duty always needed: CRE Forge's assignment template names assignor,
      # assignee and assignment_fee, which is this workflow's closing act.
      modules_expected: [property_lookup, comp_analysis, underwrite_deal, buyer_match, assign_contract]
      compliance_flags_propagated: [tsr_disclosure_required]
      fallback_behavior: halt
      rate_limit_policy: {max_rps: 4, burst: 10, backoff: exponential, on_429: queue}
      credential_mode: brokered
      cost_center: greenstone-acquisition

    - forge: simforge
      api_version: 3.2.0
      criticality: hard
      # run_scenario_pack removed 2026-09-08 (ruling Q-1), on the same reasoning that
      # took it off Burkham: SimForge certifies per module, OperationCert has no
      # pack-level unit for a pack-level verdict to attach to, and the capability was
      # costed and declined rather than found missing. It is not entry 4's kind of
      # removal - there is something behind this name. See docs/decisions.md entry 25,
      # which supersedes entry 5.
      #
      # What this does to Greenstone's V32 is NOT progress, and a reader of the next
      # validator run must not take it for progress. The FAIL was about this name.
      # What is left is NOT_RUN, because nobody can ask voiceforge - which was already
      # true before this edit and was standing behind the FAIL. Nothing was fixed; one
      # obstacle was removed from in front of another. Greenstone's Gate 2 is exactly
      # as far from passing as it was. See docs/blocking.md B19.
      modules_expected: [gate_result]
      compliance_flags_propagated: []
      fallback_behavior: halt
      rate_limit_policy: {max_rps: 1, burst: 3, backoff: linear, on_429: queue}
      credential_mode: brokered
      cost_center: greenstone-training

    # VOICEFORGE BINDING REMOVED 2026-09-15 (decisions entry 87). It bound two modules:
    # `place_call`, which a founder decision forbids (entry 6), and `transcribe_call`,
    # which nothing serves - VoiceForge has no Office adapter, its registry row points at
    # https://example.invalid and its credential ref does not resolve, and no manual for
    # the module exists. V32 could never resolve it, so Gate 2 could never pass with it.
    # What returns it: a VoiceForge that exists, an adapter for it, and a module somebody
    # wants an agent to hold.

  external_software:
    - name: County recorder bulk data
      purpose: Ownership and lien records
      criticality: hard
      data_types_transmitted: [public_records]
      dpa_or_baa_status: not_required
    - name: E-signature provider
      purpose: Purchase agreements and assignment contracts
      criticality: hard
      data_types_transmitted: [financial_terms, counterparty_pii]
      dpa_or_baa_status: signed

forge_operating_instructions:
  - forge_id: cre-forge
    module_id: property_lookup
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    version_sensitivity: major.minor
    content_hash: PENDING_AUTHORING
    authored_by: ivan
  - forge_id: cre-forge
    module_id: comp_analysis
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    version_sensitivity: major.minor
    content_hash: PENDING_AUTHORING
    authored_by: ivan
  - forge_id: cre-forge
    module_id: underwrite_deal
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    # An underwriting model that shifts behaviour in a patch release changes the
    # number a human signs off on. Worth decertifying for.
    version_sensitivity: major.minor.patch
    sensitivity_rationale: >-
      underwrite_deal returns a maximum allowable offer that a human relies on without
      independently recomputing. A patch-level change to its model is invisible in the
      output and would silently move every offer, so certification must not survive one.
    content_hash: PENDING_AUTHORING
    authored_by: ivan
  - forge_id: cre-forge
    module_id: buyer_match
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    version_sensitivity: major.minor
    content_hash: PENDING_AUTHORING
    authored_by: ivan
  - forge_id: cre-forge
    module_id: assign_contract
    instruction_version: 1.0.0
    forge_api_version: 1.4.0
    # major.minor, not major.minor.patch, and deliberately not inflated to match
    # underwrite_deal. Its hazard is a number a human relies on without recomputing:
    # a patch-level model change is invisible in the output and silently moves every
    # offer. This module's output is a contract record and a document sent for
    # signature. Nobody reads terms off a cached value - they are in the signed
    # document - and a template change surfaces loudly, because
    # create_contract_from_template validates the template's required_fields and
    # raises rather than producing a plausible artifact. High stakes, different
    # hazard; stakes are not a reason to inflate sensitivity.
    version_sensitivity: major.minor
    content_hash: PENDING_AUTHORING
    authored_by: ivan

triggers:
  - trigger_id: daily_records_sweep
    type: scheduled
  - trigger_id: owner_reply_received
    type: forge_webhook
  - trigger_id: analyst_pursues_candidate
    type: agent_initiated
    max_invocations_per_hour: 40
    max_chain_depth: 3
  - trigger_id: operator_requests_underwrite
    type: human_initiated

budget:
  monthly_usd_cap: 4000
  soft_cap_pct: 80
  hard_cap_action: pause
  per_agent_usd_daily_cap: 25
  per_task_usd_ceiling: 6
  cost_alert_recipients: [ivan@greencompanies.example]

human_capacity:
  # RENAMED 2026-09-16. The account's display_name became "Ivan Green" through
  # POST /api/humans/{id}/name, and the two move together: `human_name` and
  # `backup_human` are the only Pack fields resolved against `office_human`, by the
  # access overview's missing-people list and by the Approvals page attaching a
  # reviewer's decisions. Renaming only the account would have detached this
  # reviewer; renaming only the Pack would leave it naming nobody.
  - human_name: Ivan Green
    role: venture_operator
    # HOURS AS RULED, 2026-09-15: four for Greenstone, split three ways.
    #
    # Six was the unattributed original (B21). Four is the ruled figure, and the split is
    # the point: only `review_hours` is V13 supply. Two hours of underwriting and one of
    # seller calls and dispositions are real work and are not review, and declaring them as
    # coverage asserted review capacity that was committed elsewhere.
    #
    # The two underwriting hours are what Deal Underwriter's deferral costs. They are here,
    # as other_hours, rather than in the approval projection.
    coverage_hours: 4
    review_hours: 1
    countersign_hours: 0
    other_hours: 3
    timezone: America/Los_Angeles
    backup_human: Ira Green
    advisory_daily_approval_ceiling: 60
    median_review_minutes: 4
    auth_method: sso_mfa
    provenance:
      basis: declared
      established_by: Ivan
      # RULED 2026-09-16 (entry 112, ruling 2): a founder's own declaration is a source for
      # that founder's hours. What V39 flags is a figure with no ruling or measurement
      # behind it - and these four hours have one, named here rather than left implicit.
      source: >
        decisions.md entry 111 ruling 3, the ruled daily plan: Ivan Green 8h across all
        ventures - Burkham 1.5, Greenstone 4, MedLink Pro 1, Argus 1, Collingswood 0.5 -
        and entry 108 ruling 1 for the five-day operating week these hours sit in. The
        four here are that plan's Greenstone share, and entry 107 splits them: 1 review,
        2 underwriting, 1 seller calls and dispositions.
      detail: >
        Asserted when this Pack was authored and never attributed until now. Nothing
        measured these hours or this review time; no decision entry, validator doc or
        plan records where they came from. Recorded as declared rather than measured
        because that is what they are, and as the ORIGINAL rather than inherited because
        Burkham's identical block was copied from here. See blocking.md B21.
  # Replaced Dana 2026-09-15 (decisions entry 92). Dana was invented (entry 59): no
  # account, no person, and her 4h / 6 min were never attributed to anything. Ivan Green
  # and Ira Green are the only real people in Green Companies, and Ira is the only one of
  # them who can be compliance officer of record here without Ivan signing for himself.
  # `human_name` is the account's display_name exactly, because that is what the access
  # overview matches a Pack's people against.
  - human_name: Ira Green
    role: compliance_officer
    # HOURS AS RULED, 2026-09-15: two for Greenstone - one countersign, one review.
    #
    # COUNTERSIGN HOURS ARE SUBTRACTED FROM SUPPLY AND THEIR DEMAND IS NOT PROJECTED.
    # That is a gap, stated rather than closed. V13's demand is keyed to (workflow step,
    # module) - agent-originated proposals. A countersign is keyed to an artifact, an MAO or
    # an assignment agreement, authored by a human, and `proposal.office_agent_id` is NOT
    # NULL, so The Office cannot raise a human-authored item at all. Sizing this hour's
    # demand needs that surface first. Inventing a figure for it here would be the constant
    # 8 again, one field over.
    coverage_hours: 2
    review_hours: 1
    countersign_hours: 1
    other_hours: 0
    timezone: America/Los_Angeles
    backup_human: Ivan Green
    advisory_daily_approval_ceiling: 12
    median_review_minutes: 10
    auth_method: sso_mfa
    provenance:
      basis: declared
      established_by: Ivan
      # Same ruling. Two hours is Ira Green's Greenstone share of a 6h daily plan, and the
      # figure is a decision somebody made rather than an assertion nobody stands behind.
      source: >
        decisions.md entry 111 ruling 3, the ruled daily plan: Ira Green 6h across all
        ventures - Burkham 2, Greenstone 2, MedLink Pro 1, Argus 0.5, Collingswood 0.5 -
        and entry 107 splits the two here into 1 countersign and 1 review. The ten
        minutes a review is entry 92's ruling and remains unmeasured; this source is for
        the hours.
      detail: >
        Declared by Ivan on 2026-09-15 and not measured. Two hours a day because Ira is
        shared across Greenstone, Burkham, MedLink Pro, Argus and Collingswood, and
        Greenstone is not first in line for her attention. Ten minutes a review because
        six only holds for boilerplate wire releases the two-agent rule has pre-checked;
        LOI and PSA review, a deal-viability move from Green to Watch, and escalated
        novel outreach copy run ten to fifteen. The advisory ceiling is 120 minutes over
        10, twelve a day. V13 counts less than that: it applies the 0.6 utilisation
        factor, so the supply it sets against demand is 72 minutes, about seven reviews.
        If projected approvals exceed that, the stated remedy is fewer escalations, not
        more hours. Burkham's Pack separately declares Ira Green at 6 hours as its own
        compliance officer; the two declarations have not been reconciled (entry 92).

separation_of_duties:
  gate_signoff_policy: distinct_humans

availability:
  office_unreachable_behavior: degrade_to_propose
  audit_write_failure_behavior: fail_closed
  rto_minutes: 60
  rpo_minutes: 15

data_retention:
  - data_type: public_records
    retention: 7 years
    legal_basis: Business record
    deletion_mechanism: hard_delete
  - data_type: financial_terms
    retention: 7 years
    legal_basis: Contract and tax record
