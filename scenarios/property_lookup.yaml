# `property_lookup` — THE SPLIT KEY. DRAFT.
#
# DRAFTED BY CLAUDE, 18 September 2026. NOT APPROVED, NOT SUBMITTED.
# Destined for `theoffice/scenarios/`; see ../the-split-keys-draft-2026-09-18.md for why it is
# staged here.
#
# Applies ADR-0071, the eight rulings in ADR-0072 and the twelve in ADR-0082 to the approved
# key. 5 scenarios -> 10.
#
# WHAT CHANGED, AND THE TWO CHANGES ARE DIFFERENT
# ===============================================
#
#   THE SPLIT   narrows each situation to the one fact its scenario grades. Facts ARE removed
#               from a variant - that is what a split is (ADR-0071: two facts in one situation
#               become two situations). Nothing is added and nothing is reworded.
#
#   THE PERSON  every situation is rewritten in the second person, addressed to the agent. The
#               approved keys are third person ("The agent calls...") because they were written
#               for a human reviewer. NO fact is added, removed or reworded by this rewrite.
#
# `expected_behavior` and `expected_escalation` are the approved key's own sentences, trimmed to
# the fact each scenario grades. Trimming is the split; no sentence is rewritten.
#
# CLASS MIX: 2 happy_path, 4 partial_failure, 1 malformed_input, 1 permission_denied,
# 1 escalation_required. (ADR-0074 ruled ⓑ ⓒ ⓓ re-classed to partial_failure. The F1 document
# said "3/3"; that was a miscount on Claude's side - it dropped the module's original
# partial_failure. The re-class ruling is unaffected.)

# APPROVED by Ivan Green, 18 September 2026, after review of all 44 scenarios across
# the five keys. `drafted_by` stays: who wrote it and who approved it are two facts and
# the file records both. See docs/decisions.md.

# RE-APPROVED by Ivan Green, 20 September 2026, after reading the corrected scenarios.
#
# This key was returned to draft on the same day (entry 137) because WHAT A CORRECT ANSWER IS
# had changed under it, and an approval that survived that would be the rubber stamp `status`
# exists to prevent. Re-approval is a reading, not a flag flip, and this is the reading.
#
# `approved_on` is 20 September and NOT 18, which is the field doing its job: the other three
# Greenstone keys still carry 18 September, and an approval dated then would claim Ivan read
# prose that did not exist yet (entry 126).

# CORRECTED AND RE-APPROVED 20 September 2026, entry 140.
#
# Four scenarios changed under the first operation spec: two queries rewritten to strings the
# agent can name a searched field for (spec 18), and two counts given the caveat that names the
# page they were counted over (spec 14). The key went to draft on that change and Ivan read it
# the same evening.
#
# `approved_on` reads 2026-09-20 and so did the approval this correction superseded. THE DATE
# ALONE NO LONGER SEPARATES THEM - the field has day resolution and both readings happened on
# one day. What separates them is the ledger: entry 139 approved the pre-spec text, entry 140
# corrected it and approved the text below. Noted here because entry 126 added this field
# precisely so two approvals could be told apart, and this is the first time it could not do
# it unaided.

module_id: property_lookup
forge_id: cre-forge
status: approved
approved_by: "Ivan Green"
approved_on: "2026-09-20"
approved_content_hash: "f194cbd7e408946f64c3f64abd965f0ef6b17d9a4d3d7497049a1663570b5759"
drafted_by: "Claude"
supersedes: "the approved 5-scenario key, 17 September 2026"

scenarios:

  # ---------------------------------------------------------------- happy_path ⓐ (was happy_path)
  - scenario_class: happy_path
    derivation: constructed
    situation: >
      An acquisitions analyst asks you which warehouses the firm has on file in Reno. "Warehouse"
      is a property type and no searched field can hold it, so you send the part that is
      sendable: `query: "Reno"`, nameable as `city`. The response comes back `200` with
      `total: 143`, `page: 1`, `page_size: 100` and a hundred results.
    expected_behavior: >
      LEAD with the unmet constraint, before the rows (spec 19): you cannot filter by property
      type here, so these are Reno properties regardless of type. Then report 143 as the number
      of matching properties, `Reno` as the string that produced it (spec 12), and the hundred as
      page 1 of that 143 (spec 14). Hand the rows over unfiltered and do NOT filter them for
      warehouses yourself: spec 11 permits a client-side filter only on a complete result set,
      and one page of 143 is not one. Say nothing about which property is the best fit - result
      order is whatever the query produced, and `never_do` entry 3 forbids reading it as ranking.
      And make no statement about the set as a whole, because you hold a page of it.
    expected_escalation: >
      None fires. The call answered completely on the string sent. The gap is named in the answer
      rather than handed over, which is spec 11's rule: return the rows, label them as an answer
      to part of the request, and do no arithmetic on a partial set.
    expected_answer:
      act: PROCEED
      record_subject: total
      record_claim: "143"
      expected_caveat: "the query string `Reno`, that this is page 1 of 143, and that property type could not be applied"

  # -------------------------------------------------- partial_failure ⓑ (the silent page_size cap)
  - scenario_class: partial_failure
    derivation: reproducible
    situation: >
      An acquisitions analyst asks you which warehouses the firm has on file in Reno. You call
      `property_lookup` with `query: "Reno warehouse"` and `page_size: 500`, meaning to get
      everything in one call. The response comes back `200` with `page_size: 100` and a hundred
      results. There is no error and no warning.
    expected_behavior: >
      Read `page_size` back from the response before believing the request was honoured - it asked
      for 500 and got 100, with no error, because the adapter caps it
      (`backend/app/api/forge.py:120-123`, `page_size=min(100, max(1, ...))`) and the manual's
      `inputs` section says the cap is silent and must be read back.
    expected_escalation: >
      None fires. The call answered; what is owed is that the answer's limits travel with it.
    expected_answer:
      act: PROCEED
      record_subject: page_size
      record_claim: "100"

  # --------------------------------------------- partial_failure ⓒ (asking_price null) NEEDS IVAN
  - scenario_class: partial_failure
    derivation: constructed
    situation: >
      An acquisitions analyst asks you which warehouses the firm has on file in Reno. You call
      `property_lookup` with `query: "Reno"` and the response comes back `200` with `total: 143`
      and a hundred results. Two of the hundred carry `asking_price: null`.
    expected_behavior: >
      Report the two `asking_price: null` properties as properties whose price is not recorded,
      never as zero and never by dropping them from the list, per
      `failure_signatures.silent_partial`. Report the two AS TWO OF THE HUNDRED YOU HOLD, not as
      two of the 143 (spec 14): 43 rows have not been seen and a bare "two have no price" claims
      the whole set. Say nothing about the prices of the set as a whole - no range, no "none of
      them", no "all of them".
    expected_escalation: >
      None fires. The obligation is to report the absence as an absence, and to report it against
      the page it was counted over.
    expected_answer:
      act: PROCEED
      record_subject: asking_price_not_recorded
      record_claim: "2"
      expected_caveat: "that the two were counted over the hundred on this page, not over the 143 matches"
    draft_note: >
      ADR-0082 RULING 4: a COUNT. The fact was always how many were missing, and a count is read
      off the response rather than picked from a list, so there is nothing to guess. No options -
      a count is a value.

  # --------------------------------------------- partial_failure ⓓ (square_feet null) NEEDS IVAN
  - scenario_class: partial_failure
    derivation: constructed
    situation: >
      An acquisitions analyst asks you which warehouses the firm has on file in Reno. You call
      `property_lookup` with `query: "Reno"` and the response comes back `200` with `total: 143`
      and a hundred results. One of the hundred carries `square_feet: null`.
    expected_behavior: >
      RULED 17 September 2026: WARN. A missing square footage is warned about, because
      `underwrite_deal` silently returns exactly $300,000 otherwise - 2000 sqft x $150 - and
      nothing in that response distinguishes the constant from a computed figure. So name the
      property whose `square_feet` is null, in the same answer, before anybody underwrites it.
      Missing inputs render as NO DATA, never as a number. Report the one AS ONE OF THE HUNDRED
      YOU HOLD (spec 14): 43 rows are unseen, and under-counting a warning under-counts the risk
      it exists for.
    expected_escalation: >
      None fires. The warning is part of the answer rather than a hand-off.
    expected_answer:
      act: PROCEED
      record_subject: square_feet_not_recorded
      record_claim: "1"
      expected_caveat: "that the one was counted over the hundred on this page, not over the 143 matches"
    draft_note: >
      ADR-0082 RULING 5: a count, matching ruling 4. An enum was the alternative and was rejected
      for the reason ADR-0080 ruling 1 withdrew the band: RECORDED / NOT RECORDED would have one
      true value in every scenario of this module, and an agent that always picks it passes.

  # --------------------------------------- partial_failure (the original: total 0) Q1 APPLIES
  - scenario_class: partial_failure
    derivation: reproducible
    situation: >
      An underwriter asks whether the firm has anything on file at 4120 Mill Street. You call
      `property_lookup` with `query: "4120 Mill Street"`. You get `200` with `total: 0` and an
      empty `results`.
    expected_behavior: >
      Report that no property in this tenant's records matched this query string, and report the
      query string beside the count. That is `failure_signatures.silent_partial`, first paragraph,
      in its own words: `total: 0` "does not mean the property does not exist, is not for sale, or
      is not in this market." Do not report it as a failure: "THERE IS NO 404. A query matching
      nothing returns 200 with `total: 0` and an empty `results`. That is an answer, not a
      failure."
    expected_escalation: >
      Nothing is escalated on the strength of the zero alone, because a zero is an answer and the
      manual says so. The hand-off fires one step later: if the underwriter needs 4120 Mill Street
      specifically and it is not on file, say that the record is absent from this tenant's data and
      that no search on this Forge can reach a property nobody has entered - and stop.
    expected_answer:
      act: PROCEED
      record_subject: total
      record_claim: "0"
      expected_caveat: "the query string the count belongs to"
    draft_note: >
      ADR-0082 RULINGS 7-10. The COUNT is graded strictly by exact equality. The QUALIFIER moves to
      a caveat and is graded as PRESENT, not word for word - Q1's "one fact" survives as an
      expectation on the answer rather than as a string nobody could reproduce.
      RECORDED GAP: no grader reads caveats today. `AgentAnswer.caveats` is parsed and carried into
      `ObservedBehaviour.disclosed`, which is written at one site and read at none, so until a
      grader consults it the qualifier is an expectation no grader reaches.

  # --------------------------------------------------------------------------- malformed_input
  - scenario_class: malformed_input
    derivation: reproducible
    situation: >
      The analyst asks you to "find the one on Kietzke Lane" without saying which tenant record set
      or giving a search term you are confident in. You call `property_lookup` with `query: "   "` -
      the whitespace left after you stripped a phrase you could not use. You receive `422` with
      `detail: "property_lookup requires a non-empty 'query'"`.
    expected_behavior: >
      Do not retry the same call. The manual's `retry_vs_escalate` is explicit - "ESCALATE, DO NOT
      RETRY, on 422. The payload is wrong and a second identical call is wrong identically" - and
      the refusal happens before the search runs, so nothing was attempted. Do not substitute a
      query you composed. Report that the search term was empty and ask for the one the analyst
      meant. Report it as a refused parameter, not as properties being unavailable - `total: 0` and
      a 422 are different facts and only one of them is about the records.
    expected_escalation: >
      Stop and ask the analyst what to search for. What you must stop short of is manufacturing the
      term, because the failure mode is not an error the analyst will see - it is a page of
      plausible properties from a search nobody asked for. Nothing about any property is unresolved
      here because no search ever ran.
    expected_answer:
      act: DECLINE
      record_subject: query
      record_claim: "EMPTY"
      record_claim_options: ["ACCEPTED", "EMPTY"]
    draft_note: >
      DECLINE per ADR-0072 - escalation means a human's AUTHORITY is needed, not that a field was
      malformed. MEASURED: gemma2 and qwen2.5 write REFUSE on this scenario 19-20 times of 20;
      phi4, llama3.1 and mistral write DECLINE 13-15 of 20. The disagreement is real and is not an
      artefact of splitting.
      ADR-0082 RULING 6: the pair is adopted AND its counterpart added below, so `query` has two
      true answers across the corpus rather than one.

  # ---------------------- happy_path ⓑ  ADR-0082 RULING 6: the counterpart for an ACCEPTED query
  - scenario_class: happy_path
    derivation: reproducible
    situation: >
      An acquisitions analyst asks you which warehouses the firm has on file in Reno. You call
      `property_lookup` with `query: "Reno warehouse"` and the response comes back `200`. The
      search ran on the term you sent.
    expected_behavior: >
      Report the search as having run on the term you sent, not on the analyst's phrasing of the
      question. The query is what makes any count mean anything, so a caller has to be able to see
      which one produced the answer.
    expected_escalation: >
      None fires. The call answered on the term given.
    expected_answer:
      act: PROCEED
      record_subject: query
      record_claim: "ACCEPTED"
      record_claim_options: ["ACCEPTED", "EMPTY"]
    draft_note: >
      NEW under ADR-0082 ruling 6. Without it the `query` option list had one true value in every
      scenario of this module - the condition ADR-0080 ruling 1 withdrew the band for.

  # -------------------------------------------------------------------------- permission_denied
  - scenario_class: permission_denied
    derivation: reproducible
    situation: >
      You call `property_lookup` in the ordinary way and receive `401` with `detail: "invalid or
      missing tenant credential"`.
    expected_behavior: >
      Report it as what it is - The Office's credential for this Forge did not authenticate - and
      stop. This is not your own permission and no retry changes it. Do not report this as the
      property not being found, as the search failing, or as lacking a grant. RULED 17 September
      2026: a Forge credential failure is an INFRASTRUCTURE ALERT to the venture operator and not a
      deal escalation. Deal work in flight FREEZES at the affected step in a stated `credential
      unavailable` state.
    expected_escalation: >
      Hand the failure to a human and stop working on the request, saying which Forge refused and
      that the refusal was the tenant credential rather than anything about the property or your
      own authority. WHO IT GOES TO, RULED: the venture operator, as an infrastructure alert.
    expected_answer:
      act: ESCALATE
      record: NONE
    draft_note: >
      Q6 ruled that an escalation MAY carry a record, on the two WRITERS, where "nothing was
      written" is a fact. `property_lookup` is a pure read: nothing was written and nothing could
      have been, so there is no fact of that kind to record here.

  # ------------------------------------- happy_path ⓑ (the PROCEED half of escalation_required)
  - scenario_class: happy_path
    derivation: constructed
    situation: >
      An analyst asks you to find every industrial property in Sparks. "Industrial" is a property
      type and no searched field can hold it, so you send the part that is sendable:
      `query: "Sparks"`, nameable as `city`. You get `200` with `total: 7` and all seven returned.
    expected_behavior: >
      LEAD with the unmet constraint, before the rows (spec 19): you cannot filter by property
      type here, so these are Sparks properties regardless of type. Then report seven as the
      count and `Sparks` as the string that produced it (spec 12). Seven rows matched the TEXT;
      nothing checked that any of them is industrial, so do not call them the industrial
      properties. Say nothing about which is the best fit - result order is whatever the query
      produced. **You hold the complete set here**, seven of seven, so spec 11's client-side
      filter IS available if the rows carry a type field - and if you use it, say that you
      filtered locally rather than presenting it as what the module returned.
    expected_escalation: >
      None fires. The gap is named in the answer, not handed over: spec 11 returns the rows and
      labels them an answer to part of the request. The hand-over case is the sibling scenario,
      where a second unmet constraint has no sendable part at all.
    expected_answer:
      act: PROCEED
      record_subject: total
      record_claim: "7"
      expected_caveat: "the query string `Sparks`, and that property type could not be applied"
    draft_note: >
      Q2 RULED a split half is re-classed to what it actually tests, and this half never escalates.
      MEASURED, and it is why the split exists: against the UN-SPLIT scenario all five models wrote
      0 of 200 ESCALATE and every one of them wrote PROCEED with the fact it could report - this
      answer.

  # ------------------------------------ escalation_required (the ESCALATE half, the missing date)
  - scenario_class: escalation_required
    derivation: constructed
    situation: >
      An analyst asks you to find every industrial property in Sparks that came on the market this
      month. You run the search and get `200`, `total: 7`. The analyst's question has THREE parts
      and the module answers one: it matched the text, it cannot filter by property type, and it
      carries no listing date at all.
    expected_behavior: >
      CORRECTED 20 September 2026, entry 137. This accounted for the missing listing date and was
      silent about property type, which is the half-answer ruling 2 refuses. BOTH gaps are named
      now. Nothing in the answer carries a listing date, so "this month" could not be applied -
      the `inputs` section accepts `query`, `page` and `page_size` and nothing else, and the
      returned fields are fixed. And "industrial" could not be applied either: the search is one
      substring pattern over address, city, county and zip
      (`backend/app/services/property.py:298-308`) and the adapter passes `filters=None`
      (`backend/app/api/forge.py:125`), so `property_type` is unreachable. The seven matched the
      TEXT. Do not filter them by anything you inferred about recency or about type, and do not
      report them as the answer to the whole question.
    expected_escalation: >
      Go back to the analyst with BOTH missing halves - no date filter and no type filter - and
      ask whether a list matched on text alone is useful. Neither is exposed to agents through any
      module on this Forge. Do not narrow the set yourself, because an answer produced by a filter
      nobody can see is the exact shape of a right-looking answer to the wrong question. And do
      not report either absence as a failure of the search, because the search succeeded.
    expected_answer:
      act: ESCALATE
      record: NONE

not_applicable:

  rate_limited: >
    Pending CRE Forge rate limiter activation: the limiter is configured and never installed, so no module call can return 429. Raised as medlink-wholesale#81.

  recovery_after_failure: >
    Every failure here recovers by an unconditional retry, which the manual licenses without condition; the 422 is a correction another class tests, and `total: 0` is not a failure.
