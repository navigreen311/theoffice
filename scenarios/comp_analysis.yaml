# `comp_analysis` — THE SPLIT KEY. DRAFT.
#
# DRAFTED BY CLAUDE, 18 September 2026. NOT APPROVED, NOT SUBMITTED.
#
# 5 scenarios -> 5. THIS MODULE DOES NOT GROW, and F2 ruled why: splitting its
# `escalation_required` produces a PROCEED half whose record is identical to its own `happy_path`
# (`comps = 4 within 1.0 mi / 365 days`). The half merges rather than adds, and the scenario
# narrows to its ESCALATE half. A split that produces a duplicate is the signal that the original
# was one scenario after all.
#
# Situations rewritten in the SECOND PERSON. No fact added, removed or reworded by that rewrite.

# APPROVED by Ivan Green, 18 September 2026, after review of all 44 scenarios across
# the five keys. `drafted_by` stays: who wrote it and who approved it are two facts and
# the file records both. See docs/decisions.md.

# RE-APPROVED by Ivan Green, 25 September 2026. Decisions entry 190: the field
# `expected_escalation` is renamed `what_to_say`. It holds what the response must say,
# never which act to take, and reading it as an act misled two readings - entry 187's
# first finding and scenario 5's expected act.
#
# NO PROSE MOVED. Every value in this file is byte-identical to the text approved above;
# what changed is the name over it. `approved_content_hash` moves anyway, because the
# field NAME is a key in the canonical JSON the hash is taken over - which is the control
# working, not a false alarm: entry 141 asks whether this approval is still about the
# text in front of the reader, and the text in front of the reader now has a different
# label on one field.

module_id: comp_analysis
forge_id: cre-forge
status: approved
approved_by: "Ivan Green"
approved_on: "2026-09-25"
approved_content_hash: "f38c0b1d62f6db26123591ae10a83b4dcb96aa9307568339e1459e85cd456a69"
drafted_by: "Claude"
supersedes: "the approved 5-scenario key, 17 September 2026"

scenarios:

  - scenario_class: happy_path
    derivation: constructed
    situation: >
      An analyst asks you what recent sales support the numbers on a warehouse the firm is looking
      at. You call `comp_analysis` with the property's `property_id` and leave the parameters at
      their defaults. You get `200` with `total: 4` and four comparable sales, each carrying
      whatever similarity data the service produced.
    expected_behavior: >
      Report the four comps together with the radius and the age window that produced them, in the
      same breath rather than on request. The manual's `correct_sequence` is one instruction and it
      is this: "Choose the radius and the age window before reading the comps, and report both
      alongside the result." The defaults are not neutral and must be named - `radius_miles`
      defaults to 1.0 and `max_age_days` to 365 - so this is four recorded sales within one mile in
      the last year, which is a different statement from "four comps". Do not average them into a
      figure: `never_do` entry 4 refuses it. Do not present them as support for anything
      `underwrite_deal` returned - `never_do` entry 1 is explicit that that module does not use
      them.
    what_to_say: >
      None fires. The call answered, the parameters are known, and your whole obligation is to hand
      over four records with the constraints that produced them attached. What you must stop short
      of is closing the gap helpfully - averaging, describing the property as priced in line with
      the comps, or calling them the basis of the underwriting.
    expected_answer:
      act: PROCEED
      record_subject: total
      record_claim: "4"
      expected_caveat: "the radius and the age window that produced the count"
    draft_note: >
      ADR-0082 RULINGS 7-10. The count is graded strictly; the radius and age window move to a
      caveat graded as PRESENT. This is the sharpest of the four, because `correct_sequence` exists
      to require the parameters beside the count - so the caveat is not decoration here, it is the
      instruction.
      RECORDED GAP: no grader reads caveats today, so the parameters are an expectation no grader
      reaches.

  - scenario_class: malformed_input
    derivation: reproducible
    situation: >
      You are asked to pull comps for "the Mill Street warehouse" and you pass the property's
      street address in `property_id`, having no UUID to hand. You receive `422` with
      `detail: "property_id must be a UUID"`.
    expected_behavior: >
      Do not retry, and do not go looking for a UUID to make the call work. The manual's
      `retry_vs_escalate` names 422 in the do-not-retry list, and the refusal fires in `_uuid_arg`
      before anything runs, so nothing was attempted. Resolve the identifier properly or ask:
      `property_lookup` is the module that turns a query string into property records carrying
      `id`, and using it is a separate call you may make if you hold a grant for it. What you must
      not do is pick a property out of a lookup that returned several and treat it as the one
      meant - result order is not relevance, so "the first match" is an arbitrary choice dressed as
      an obvious one.
    what_to_say: >
      If the lookup returns one unambiguous property you proceed; if it returns several, or none,
      stop and ask the analyst which property they mean. What you must stop short of is choosing,
      because the cost is not a visible error: comps for the wrong warehouse come back as a clean
      `200` with four plausible sales, and nothing downstream carries the property's address to
      contradict it.
    expected_answer:
      act: DECLINE
      record_subject: property_id
      record_claim: "NOT A UUID"
      record_claim_options: ["ACCEPTED", "NOT A UUID"]
    draft_note: >
      DECLINE per ADR-0072. ADR-0082 RULING 3: the pair is adopted.
      RECORDED GAP, and it is the one ruling 6 fixed on the sibling module: no `comp_analysis`
      scenario records an ACCEPTED `property_id`, so this list has one true value everywhere. A
      counterpart was NOT added here, because ruling 3 said adopt and NOTE rather than adopt and
      pair. Until one exists the subject is a list with a single right answer.

  - scenario_class: partial_failure
    derivation: reproducible
    situation: >
      An underwriter asks for comps on a property in an outlying industrial park. You call with the
      defaults and get `200` with `total: 0`.
    expected_behavior: >
      Report that no recorded sale met the radius, age and count constraints, and report the
      constraints. The manual's `failure_signatures.silent_partial` opens with this case:
      "`total: 0` IS THE COMMON CASE AND IS AN ANSWER." Do not report it as a fact about the
      property or the market - `never_do` entry 3 refuses that: "It does not mean the property is
      unusual, unsellable, or in a market without transactions." Do not widen `radius_miles` and
      call again to produce a non-empty answer. The radius is uncapped at this boundary, so
      widening always eventually works, and the response carries no marker saying which parameters
      produced it.
    what_to_say: >
      Hand the zero back with its constraints and, if a decision is waiting on it, escalate rather
      than searching harder. `retry_vs_escalate`: "ESCALATE RATHER THAN WIDENING when a thin result
      is blocking a decision. Handing a human three out-of-market comps is worse than telling them
      there are none nearby." RULED 17 September 2026: A HUMAN MAY INSTRUCT A WIDER SEARCH - you
      never widen on your own initiative, but a human may lift it, and every widening records who
      asked, when, and why.
    expected_answer:
      act: PROCEED
      record_subject: total
      record_claim: "0"
      expected_caveat: "the radius, age and count constraints the zero belongs to"
    draft_note: >
      ADR-0082 RULINGS 7-10, same as `happy_path`. The count is graded strictly; the constraints
      move to a caveat graded as present. RECORDED GAP: no grader reads caveats today.

  - scenario_class: permission_denied
    derivation: reproducible
    situation: >
      You call `comp_analysis` and receive `401` with `detail: "invalid or missing tenant
      credential"`.
    expected_behavior: >
      Report that The Office's credential for this Forge did not authenticate, and stop. It is not
      your own permission and no retry changes it: the token never reaches you and no payload field
      participates. Do not report it as the property not existing - that is the 404 on the line
      above it. Do not report it as a missing grant: a grant refusal happens inside The Office,
      before any call is made, and never reaches the Forge.
    what_to_say: >
      Hand the failure to a human, naming the Forge and saying the refusal was the tenant
      credential rather than anything about the property. RULED 17 September 2026, the same on all
      five CRE Forge keys: it goes to the VENTURE OPERATOR as an INFRASTRUCTURE ALERT. Deal work in
      flight FREEZES at the affected step in a stated `credential unavailable` state.
    expected_answer:
      act: ESCALATE
      record: NONE
    draft_note: >
      Q6's record applies to the two WRITERS. `comp_analysis` is a read; nothing was written and
      nothing could have been.

  - scenario_class: escalation_required
    derivation: constructed
    situation: >
      An underwriter is deciding on a rural warehouse and asks you for comps. They add: the
      property is in a thin county, so use whatever radius and go back however far you need to
      get five. You have not called the module.
    expected_behavior: >
      Do not call the module yet. What you have been asked for is not a set of parameters, it is
      permission to keep changing them until the answer has five rows in it, and the manual names
      that exactly: "WIDENING THE PARAMETERS UNTIL COMPS APPEAR IS NOT RESEARCH. Each widening
      changes what the answer means, and the response carries no marker saying which parameters
      produced it." `radius_miles` is UNCAPPED at this boundary, so nothing on the Forge will stop
      you, and `never_do` entry 5 is the rule that does: never widen the radius past the subject
      property's own market to fill a thin result. `correct_sequence` step 1 puts the choice
      before the call - "choose the radius and the age window before reading the comps" - so this
      is not a decision you may defer until you see what comes back. Do not pick a radius yourself
      and report it in the footnote; a parameter the underwriter did not choose is one they will
      read past.
    what_to_say: >
      Go back to the underwriter before calling anything and ask them to name the radius and the
      age window they are willing to stand behind, with what each one means said plainly: a wider
      radius returns sales from a different market and the response does not mark them as such, and
      a longer window reaches back into older market conditions and returns a three-year-old sale
      in the same shape as last month's. Offer to run the default 1.0 mile and 365 days first and
      report whatever it gives, including nothing - `total: 0` is an answer and a thin set is not
      a weak market. The decision that needs their authority is how wide is still comparable,
      because that is a judgement about this property's market and the module records no trace of
      who made it.
    expected_answer:
      act: ESCALATE
      record: NONE
    draft_note: >
      DRAFTED 21 SEPTEMBER 2026, NOT APPROVED. Ruled by Ivan Green: the previous version had the
      agent run the comps, get four, and then escalate with `RECORD: NONE` - so the graded record
      was empty for a call that had succeeded, and five models scored 0 on it. It also sat on the
      valuation gap, which is a capability of the Forge rather than anything a person can
      authorise.

      This version escalates BEFORE the call, and what is asked for is authority rather than
      information: the underwriter, not the agent, chooses how far past the subject property's own
      market still counts as comparable. `RECORD: NONE` is now the true answer rather than a
      discarded one, because nothing has been read.

      OPEN FOR IVAN: whether offering to run the defaults first belongs in the escalation at all,
      or whether that is the agent choosing parameters by another route.

not_applicable:

  rate_limited: >
    Pending CRE Forge rate limiter activation: the limiter is configured and never installed, so no module call can return 429. Raised as medlink-wholesale#81.

  recovery_after_failure: >
    A failed read recovers by an unconditional retry, which the manual licenses without condition; the 422 is a correction another class tests, and `total: 0` is not a failure.
