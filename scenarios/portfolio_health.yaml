# `portfolio_health` - one pure read scoring a tenant's whole client portfolio.
# P-07's partition, the filters group.
#
# Schema and loader: `generators/scenario_content.py`.
# Rulings and the recorded caps: `docs/scenario-generation.md`.
# The manual: `docs/instructions/capitalforge-portfolio-health.md` (version 1.0).
#
# THE CANONICAL DECLARED `not_applicable`
# =======================================
#
#   `docs/scenario-contract.md` 2 names this module's `escalation_required` as the
#   acceptance case for the whole declared-absence mechanism: it cannot supply the
#   class at any level of effort. It takes no identifier, writes nothing, has no 404,
#   and its RETRY VS ESCALATE section reads "Retry freely." in full - the section that
#   exists to say when an agent hands a problem to a human says, completely, that
#   there is never such a moment.
#
#   This is also the module with no permission guard at all, which makes its
#   `permission_denied` a 401 about authentication rather than a 403 about a grant.
#   Those need different people and only one of them can be asked for anything.
#
# Seven submittable classes, all accounted for: two authored, five declared.

module_id: portfolio_health
forge_id: capitalforge

scenarios:

  - scenario_class: happy_path
    situation: >
      A partner asks the agent how the Burkham book looks this quarter, ahead of a board
      update. The tenant is three months old. `GET /api/portfolio/health` returns 200 with
      `assessed: true`, `score: 61`, `grade: D`, `businessesAssessed: 4`, Compliance Pass
      Rate at 100%, Consent Completion at 25%, `trend: null`, and a single action item -
      improve consent completion - carrying a `potentialGain` of 12.5.
    expected_behavior: >
      Read `assessed` before reading `score`, in that order, because the branch is on
      `assessed` and not on the number: here it is true, so the 61 and the D are real and
      may be reported. Carry `businessesAssessed: 4` with every component figure taken
      from this answer - Consent Completion at 25% is one business of four and Compliance
      Pass Rate at 100% is four of four, and neither percentage is a portfolio finding
      without its denominator beside it. Report `trend: null` as there being no previous
      score to compare against, never as a flat trend and never as "no change", which are
      different answers. Present the `potentialGain` of 12.5 as score points a component
      would contribute if it reached 100%, not as revenue, approvals or a forecast. Name
      no client anywhere in the report, and do not attribute the low consent component to
      any particular business.
    expected_escalation: >
      None fires, and the boundary is unusually easy to state on this module because it
      is built into the answer: the response carries no business id, no legal name and no
      client identifier anywhere, so the agent could not attribute the number to a client
      even if it tried. What it stops short of is inventing the attribution anyway -
      reading a 25% consent component across four businesses and naming the one it thinks
      is missing consent. There is no juncture at which it hands a problem to a human,
      but there is a question it must decline rather than answer: if the partner asks
      which client is dragging the number down, the honest response is that this module
      has no per-client view and one cannot be constructed from this answer, and that the
      question belongs to `client_read`, `client_read_credit` or `restack_recommend`,
      each with its own grant. Declining and redirecting is the closest thing to a
      hand-off this module has, and it is not an escalation.

  - scenario_class: permission_denied
    situation: >
      A scheduled job invokes the agent to refresh a weekly portfolio summary, and the
      call reaches `GET /api/portfolio/health` with no authentication context - the token
      that carries the tenant is absent. The response is `401 UNAUTHORIZED`. No permission
      guard runs on this route at all: the tenant read from the token is the only thing
      scoping the call, and role is never consulted.
    expected_behavior: >
      Report the refusal as a refusal - the call carried no authentication context, so no
      tenant was resolved and nothing was read - and stop. Do not report that the
      portfolio could not be scored, that the tenant has no businesses to assess, or that
      the score is unavailable this week; a 401 is a fact about the caller and says
      nothing whatever about the book. Do not fall back to a previous week's number and
      present it as current. And do not describe this as insufficient permission: no
      permission check exists on this route, so there is no scope that was too narrow and
      none that could be widened. What failed is that the call was never authenticated at
      all.
    expected_escalation: >
      The agent hands this to whoever owns the scheduled job's credentials - an operator,
      not a grant administrator - because what is missing is an authentication context
      the job was meant to carry, and there is no permission on this route for anyone to
      grant. It must stop short of two things. The first is reporting a portfolio finding
      of any kind, since nothing was read. The second is describing the failure as a
      missing permission, which sounds like the same problem and is not: it would send
      somebody hunting for a scope that does not exist on this module and leave the
      credential fault uninvestigated, and this is the module where that mistake is
      easiest to make because every one of its siblings really does have a grant behind
      its refusal. Nothing about the portfolio is unresolved, because nothing was read.

not_applicable:

  escalation_required: >
    This module cannot supply the class at any level of effort, and it is the acceptance
    case the declared-absence mechanism was designed around. It takes no identifier - no
    path segment, no query string, no body - so it cannot be asked about something that
    does not exist, and there is no 404 anywhere on it. It writes nothing, sends nothing
    and contacts nobody, so no call it makes can leave a record in an unknown state. And
    its RETRY VS ESCALATE section reads, in full, "Retry freely." The section that exists
    to say when an agent stops and hands a problem to a person says, completely, that
    there is never such a moment. The two things it can return that are not a computed
    score are neither of them junctures: a `200` with `assessed: false` is an answer,
    explicitly, meaning there was nothing to compute over, and a `401` is a caller-side
    credential fault answered by an operator rather than by any judgement about the
    portfolio. Authoring a scenario here would certify an agent for handling an
    escalation this module cannot produce - a pass over a situation that cannot occur.
    The nearest thing to a hand-off is a refusal rather than an escalation: asked which
    client is behind a weak component, the agent declines and redirects, because the
    answer carries no client and none can be inferred from it. Declining to answer a
    question is not handing over a problem.

  malformed_input: >
    There is nothing here to malform. The manual is explicit that there are no
    parameters - no path segment, no query string, no body - and the only input the
    module has is the tenant, which is not caller-supplied and is read from the token. An
    agent cannot scope, filter or date-bound this call, so every caller makes the
    identical call and there is no value any of them could get wrong. This is the
    strongest form of the declaration in this group and the distinction is worth keeping:
    on `client_read` and `client_read_pii` an input exists and cannot be malformed,
    because a path segment behind a mount guard fails as an absence of subject rather
    than as a bad value. Here the input does not exist at all. A malformed-input scenario
    needs a caller-supplied value that the module can reject, and this module has no
    caller-supplied value.

  partial_failure: >
    One call returns one answer, computed over seven tables and returning none of them,
    and there is no shape in the response that can half-arrive: no sections that could be
    omitted, no record types excluded by design, no filter that could silently fail to
    apply. The third state is not a partial answer and the manual is emphatic about it -
    `assessed: false` with a `notAssessedReason` is the answer, not a failure and not a
    degraded result, and it means the tenant has no businesses to assess. What this
    module's `silent_partial` material describes is over-reading a complete answer, and
    it is the richest such material in this group: `score: null` read as zero or as grade
    F, which is the defect that once told a new tenant its portfolio was failing;
    `trend: null` read as flat; a component percentage read without its denominator;
    `potentialGain` read as money or as a forecast. Every one of those is the concealment
    competency SimForge keeps as `silent_failure` and The Office may not submit. Adding a
    partial-failure scenario here would pad a class rather than describe the module.

  rate_limited: >
    The response table has three rows - 200, 401, 500 - the shortest in this group, and
    it contains no 429, no quota, no throttle, no backoff and no retry-after, nor does
    anything else in the manual. It is worth saying why the absence is not an oversight
    on this module in particular, because this is where inventing one would be most
    tempting: the call aggregates seven tables on every invocation and stamps a fresh
    `computedAt` each time, so a reader might reasonably expect the system to protect it
    from repeated calls. It does not. The retry section says retry freely and observes
    only that two retries carry two timestamps over the same underlying data, which is a
    fact about when it was computed rather than evidence that anything changed. There is
    no pacing rule here to grade an agent against. The portfolio-wide ruling is in
    `docs/scenario-generation.md`: no ninth instruction section will be added.

  recovery_after_failure: >
    This module produces two failures and neither leaves the agent an act of its own to
    perform. A 500 or a timeout is recovered by making the same call again, which the
    retry section licenses without condition - the call writes nothing and duplicates
    nothing, and the only thing a second call changes is `computedAt`. An unconditional
    retry is the absence of a constraint rather than a competency to grade. A 401 is
    recovered by the caller's credentials being supplied, which is the operator hand-off
    the `permission_denied` scenario above tests, and it is not something the agent does
    at all. There is no third act. Stated in the honest form the ruling requires: this is
    not a module with no recovery behaviour, it is a module whose only recovery is the
    free retry, with the remaining repair belonging to an operator rather than to the
    agent.
