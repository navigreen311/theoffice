# Production.
#
# Restart policy, log rotation and resource limits. Nothing here changes behaviour -
# anything that did would make staging a rehearsal of a different system.

x-logging: &logging
  # Without this the JSON log driver grows until the VM's disk is full, and the first
  # symptom is Postgres refusing writes - which on this system means refusing to append
  # to the audit chain.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    logging: *logging
    shm_size: 256mb
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB

  api:
    logging: *logging
    environment:
      POOL_MAX_SIZE: 20
    deploy:
      resources:
        limits:
          memory: 1g

  console:
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 768m

  caddy:
    logging: *logging

  sweeps:
    logging: *logging
