name: CI

# Seven jobs, and the one that matters most is `tests` — because most of this
# repository's controls ARE tests. The write-surface pin, the SimForge no-read-path
# check, the persona-body scan and the validator meta-test are not documentation about
# controls; they are the enforcement. Until now they only fired when somebody remembered
# to run them locally.
#
# The specific failure this workflow is built to prevent is a **false green**, and this
# codebase has a ready-made way to produce one: every database test is guarded by
# `requires_db`, which SKIPS when the DSNs are unset. A misconfigured Postgres service
# would not fail the run — it would report a tidy green over several hundred tests that
# never executed. So `tests` refuses to pass if anything skipped.
#
# The `smoke` job is the second half of that. `next build` passing is not evidence the
# app runs: the revocation page compiled, type-checked and threw at render because a
# React 19 hook does not exist in React 18. Only a real request found it, and until now
# only on one machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # 22, not 20: `scripts/hydration-check.mjs` drives Chrome over CDP using the
  # WebSocket Node exposes globally from 22 onwards, so the check needs no
  # dependency of its own. On 20 the step died with `WebSocket is not defined`.
  # GitHub has also been annotating every run here to say 20 is deprecated.
  NODE_VERSION: "22"

  # Throwaway credentials for an ephemeral service container that lives for the length
  # of one job and listens only on the runner's loopback. These are not secrets and
  # putting them in Actions secrets would buy nothing while making a fresh clone unable
  # to run its own CI. The rule they do not break: no real credential is ever committed.
  OFFICE_APP_PASSWORD: ci-office-app-not-a-secret
  OFFICE_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/theoffice
  OFFICE_APP_DSN: postgresql://office_app:ci-office-app-not-a-secret@127.0.0.1:5432/theoffice

  # The stub Forge is in-process. This exists so the env-backed credential resolver has
  # something to resolve, and is never a real token.
  STUB_FORGE_TOKEN: stub-forge-test-token

jobs:
  # --------------------------------------------------------------------- lint
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      # Same three packages bootstrap.sh checks. `tests/` is deliberately outside strict
      # mypy: the fixtures are untyped by convention and annotating them would be noise
      # on code whose contract is the assertion it makes.
      - name: Mypy (strict)
        run: python -m mypy broker client generators

      # The shell scripts are load-bearing — bootstrap.sh is how anybody stands this up,
      # and console-smoke.sh is the only thing that proves the console renders.
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  # -------------------------------------------------------------------- tests
  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 16 is the blueprint target. Local development runs 17.9; pinning
        # the target here means a version-specific regression surfaces in CI rather
        # than at deployment.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theoffice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Migration 0002 creates the office_app role from OFFICE_APP_PASSWORD, so the
      # runtime DSN above only resolves after this step.
      - name: Migrations
        run: python -m alembic upgrade head

      - name: Ledger partitions
        # bootstrap.sh does this for local development. A DEFAULT partition exists, so
        # nothing breaks without them — which is exactly why CI should create them too:
        # otherwise CI silently exercises a different storage layout from every
        # developer machine.
        run: |
          python - <<'PY'
          import psycopg, os
          with psycopg.connect(os.environ["OFFICE_ADMIN_DSN"]) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT ensure_ledger_partition(date_trunc('month', now())::date)"
                  )
                  cur.execute(
                      "SELECT ensure_ledger_partition("
                      "  (date_trunc('month', now()) + interval '1 month')::date)"
                  )
              conn.commit()
          print("ledger partitions ensured")
          PY

      - name: Pytest
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Refuse a green run that skipped the database suite
        # THE POINT OF THIS JOB. `requires_db` skips every database test when the DSNs
        # are unset or wrong, and a skipped test is reported as a pass by every summary
        # anybody looks at. A broken service container would turn several hundred real
        # assertions into a green tick, and nothing in the output would say so.
        #
        # Zero skips is the correct threshold rather than a lenient one: the suite has
        # no legitimately skipped test, so any skip is a configuration failure.
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          tree = ET.parse("pytest-results.xml")
          suite = tree.getroot().find("testsuite") or tree.getroot()
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0))
          errors = int(suite.get("errors", 0))

          print(f"{total} tests, {skipped} skipped, {failures} failed, {errors} errored")

          problems = []
          if total == 0:
              problems.append("no tests ran at all")
          if skipped:
              problems.append(
                  f"{skipped} test(s) skipped. Every database test is guarded by "
                  "requires_db, so a skip here means the Postgres service was not "
                  "reachable and this run proved nothing."
              )
          if failures or errors:
              problems.append(f"{failures} failure(s), {errors} error(s)")

          if problems:
              print("REFUSING TO PASS: " + "; ".join(problems), file=sys.stderr)
              sys.exit(1)
          PY

  # --------------------------------------------------------------- migrations
  migrations:
    name: Migrations are reversible
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theoffice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Every migration in this repository claims to be reversible and several commit
      # messages say so. A claim nobody exercises is a claim, and the day it matters is
      # the day a deployment needs to go backwards under pressure.
      #
      # Round trip twice: a downgrade that leaves a function, trigger or grant behind
      # usually fails on the SECOND upgrade rather than the first.
      - name: Up, down, up, down, up
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current

      - name: Head is a single revision
        # Two heads means someone branched the migration chain, which produces a
        # database whose schema depends on the order Alembic happened to pick.
        run: |
          heads="$(python -m alembic heads | grep -c '(head)' || true)"
          if [ "$heads" -ne 1 ]; then
            echo "expected exactly one migration head, found $heads" >&2
            python -m alembic heads
            exit 1
          fi
          echo "one head"

  # ------------------------------------------------------------------ console
  console:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      - name: Vitest
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # `next build` passing is not evidence the app runs — a React 19 hook in a React
      # 18 app compiled, type-checked and threw at render. It is still worth running,
      # because it catches the other half. The half it cannot catch is the `smoke` job.
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint


  # -------------------------------------------------------------------- smoke
  smoke:
    name: Smoke - the console actually renders
    runs-on: ubuntu-latest

    # The most expensive job here, and the only one that answers the question the
    # others cannot: does a real request to a real server return a real page.
    #
    # `console` proves the code compiles and type-checks. This proves it renders, that
    # an unauthenticated request redirects rather than serving a page, that the bearer
    # token stays out of the HTML, and that a persona body reaches no rendered page. A
    # compiled bundle can fail every one of those.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theoffice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install node
        working-directory: console
        run: npm ci

      - name: Migrations
        run: python -m alembic upgrade head

      # No .env on a runner. The script reads one when it exists and falls back to the
      # environment when it does not, which is why these are the workflow-level values
      # and not a file written by a step.
      - name: Smoke
        run: ./scripts/console-smoke.sh

      # The script tears down its own servers and deletes its scratch directory, so
      # there is nothing to upload on success. On failure it has already printed the
      # relevant log tail itself - a wait that times out dumps the server log rather
      # than leaving somebody to guess which of thirty checks went first.

  # ------------------------------------------------------------------ images
  images:
    name: Images build
    runs-on: ubuntu-latest

    # A Dockerfile that only looks right is the same class of error as a build that
    # compiles and throws at render. Both images are built on every PR so a broken one
    # fails here rather than during a deploy, which is the worst moment to find out.
    #
    # Build only. Nothing is pushed and nothing is deployed - `scripts/deploy.sh` builds
    # on the target VM, so there is no registry in this design to push to.

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: theoffice-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Console image
        uses: docker/build-push-action@v6
        with:
          context: ./console
          file: console/Dockerfile
          push: false
          load: true
          tags: theoffice-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that builds and cannot start is a Dockerfile that passed review. Both
      # entrypoints are exercised: the API answers its own liveness probe, and the
      # console serves the one page that renders without a session.
      - name: The API image starts and answers /api/live
        run: |
          docker run -d --name api-probe -p 18080:8080             -e OFFICE_APP_DSN=postgresql://unused:unused@127.0.0.1:5432/unused             theoffice-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/live >/dev/null 2>&1; then
              echo "api image is live"
              exit 0
            fi
            sleep 2
          done
          echo "the API image never answered /api/live" >&2
          docker logs api-probe >&2
          exit 1

      - name: The API image runs as a non-root user
        # Everything in this system is about who is allowed to do what. An image running
        # as root undoes that at a layer below any of it.
        run: |
          who="$(docker run --rm theoffice-api:ci id -un)"
          [ "$who" = "office" ] || { echo "API image runs as $who, expected office" >&2; exit 1; }
          echo "api runs as $who"

      - name: The console image starts and serves /login
        run: |
          docker run -d --name console-probe -p 13000:3000             -e OFFICE_API_URL=http://127.0.0.1:1 theoffice-console:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:13000/login >/dev/null 2>&1; then
              echo "console image serves /login"
              exit 0
            fi
            sleep 2
          done
          echo "the console image never served /login" >&2
          docker logs console-probe >&2
          exit 1

      - name: The console image runs as a non-root user
        run: |
          who="$(docker run --rm theoffice-console:ci id -un)"
          [ "$who" = "node" ] || { echo "console image runs as $who, expected node" >&2; exit 1; }
          echo "console runs as $who"

      - name: Compose configuration is valid for both environments
        env:
          POSTGRES_PASSWORD: ci-not-a-secret
          OFFICE_APP_DSN: postgresql://office_app:ci-not-a-secret@db:5432/theoffice
          OFFICE_DOMAIN: office.invalid
        run: |
          docker compose -f compose.yaml -f compose.staging.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.prod.yaml config >/dev/null
          echo "both overlays valid"

  # ------------------------------------------------------------------ secrets
  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The operating contract for this project says a real secret is never printed or
      # committed, and that credential_ref stores a vault path rather than a value. That
      # is a rule a human enforces in review today, which means it is enforced until the
      # review that is in a hurry.
      #
      # Deliberately narrow: it looks for a committed .env and for assignments that look
      # like real values rather than placeholders. A broad entropy scanner would fire on
      # every content hash in the golden snapshots and be switched off within a week.
      - name: No .env is committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "REFUSING: .env is tracked. It holds real credentials." >&2
            exit 1
          fi
          echo "no .env in the index"

      - name: Credential-shaped assignments outside the example file
        run: |
          pattern='(PASSWORD|TOKEN|SECRET|API_KEY)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9/+_-]{16,}'
          if matches="$(grep -rInE "$pattern" \
                --exclude-dir=.git \
                --exclude-dir=node_modules \
                --exclude-dir=.next \
                --exclude-dir=.venv \
                --exclude-dir=__pycache__ \
                --exclude=package-lock.json \
                --exclude=ci.yml \
                . | grep -vE 'YOUR_[A-Z_]+_HERE|stub-forge-test-token|not-a-secret')"; then
            echo "REFUSING: credential-shaped values found." >&2
            echo "$matches" >&2
            echo "Use a YOUR_..._HERE placeholder, or a vault ref." >&2
            exit 1
          fi
          echo "no credential-shaped assignments"
